, 트랑 &amp; 나디아의 방 / 저녁\n생성 22초 · 본편 사용 22.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n끝 컷의 연출: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC005 [0.000–5.800초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L09 [0.060–3.125초] — 엄마 (@Audio1)\n“반가워요! 저는 트랑 엄마예요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L10 [3.327–5.638초] — 엄마 (@Audio1)\n“나디아는 어느 나라 사람이에요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC006 [5.800–14.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.800초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [5.800초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.\n전환 이유: 나디아가 인사만 하던 룸메이트에서 직접 질문하는 통화 참여자로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L11 [5.860–8.767초] — 나디아 (@Audio2)\n“저는... 인도네시아 사람이에요.”\n발화 S03-L12 [8.993–11.078초] — 엄마 (@Audio1)\n“아~ 인도네시아 사람이군요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L13 [11.260–14.343초] — 나디아 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S03-BC007 [14.467–22.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 병원 배경·가운·청진기가 남는 폰 화면. 문단별로 같은 인서트를 쪼개지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n전환 이유: 직업 답변에서 개인적인 취향으로 말투와 자세가 달라지는 발화 흐름을 유지한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L14 [14.527–16.050초] — 엄마 (@Audio1)\n“저는 의사예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L15 [16.260–18.483초] — 엄마 (@Audio1)\n“저는 한국 드라마 좋아해요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L16 [18.660–21.849초] — 엄마 (@Audio1)\n“현빈 팬이에요. 현빈은 배우예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 22.000초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC005.mp4", "poster": "media/previs_v009/S03-BC005.png", "label": "S03-BC005 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 5.8, "framing": "영상 통화 화면", "angle": "스마트폰 화면 정면", "leaf": true, "source_shot_ids": ["S03-FC012"], "prompt_group": "SEQ08", "revision": "d3afbb69e00ebc30176c632674d4235115dcdf37f2ed6ab80dc2074a9c442c72"}, {"id": "S03-BC006", "parent": "S03", "kind": "shot", "kindLabel": "샷", "title": "S03-BC006", "summary": "나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.", "body": "\u003cp>나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.\u003c/p>\u003cp>구도: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\u003c/p>\u003cp>관계: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\u003c/p>\u003cp>배치: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\u003c/p>\u003cp>전환: 나디아가 인사만 하던 룸메이트에서 직접 질문하는 통화 참여자로 바뀐다.\u003c/p>\u003cp>관계 투숏 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 30mm · 설계값\u003c/p>\u003cp>나디아: 저는... 인도네시아 사람이에요.\u003c/p>\u003cp>엄마: 아~ 인도네시아 사람이군요.\u003c/p>\u003cp>나디아: 저는 학생이에요. 직업이 뭐예요?\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S03-BC006.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S03.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 03:12 — 침대 전경과 책상 중경의 깊이를 참고하고 최신 원문의 위치·행동을 우선한다.\u003c/p>\u003cp>Friends.10x13.The.One.Where.Joey.Speaks.French.avi · 04:45–04:54 — 나란한 투숏과 높이·깊이가 다른 투숏을 구분한다.\u003c/p>\u003cp>기존 샷: S03-FC014\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ08 · S03-BC005, S03-BC006, S03-BC007\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ08/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ08/SEQ08_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ08/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ08/SEQ08_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ08_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ08/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ08/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ08/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 08 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 22초 · 본편 사용 22.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n끝 컷의 연출: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC005 [0.000–5.800초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L09 [0.060–3.125초] — 엄마 (@Audio1)\n“반가워요! 저는 트랑 엄마예요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L10 [3.327–5.638초] — 엄마 (@Audio1)\n“나디아는 어느 나라 사람이에요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC006 [5.800–14.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.800초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [5.800초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.\n전환 이유: 나디아가 인사만 하던 룸메이트에서 직접 질문하는 통화 참여자로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L11 [5.860–8.767초] — 나디아 (@Audio2)\n“저는... 인도네시아 사람이에요.”\n발화 S03-L12 [8.993–11.078초] — 엄마 (@Audio1)\n“아~ 인도네시아 사람이군요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L13 [11.260–14.343초] — 나디아 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S03-BC007 [14.467–22.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 병원 배경·가운·청진기가 남는 폰 화면. 문단별로 같은 인서트를 쪼개지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n전환 이유: 직업 답변에서 개인적인 취향으로 말투와 자세가 달라지는 발화 흐름을 유지한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L14 [14.527–16.050초] — 엄마 (@Audio1)\n“저는 의사예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L15 [16.260–18.483초] — 엄마 (@Audio1)\n“저는 한국 드라마 좋아해요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L16 [18.660–21.849초] — 엄마 (@Audio1)\n“현빈 팬이에요. 현빈은 배우예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 22.000초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC006.mp4", "poster": "media/previs_v009/S03-BC006.png", "label": "S03-BC006 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 8.67, "framing": "관계 투숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_i >\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ08/SEQ08_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ08_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ08/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ08/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ08/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 08 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 22초 · 본편 사용 22.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n끝 컷의 연출: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC005 [0.000–5.800초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L09 [0.060–3.125초] — 엄마 (@Audio1)\n“반가워요! 저는 트랑 엄마예요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L10 [3.327–5.638초] — 엄마 (@Audio1)\n“나디아는 어느 나라 사람이에요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC006 [5.800–14.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.800초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [5.800초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.\n전환 이유: 나디아가 인사만 하던 룸메이트에서 직접 질문하는 통화 참여자로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L11 [5.860–8.767초] — 나디아 (@Audio2)\n“저는... 인도네시아 사람이에요.”\n발화 S03-L12 [8.993–11.078초] — 엄마 (@Audio1)\n“아~ 인도네시아 사람이군요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L13 [11.260–14.343초] — 나디아 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S03-BC007 [14.467–22.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 병원 배경·가운·청진기가 남는 폰 화면. 문단별로 같은 인서트를 쪼개지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n전환 이유: 직업 답변에서 개인적인 취향으로 말투와 자세가 달라지는 발화 흐름을 유지한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L14 [14.527–16.050초] — 엄마 (@Audio1)\n“저는 의사예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L15 [16.260–18.483초] — 엄마 (@Audio1)\n“저는 한국 드라마 좋아해요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L16 [18.660–21.849초] — 엄마 (@Audio1)\n“현빈 팬이에요. 현빈은 배우예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 22.000초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC007.mp4", "poster": "media/previs_v009/S03-BC007.png", "label": "S03-BC007 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 7.53, "framing": "영상 통화 화면", "angle": "스마트폰 화면 정면", "leaf": true, "source_shot_ids": ["S03-FC017"], "prompt_group": "SEQ08", "revision": "7c3c6b6b9b1c1e4e26f2550f672701d0e7d7b22b229f7ccb67bafbea0930a2c4"}, {"id": "S03-BC008", "parent": "S03", "kind": "shot", "kindLabel": "샷", "title": "S03-BC008", "summary": "엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.", "body": "\u003cp>엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\u003c/p>\u003cp>구도: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\u003c/p>\u003cp>관계: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\u003c/p>\u003cp>배치: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\u003c/p>\u003cp>전환: 엄마의 팬 이야기에서 딸 자신의 취향으로 관심이 옮겨가는 얼굴을 선택한다.\u003c/p>\u003cp>가까운 표정 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 60mm · 설계값\u003c/p>\u003cp>엄마: 현빈 사랑해요!\u003c/p>\u003cp>트랑: 저는 송강 사랑해요.\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S03-BC008.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S03.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 03:12 — 침대 전경과 책상 중경의 깊이를 참고하고 최신 원문의 위치·행동을 우선한다.\u003c/p>\u003cp>Friends.10x13.The.One.Where.Joey.Speaks.French.avi · 04:45–04:54 — 나란한 투숏과 높이·깊이가 다른 투숏을 구분한다.\u003c/p>\u003cp>기존 샷: S03-FC017, S03-FC021\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ09 · S03-BC008, S03-BC009, S03-BC010, S03-BC011, S03-BC012\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ09/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ09/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ09_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ09/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ09/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ09/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 09 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n참조: @Video1, @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 \u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ09/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ09_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ09/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ09/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ09/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 09 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n참조: @Video1, @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 그쪽을 보고 엄마에게 피곤하다고 말한다.\n동작·연기 [7.000–9.400초]: 인상 찌푸리면서\n동작·연기 [9.400–10.133초]: 나디아가 책상 의자에서 하품을 참으며 입을 가린다. 트랑이 이를 본다.\n전환 이유: 개인 취향의 반응에서 룸메이트의 피곤함을 알아차리는 관계 변화로 넓힌다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L20 [7.060–9.285초] — 트랑 (@Audio2)\n“아니요! 배우예요!”\n발화 S03-L21 [10.193–12.660초] — 트랑 (@Audio2)\n“엄마... We&#x27;re tired.”\n\n컷 S03-BC011 [12.800–15.133초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 통화 연결이 유지된 폰 화면에서 끝인사까지 보인다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 이해하고 작별한다.\n전환 이유: 통화를 끝내기 전에 상대방의 수락과 작별을 받는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L22 [12.860–14.975초] — 엄마 (@Audio1)\n“Okay. Bye.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC012 [15.133–20.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대·책상의 간격을 유지한 편안한 깊이 투숏. 두 얼굴의 머리 방향이 서로에게 바뀌고 폰은 내려간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [15.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [16.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [15.133초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [16.333초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n동작·연기 [16.333–16.867초]: 통화를 끝낸 트랑이 폰을 내려놓고 책상 쪽 나디아에게 웃는다.\n동작·연기 [20.267–20.800초]: 각자의 침대와 책상 위치를 유지한 두 사람의 미소.\n전환 이유: 화면 속 엄마를 보던 관계가 실제 방의 두 사람만 남는 관계로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L23 [15.193–16.194초] — 트랑 &amp; 나디아 (@Audio2 + @Audio3)\n“Bye”\n원문에 지정된 이 두 사람만 동시에 말한다.\n발화 S03-L24 [16.927–18.450초] — 트랑 (@Audio2)\n“나디아~ Good night.”\n발화 S03-L25 [18.660–20.123초] — 나디아 (@Audio3)\n“트랑~ Good night!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 20.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC009.mp4", "poster": "media/previs_v009/S03-BC009.png", "label": "S03-BC009 움직이는 프리비즈"}, "decision":  download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ09/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ09_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ09/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ09/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ09/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 09 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n참조: @Video1, @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 그쪽을 보고 엄마에게 피곤하다고 말한다.\n동작·연기 [7.000–9.400초]: 인상 찌푸리면서\n동작·연기 [9.400–10.133초]: 나디아가 책상 의자에서 하품을 참으며 입을 가린다. 트랑이 이를 본다.\n전환 이유: 개인 취향의 반응에서 룸메이트의 피곤함을 알아차리는 관계 변화로 넓힌다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L20 [7.060–9.285초] — 트랑 (@Audio2)\n“아니요! 배우예요!”\n발화 S03-L21 [10.193–12.660초] — 트랑 (@Audio2)\n“엄마... We&#x27;re tired.”\n\n컷 S03-BC011 [12.800–15.133초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 통화 연결이 유지된 폰 화면에서 끝인사까지 보인다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 이해하고 작별한다.\n전환 이유: 통화를 끝내기 전에 상대방의 수락과 작별을 받는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L22 [12.860–14.975초] — 엄마 (@Audio1)\n“Okay. Bye.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC012 [15.133–20.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대·책상의 간격을 유지한 편안한 깊이 투숏. 두 얼굴의 머리 방향이 서로에게 바뀌고 폰은 내려간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [15.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [16.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [15.133초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [16.333초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n동작·연기 [16.333–16.867초]: 통화를 끝낸 트랑이 폰을 내려놓고 책상 쪽 나디아에게 웃는다.\n동작·연기 [20.267–20.800초]: 각자의 침대와 책상 위치를 유지한 두 사람의 미소.\n전환 이유: 화면 속 엄마를 보던 관계가 실제 방의 두 사람만 남는 관계로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L23 [15.193–16.194초] — 트랑 &amp; 나디아 (@Audio2 + @Audio3)\n“Bye”\n원문에 지정된 이 두 사람만 동시에 말한다.\n발화 S03-L24 [16.927–18.450초] — 트랑 (@Audio2)\n“나디아~ Good night.”\n발화 S03-L25 [18.660–20.123초] — 나디아 (@Audio3)\n“트랑~ Good night!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 20.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC010.mp4", "poster": "media/previs_v009/S03-BC010.png", "label": "S0 ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ09_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ09/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ09/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ09/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 09 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n참조: @Video1, @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 그쪽을 보고 엄마에게 피곤하다고 말한다.\n동작·연기 [7.000–9.400초]: 인상 찌푸리면서\n동작·연기 [9.400–10.133초]: 나디아가 책상 의자에서 하품을 참으며 입을 가린다. 트랑이 이를 본다.\n전환 이유: 개인 취향의 반응에서 룸메이트의 피곤함을 알아차리는 관계 변화로 넓힌다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L20 [7.060–9.285초] — 트랑 (@Audio2)\n“아니요! 배우예요!”\n발화 S03-L21 [10.193–12.660초] — 트랑 (@Audio2)\n“엄마... We&#x27;re tired.”\n\n컷 S03-BC011 [12.800–15.133초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통 /SEQ09/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ09_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ09/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ09/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ09/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 09 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n참조: @Video1, @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 그쪽을 보고 엄마에게 피곤하다고 말한다.\n동작·연기 [7.000–9.400초]: 인상 찌푸리면서\n동작·연기 [9.400–10.133초]: 나디아가 책상 의자에서 하품을 참으며 입을 가린다. 트랑이 이를 본다.\n전환 이유: 개인 취향의 반응에서 룸메이트의 피곤함을 알아차리는 관계 변화로 넓힌다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L20 [7.060–9.285초] — 트랑 (@Audio2)\n“아니요! 배우예요!”\n발화 S03-L21 [10.193–12.660초] — 트랑 (@Audio2)\n“엄마... We&#x27;re tired.”\n\n컷 S03-BC011 [12.800–15.133초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 통화 연결이 유지된 폰 화면에서 끝인사까지 보인다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 이해하고 작별한다.\n전환 이유: 통화를 끝내기 전에 상대방의 수락과 작별을 받는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L22 [12.860–14.975초] — 엄마 (@Audio1)\n“Okay. Bye.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC012 [15.133–20.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대·책상의 간격을 유지한 편안한 깊이 투숏. 두 얼굴의 머리 방향이 서로에게 바뀌고 폰은 내려간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [15.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [16.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [15.133초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [16.333초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n동작·연기 [16.333–16.867초]: 통화를 끝낸 트랑이 폰을 내려놓고 책상 쪽 나디아에게 웃는다.\n동작·연기 [20.267–20.800초]: 각자의 침대와 책상 위치를 유지한 두 사람의 미소.\n전환 이유: 화면 속 엄마를 보던 관계가 실제 방의 두 사람만 남는 관계로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L23 [15.193–16.194초] — 트랑 &amp; 나디아 (@Audio2 + @Audio3)\n“Bye”\n원문에 지정된 이 두 사람만 동시에 말한다.\n발화 S03-L24 [16.927–18.450초] — 트랑 (@Audio2)\n“나디아~ Good night.”\n발화 S03-L25 [18.660–20.123초] — 나디아 (@Audio3)\n“트랑~ Good night!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 20.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC012.mp4", "poster": "media/previs_v009/S03-BC012.png", "label": "S03-BC012 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 5.67, "framing": "관계 투숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S03-FC027"], "prompt_group": "SEQ09", "revision": "db1fcebd4bda3d5347af6144b7a50b2d1fbb131a43ffd7d294fa26543b904e1f"}, {"id": "S04", "parent": "A02", "kind": "scene", "kindLabel": "씬", "title": "S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮", "summary": "", "body": "", "media": null, "decision": "proposed", "decisionLabel": "제안", "production": "", "approval": null, "duration": 55.8, "framing": "", "angle": "", "leaf": false, "revision": "ae8ceb40837ee3cc122479bce828a68e66d7495eaa5bc570439e31c1ff878f85"}, {"id": "S04-BC001", "parent": "S04", "kind": "shot", "kindLabel": "샷", "title": "S04-BC001", "summary": "길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.", "body": "\u003cp>길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\u003c/p>\u003cp>구도: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\u003c/p>\u003cp>관계: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\u003c/p>\u003cp>배치: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\u003c/p>\u003cp>전환: 상대가 갑자기 생기지 않도록 발견·기립·접근의 공간 관계를 먼저 보여준다.\u003c/p>\u003cp>공간 전체 · 관계에 따른 사선·높이·깊이 배치 · 행동 시작·종료에 맞춘 팬 또는 이동 · 30mm · 설계값\u003c/p>\u003cp>대사 없음\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S04-BC001.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S04.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 04:42 — 실제 키 차이가 있는 정·역숏의 높이와 상대 어깨를 참고한다.\u003c/p>\u003cp>기존 샷: S04-FC001\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ10 · S04-BC001, S04-BC002, S04-BC003, S04-BC004, S04-BC005, S04-BC006\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ10/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ10/SEQ10_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ10/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ10/SEQ10_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ10_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ10/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ10/image02_SIWOO.png\" download>image02_SIWOO.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 10 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 29초 · 본편 사용 28.267초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 0.000–3.000초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.300초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n인물 동선 [1.700–3.000초 age3 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ10/image02_SIWOO.png\" download>image02_SIWOO.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 10 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 29초 · 본편 사용 28.267초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 0.000–3.000초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.300초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n인물 동선 [1.700–3.000초]: 시우의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n동작·연기 [0.000–1.200초]: 길을 헤매는 트랑. 프레임 깊이에 붕어방 연못 벤치의 시우가 보인다.\n동작·연기 [1.200–3.000초]: 벤치의 시우가 트랑을 보고 일어나 책을 든 채 성큼성큼 다가간다.\n시작 화면: 트랑 왼쪽, 시우 오른쪽.\n끝 화면: 트랑 왼쪽, 시우 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S04-BC002 [3.000–6.733초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이보다 조금 낮은 사선 투숏. 키 차이와 책이 보이고 시우를 올려다보는 트랑의 방향이 명료하다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [3.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [3.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 걸음을 멈추고 도움이 필요한지 묻는다. 트랑은 고개를 들 의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 0.000–3.000초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.300초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n인물 동선 [1.700–3.000초]: 시우의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n동작·연기 [0.000–1.200초]: 길을 헤매는 트랑. 프레임 깊이에 붕어방 연못 벤치의 시우가 보인다.\n동작·연기 [1.200–3.000초]: 벤치의 시우가 트랑을 보고 일어나 책을 든 채 성큼성큼 다가간다.\n시작 화면: 트랑 왼쪽, 시우 오른쪽.\n끝 화면: 트랑 왼쪽, 시우 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S04-BC002 [3.000–6.733초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이보다 조금 낮은 사선 투숏. 키 차이와 책이 보이고 시우를 올려다보는 트랑의 방향이 명료하다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [3.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [3.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 걸음을 멈추고 도움이 필요한지 묻는다. 트랑은 고개를 들어 시우를 본다.\n동작·연기 [3.000–6.733초]: 친절하게\n전환 이유: 접근이 끝나고 처음 대면하는 순간을 두 사람의 같은 화면으로 잡는다.\n화면 위치: 트랑 왼쪽, 시우 오른쪽.\n발화 S04-L01 [3.060–6.586초] — 시우 (@Audio1)\n“제가 좀 도와드릴까요? May I help you?”\n\n컷 S04-BC003 [6.733–9.400초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 키 큰 시우 어깨를 전경에 남기는 트랑 가까운 역숏. 과장된 하이앵글 대신 실제 키 차이만 반영.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.733초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [6.733초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 눈을 크게 뜨고 시우를 배우 송강으로 착각한다.\n전환 이유: 첫 대면에서 인지의 놀람이 생기므로 트랑의 얼굴로 좁힌다.\n화면 위치: 트랑 중앙.\n발화 S04-L02 [6.793–9.245초] — 트랑 (@Audio2)\n“어..? 배우 송강이에요?”\n\n컷 S04-BC004 [9.400–13 F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ10/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ10/SEQ10_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ10_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ10/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ10/image02_SIWOO.png\" download>image02_SIWOO.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 10 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 29초 · 본편 사용 28.267초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 0.000–3.000초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 프리 참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ10/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ10/image02_SIWOO.png\" download>image02_SIWOO.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 10 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 29초 · 본편 사용 28.267초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 0.000–3.000초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.300초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n인물 동선 [1.700–3.000초]: 시우의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n동작·연기 [0.000–1.200초]: 길을 헤매는 트랑. 프레임 깊이에 붕어방 연못 벤치의 시우가 보인다.\n동작·연기 [1.200–3.000초]: 벤치의 시우가 트랑을 보고 일어나 책을 든 채 성큼성큼 다가간다.\n시작 화면: 트랑 왼쪽, 시우 오른쪽.\n끝 화면: 트랑 왼쪽, 시우 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S04-BC002 [3.000–6.733초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이보다 조금 낮은 사선 투숏. 키 차이와 책이
