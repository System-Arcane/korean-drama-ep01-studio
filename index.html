prompts_v004/SEQ04/image07_TEACHER_JEONG.png\" download>image07_TEACHER_JEONG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 정 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%A0%95%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>정선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 미오 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%AF%B8%EC%98%A4_v2.wav\" download>미오_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 04 — S#2. 과기대 생활관 로비 / 낮\n생성 27초 · 본편 사용 26.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio5 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n끝 컷의 연출: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC001 [0.000–1.200초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(미오), @image7(장홍), @image8(정 선생님).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n행동: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n동작·연기 [0.000–1.200초]: 로비의 정 선생님과 배정을 기다리는 학생들. 장부를 든 선생님에게 시선이 모인다.\n화면 위치: 아델 왼쪽, 미오 중앙, 루카스 오른쪽, 장홍 오른쪽, 트랑 왼쪽, 나디아 왼쪽, 정 선생님 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S02-BC002 [1.200–7.533초]\n참조: @Video1, @image8(정 선생님).\n구도·앵글: 상반신. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이 사선 상반신. 배정판이 얼굴을 가리지 않으며 장부와 인사 손짓이 함께 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.200초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n행동: 정 선생님이 인사하고 장부를 확인하며 방 배정을 안내한다.\n전환 이유: 집단의 기대에서 안내자의 얼굴과 장부로 주의를 모은다.\n화면 위치: 정 선생님 중앙.\n발화 S02-L01 [1.260–4.680초] — 정 선생님 (@Audio1)\n“안녕하세요? 저는 정 선생님이에요.”\n발화 S02-L02 [4.860–7.425초] — 정 선생님 (@Audio1)\n“I‘ll tell your room assignments now.”\n\n컷 S02-BC003 [7.533–15.867초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image8(정 선생님).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람과 다른 학생 사이의 빈 통로에서 잡은 허리 위 사선 투숏. 교사 쪽 180도 축을 유지하되 전경 a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 미오 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%AF%B8%EC%98%A4_v2.wav\" download>미오_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 04 — S#2. 과기대 생활관 로비 / 낮\n생성 27초 · 본편 사용 26.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio5 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n끝 컷의 연출: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC001 [0.000–1.200초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(미오), @image7(장홍), @image8(정 선생님).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n행동: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n동작·연기 [0.000–1.200초]: 로비의 정 선생님과 배정을 기다리는 학생들. 장부를 든 선생님에게 시선이 모인다.\n화면 위치: 아델 왼쪽, 미오 중앙, 루카스 오른쪽, 장홍 오른쪽, 트랑 왼쪽, 나디아 왼쪽, 정 선생님 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S02-BC002 [1.200–7.533초]\n참조: @Video1, @image8(정 선생님).\n구도·앵글: 상반신. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이 사선 상반신. 배정판이 얼굴을 가리지 않으며 장부와 인사 손짓이 함께 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.200초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n행동: 정 선생님이 인사하고 장부를 확인하며 방 배정을 안내한다.\n전환 이유: 집단의 기대에서 안내자의 얼굴과 장부로 주의를 모은다.\n화면 위치: 정 선생님 중앙.\n발화 S02-L01 [1.260–4.680초] — 정 선생님 (@Audio1)\n“안녕하세요? 저는 정 선생님이에요.”\n발화 S02-L02 [4.860–7.425초] — 정 선생님 (@Audio1)\n“I‘ll tell your room assignments now.”\n\n컷 S02-BC003 [7.533–15.867초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image8(정 선생님).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람과 다른 학생 사이의 빈 통로에서 잡은 허리 위 사선 투숏. 교사 쪽 180도 축을 유지하되 전경 아델·미오에 가리지 않는다. 호명을 듣는 얼굴과 서로 돌아 맞잡는 손을 한 화면에 둔다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.533초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [11.467초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [7.533초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [11.467초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n인물 동선 [11.467–11.767초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [11.467–11.767초]: 나디아의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 301호 호명을 함께 듣던 트랑과 나디아가 서로 돌아 손을 맞잡고 기뻐한다. 두 발화와 반응을 같은 화면에서 이어간다.\n전환 이유: 배정이라는 정보가 두 사람의 관계를 바꾸는 순간으로 전환한다.\n화면 위치: 트랑 오른쪽, 나디아 왼쪽.\n발화 S02-L03 [7.593–11.318초] — 정 선생님 (@Audio1)\n“트랑 씨, 나디아 씨, You are in room 301!”\n발화 S02-L04 [11.527–14.099초] — 트랑 (@Audio2)\n“나디아! We&#x27;re roommates!”\n발화 S02-L05 [14.260–15.726초] — 나디아 (@Audio3)\n“I&#x27;m so happy!”\n\n컷 S02-BC004 [15.867–26.533초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image6(미오), @image8(정 선생님).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사 방향에서 두 학생을 앞뒤로 잡고 접근에 맞춰 짧게 따라간다. 이동 뒤 두 얼굴을 읽는 사선 투숏에 정착.\n카메라 이동: 15.867–20.600초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [15.867초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [19.667초]: 아델의 눈길은 미오 쪽으로 향한다.\n시선 연결 [15.867초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [19.667초]: 미오의 눈길은 아델 쪽으로 향한다.\n인물 동선 [19.667–20.600초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n동작·연기 [19.667–20.600초]: 302호를 들은 아델이 미오 옆으로 다가가 몸을 돌린다.\n전환 이유: 이미 가까운 첫 쌍과 달리 이번 쌍은 처음 서로를 찾아 다가가야 한다.\n시작 화면: 아델 중앙, 미오 왼쪽, 트랑 왼쪽, 나디아 왼쪽.\n중간 화면: 아델 오른쪽, 미오 왼쪽, 트랑 왼쪽, 나디아 왼쪽.\n발화 S02-L06 [15.927–19.515초] — 정 선생님 (@Audio1)\n“아델 씨, 미오 씨, You are in room 302!”\n발화 S02-L07 [20.660–24.804초] — 아델 (@Audio4)\n“미오 씨? 안녕하세요? 저는 아델이에요.”\n발화 S02-L08 [24.993–26.384초] — 미오 (@Audio5)\n“안녕하세요?”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.467초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 26.533초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S02-BC004.mp4", "poster": "media/previs_v009/S02-BC004.png", "label": "S02-BC004 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio2 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n@Audio3 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n끝 컷의 연출: 401호 호명에 루카스가 먼저 손을 흔들고 장홍에게 다가간다. 장홍은 어색하게 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC005 [0.000–6.867초]\n참조: @Video1, @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 아델의 낮은 어깨와 측면을 전경에 두고 미오의 3/4 얼굴을 크게 담는다. 짧은 문답마다 카메라를 되돌리지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 미오의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 미오 쪽으로 향한다.\n행동: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n화면 위치: 아델 오른쪽, 미오 중앙, 나디아 오른쪽.\n발화 S02-L09 [0.060–1.820초] — 아델 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L10 [1.993–3.600초] — 미오 (@Audio2)\n“일본 사람이에요.”\n발화 S02-L11 [3.793–5.196초] — 아델 (@Audio1)\n“직업이 뭐예요?”\n발화 S02-L12 [5.393–6.738초] — 미오 (@Audio2)\n“학생이에요.”\n\n컷 S02-BC006 [6.867–11.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @i 을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio2 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n@Audio3 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n끝 컷의 연출: 401호 호명에 루카스가 먼저 손을 흔들고 장홍에게 다가간다. 장홍은 어색하게 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC005 [0.000–6.867초]\n참조: @Video1, @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 아델의 낮은 어깨와 측면을 전경에 두고 미오의 3/4 얼굴을 크게 담는다. 짧은 문답마다 카메라를 되돌리지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 미오의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 미오 쪽으로 향한다.\n행동: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n화면 위치: 아델 오른쪽, 미오 중앙, 나디아 오른쪽.\n발화 S02-L09 [0.060–1.820초] — 아델 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L10 [1.993–3.600초] — 미오 (@Audio2)\n“일본 사람이에요.”\n발화 S02-L11 [3.793–5.196초] — 아델 (@Audio1)\n“직업이 뭐예요?”\n발화 S02-L12 [5.393–6.738초] — 미오 (@Audio2)\n“학생이에요.”\n\n컷 S02-BC006 [6.867–11.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 중앙에 가까운 낮은 눈높이 투숏. 질문자와 답변자 구도를 벗어나 비슷한 화면 크기의 두 사람이 서로 받아주는 모습을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio2 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n@Audio3 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n끝 컷의 연출: 401호 호명에 루카스가 먼저 손을 흔들고 장홍에게 다가간다. 장홍은 어색하게 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC005 [0.000–6.867초]\n참조: @Video1, @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 아델의 낮은 어깨와 측면을 전경에 두고 미오의 3/4 얼굴을 크게 담는다. 짧은 문답마다 카메라를 되돌리지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 미오의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 미오 쪽으로 향한다.\n행동: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n화면 위치: 아델 오른쪽, 미오 중앙, 나디아 오른쪽.\n발화 S02-L09 [0.060–1.820초] — 아델 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L10 [1.993–3.600초] — 미오 (@Audio2)\n“일본 사람이에요.”\n발화 S02-L11 [3.793–5.196초] — 아델 (@Audio1)\n“직업이 뭐예요?”\n발화 S02-L12 [5.393–6.738초] — 미오 (@Audio2)\n“학생이에요.”\n\n컷 S02-BC006 [6.867–11.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 중앙에 가까운 낮은 눈높이 투숏. 질문자와 답변자 구도를 벗어나 비슷한 화면 크기의 두 사람이 서로 받아주는 모습을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.867초]: 아델의 눈길은 미오 쪽으로 향한다.\n시선 연결 [6.867초]: 미오의 눈길은 아델 쪽으로 향한다.\n행동: 아델이 모델이라고 소개하고 두 사람이 반갑다고 인사를 나눈다.\n전환 이유: 미오의 신상 답변에 EC%9D%8C.mp4\" download>SEQ06_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ06/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ06/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ06/image03_LUCAS.png\" download>image03_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image5 · ZHANGHONG · \u003ca href=\"media/prompts_v004/SEQ06/image04_ZHANGHONG.png\" download>image04_ZHANGHONG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 장홍 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%9E%A5%ED%99%8D_v2.wav\" download>장홍_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 06 — S#2. 과기대 생활관 로비 / 낮\n생성 23초 · 본편 사용 23.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image5 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 장홍 전용 음색. 차분하고 약간 수줍은 남성 음색. 중국어 억양이 남은 한국어 초보자. 음절 높낮이가 조금 분리되지만 원문 단어는 전부 알아들을 수 있게 발음.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n끝 컷의 연출: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC008 [0.000–6.533초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽 /prompts_v004/voices/v2/%EC%9E%A5%ED%99%8D_v2.wav\" download>장홍_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 06 — S#2. 과기대 생활관 로비 / 낮\n생성 23초 · 본편 사용 23.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image5 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 장홍 전용 음색. 차분하고 약간 수줍은 남성 음색. 중국어 억양이 남은 한국어 초보자. 음절 높낮이가 조금 분리되지만 원문 단어는 전부 알아들을 수 있게 발음.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n끝 컷의 연출: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC008 [0.000–6.533초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽으로 열고 머리만 상대를 향한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽.\n발화 S02-L16 [0.060–4.501초] — 루카스 (@Audio1)\n“안녕하세요? 저는 루카스예요. 이름이 뭐예요?”\n발화 S02-L17 [4.727–6.411초] — 장홍 (@Audio2)\n“저는 장홍이에요.”\n\n컷 S02-BC009 [6.533–10.600초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 루카스 어깨 너머 장홍의 정면에 가까운 얼굴. 질문과 답을 분절하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.533초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n행동: 루카스의 국적 질문을 듣고 장홍이 중국 사람이라고 답한다.\n전환 이유: 이름을 겨우 받아준 장홍이 자신의 정보를 더 말하는 순간에 응답 얼굴을 선택한다.\n화면 위치: 루카스 오른쪽, 장홍 중앙.\n발화 S02-L18 [6.593–8.353초] — 루카스 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L19 [8.527–10.443초] — 장홍 (@Audio2)\n“저는 중국 사람이에요.”\n\n컷 S02-BC010 [10.60 \n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image5 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 장홍 전용 음색. 차분하고 약간 수줍은 남성 음색. 중국어 억양이 남은 한국어 초보자. 음절 높낮이가 조금 분리되지만 원문 단어는 전부 알아들을 수 있게 발음.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n끝 컷의 연출: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC008 [0.000–6.533초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽으로 열고 머리만 상대를 향한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽.\n발화 S02-L16 [0.060–4.501초] — 루카스 (@Audio1)\n“안녕하세요? 저는 루카스예요. 이름이 뭐예요?”\n발화 S02-L17 [4.727–6.411초] — 장홍 (@Audio2)\n“저는 장홍이에요.”\n\n컷 S02-BC009 [6.533–10.600초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 루카스 어깨 너머 장홍의 정면에 가까운 얼굴. 질문과 답을 분절하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.533초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n행동: 루카스의 국적 질문을 듣고 장홍이 중국 사람이라고 답한다.\n전환 이유: 이름을 겨우 받아준 장홍이 자신의 정보를 더 말하는 순간에 응답 얼굴을 선택한다.\n화면 위치: 루카스 오른쪽, 장홍 중앙.\n발화 S02-L18 [6.593–8.353초] — 루카스 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L19 [8.527–10.443초] — 장홍 (@Audio2)\n“저는 중국 사람이에요.”\n\n컷 S02-BC010 [10.600–17.400초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스 쪽에 무게를 둔 사선 투숏. 장홍의 되묻는 시선과 루카스의 수신을 같은 프레임에서 이어간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [10.600초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [10.600초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 브라질 사람임을 말하고 직업을 묻는다. 장홍은 학생이라고 답한 뒤 처음으로 되묻는다.\n전환 이유: 일방적으로 질문받던 장홍이 질문자로 바뀌므로 두 사람이 함께 읽히는 관계 구도로 돌아온다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽, 트랑 오른쪽, 나디아 오른쪽.\n발화 S02-L20 [10.660–14.030초] — 루카스 (@Audio1)\n“저는 브라질 사람이에요. 직업이 뭐예요?”\n발화 S02-L21 [14.193–17.276초] — 장홍 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S02-BC011 [17.400–23.000초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 넓어진 허리 위 투숏. 악수 제안·손 내밀기·포옹·놀람을 끊지 않고 결과까지 유지.\n카메라: 고정. 인물의 시 href=\"media/prompts_v004/SEQ06/image03_LUCAS.png\" download>image03_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image5 · ZHANGHONG · \u003ca href=\"media/prompts_v004/SEQ06/image04_ZHANGHONG.png\" download>image04_ZHANGHONG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 장홍 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%9E%A5%ED%99%8D_v2.wav\" download>장홍_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 06 — S#2. 과기대 생활관 로비 / 낮\n생성 23초 · 본편 사용 23.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image5 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 장홍 전용 음색. 차분하고 약간 수줍은 남성 음색. 중국어 억양이 남은 한국어 초보자. 음절 높낮이가 조금 분리되지만 원문 단어는 전부 알아들을 수 있게 발음.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n끝 컷의 연출: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC008 [0.000–6.533초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽으로 열고 머리만 상대를 향한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽.\n발화 S02-L16 [0.060–4.501초] — 루카스 (@Audio1)\n“안녕하세요? 저는 루카스예요. 이름이 뭐예요?”\n발화 S02-L17 [4.727–6.411초] — 장홍 (@Audio2)\n“저는 장홍이에요.”\n\n컷 S02-BC009 [6.533–10.600초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 루카스 어깨 너머 장홍의 정면에 가까운 얼굴. 질문과 답을 분절하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.533초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n행동: 루카스의 국적 질문을 듣고 장홍이 중국 사람이라고 답한다.\n전환 이유: 이름을 겨우 받아준 장홍이 자신의 정보를 더 말하는 순간에 응답 얼굴을 선택한다.\n화면 위치: 루카스 오른쪽, 장홍 중앙.\n발화 S02-L18 [6.593–8.353초] — 루카스 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L19 [8.527–10.443초] — 장홍 (@Audio2)\n“저는 중국 사람이에요.”\n\n컷 S02-BC010 [10.600–17.400초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스 쪽에 무게를 둔 사선 투숏. 장홍의 되묻는 시선과 루카스의 수신을 같은 프레임에서 이어간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [10.600초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [10.600초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 브라질 사람임을 말하고 직업을 묻는다. 장홍은 학생이라고 답한 뒤 처음으로 되묻는다.\n전환 이유: 일방적으로 질문받던 장홍이 질문자로 바뀌므로 두 사람이 함께 읽히는 관계 구도로 돌아온다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽, 트랑 오른쪽, 나디아 오른쪽.\n발화 S02-L20 [10.660–14.030초] — 루카스 (@Audio1)\n“저는 브라질 사람이에요. 직업이 뭐예요?”\n발화 S02-L21 [14.193–17.276초] — 장홍 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S02-BC011 [17.400–23.000초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 넓어진 허리 위 투숏. 악수 제안·손 내밀기·포옹·놀람을 끊지 않고 결과까지 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [17.400초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [17.400초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [20.200–20.800초]: 루카스의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n동작·연기 [17.400–20.200초]: 악수를 청하며\n동작·연기 [20.200–20.800초]: 장홍이 악수하려 손을 내밀자 루카스가 한 걸음 더 붙어 그를 껴안는다.\n동작·연기 [22.467–23.000초]: 포옹의 놀람과 웃음을 같은 투샷에서 짧게 받는다.\n전환 이유: 대화에서 실제 접촉으로 바뀌므로 손·허리와 서로 다른 몸 반응을 포함한다.\n시작 화면: 루카스 오른쪽, 장홍 왼쪽.\n끝 화면: 루카스 중앙, 장홍 왼쪽.\n발화 S02-L22 [17.460–20.035초] — 루카스 (@Audio1)\n“학생이에요.  반가워요.”\n발화 S02-L23 [20.860–22.366초] — 루카스 (@Audio1)\n“We&#x27;re roommates!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 23.000초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S02-BC011.mp4", "poster": "media/previs_v009/S02-BC011.png", "label": "S02-BC011 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 5.6, "framing": "관계 투숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S02-FC029"], "prompt_group": "SEQ06", "revision": "f1e035399af0ab97a6acc72bf0363da188f3261f244925e3908e6456ac416f8e"}, {"id": "A02", "parent": null, "kind": "act", "kindLabel": "액트", "title": "가까워지는 사이", "summary": "", "body": "", "media": null, "decision": "proposed", "decisionLabel": "제안", "production": "", "approval": null, "duration": null, "framing": "", "angle": "", "leaf": false, "revision": "dfa01554dd5f6dd736441b9d3131e787901e001b011d522bebe977aac928cdae"}, {"id": "S03", "parent": "A02", "kind": "scene", "kindLabel": "씬", "title": "S#3. 생활관, 트랑 & 나디아의 방 / 저녁", "summary": "", "body": "", "media": null, "decision": "proposed", "decisionLabel": "제안", "production": "", "approval": null, "duration": 61.6, "framing": "", "angle": "", "leaf": false, "revision": "cf21fd76080c6ca272107ea4d616358b0ffda06f46c907e63a50ad67b2313aaf"}, {"id": "S03-BC001", "parent": "S03", "kind": "shot", "kindLabel": "샷", "title": "S03-BC001", "summary": "침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.", "body": "\u003cp>침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\u003c/p>\u003cp>구도: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\u003c/p>\u003cp>관계: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\u003c/p>\u003cp>배치: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\u003c/p>\u003cp>전환: 새 장소에서 통화하는 사람과 자기 일을 하는 룸메이트를 함께 설정한다.\u003c/p>\u003cp>관계 투숏 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 31mm · 설계값\u003c/p>\u003cp>트랑: 엄마! 트랑이에요.\u003c/p>\u003cp>트랑: my room!\u003c/p>\u003cp>트랑: 저는 학생이에요!\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S03-BC001.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S03.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 03:12 — 침대 전경과 책상 중경의 깊이를 참고하고 최신 원문의 위치·행동을 우선한다.\u003c/p>\u003cp>Friends.10x13.The.One.Where.Joey.Speaks.French.avi · 04:45–04:54 — 나란한 투숏과 높이·깊이가 다른 투숏을 구분한다.\u003c/p>\u003cp>기존 샷: S03-FC001\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ07 · S03-BC001, S03-BC002, S03-BC003, S03-BC004\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ07/SEQ07_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ07/SEQ07_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ07_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ07/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ07/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ07/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 07 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 19초 · 본편 사용 18.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n끝 컷의 연출: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC001 [0.000–7.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n동작·연기 [0.000–1.333초]: 왼쪽 침대의 트랑은 영상 통화 중. 오른쪽 책상의 나디아는 노트북으로 숙제한다.\n동작·연기 [1.333–3.800초]: 스마트폰 화면을 보며 밝게\n동작·연기 [3.800–5.133초]: 엄마에게 영상 통화로 방을 보여주면서\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L01 [1.393–3.664초] — 트랑 (@Audio1)\n“엄마! 트랑이에요.”\n발화 S03-L02 [3.860–5.006초] — 트랑 (@Audio1)\n“my room!”\n발화 S03-L03 [5.193–6.873초] — 트랑 (@Audio1)\n“저는 학생이에요!”\n\n컷 S03-BC002 [7.000–11.867초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\n동작·연기 [7.000–11.867초]: 엄지척하며\n전환 이유: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L04 [7.060–11.710초] — 엄마 (@Audio2)\n“우리 딸,  최고예요! 학교는 어때요? 좋아요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC003 [11.867–16.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.867초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [15.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [11.867초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 트랑이 학교가 좋다고 답한다. 엄마가 룸메이트 이름을 묻자 트랑의 눈길이 책상 쪽 나디아에게 향한다.\n전환 이유: 질문의 대상이 방에 있는 다른 사람으로 바뀌므로 그 사람이 실제로 있는 깊이를 다시 보여준다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L05 [11.927–12.960초] — 트랑 (@Audio1)\n“Good!”\n발화 S03-L06 [13.127–14.882초] — 엄마 (@Audio2)\n“Roommate 이름이 뭐예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L07 [15.060–16.317초] — 트랑 (@Audio1)\n“나디아예요.”\n\n컷 S03-BC004 [16.467–18.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\n카메라 이동: 16.467–17.200초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [16.467초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [16.467초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n동작·연기 [16.467–17.200초]: 트랑이 폰을 옆으로 돌려 책상에 앉은 나디아를 비춘다. 나디아가 몸을 틀며 손을 흔든다.\n동작·연기 [17.200–18.800초]: 카메라를 향해\n전환 이유: 폰이 향한 대상과 실제 인물의 응답을 연결한다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L08 [17.260–18.650초] — 나디아 (@Audio3)\n“안녕하세요!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 18.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC001.mp4", "poster": "media/previs_v009/S03-BC001.png", "label": "S03-BC001 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 7.0, "framing": "관계 투숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S03-FC001"], "prompt_group": "SEQ07", "revision": "a4e5199959bd9cbd174a061d571dae49a6c301b1228f8da1d81a1821ef05277c"}, {"id": "S03-BC002", "parent": "S03", "kind": "shot", "kindLabel": "샷", "title": "S03-BC002", "summary": "병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.", "body": "\u003cp>병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\u003c/p>\u003cp>구도: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\u003c/p>\u003cp>관계: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\u003c/p>\u003cp>배치: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\u003c/p>\u003cp>전환: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\u003c/p>\u003cp>영상 통화 화면 · 스마트폰 화면 정면 · 고정 · 43mm · 설계값\u003c/p>\u003cp>엄마: 우리 딸,  최고예요! 학교는 어때요? 좋아요?\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S03-BC002.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S03.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 03:12 — 침대 전경과 책상 중경의 깊이를 참고하고 최신 원문의 위치·행동을 우선한다.\u003c/p>\u003cp>Friend 태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n끝 컷의 연출: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC001 [0.000–7.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n동작·연기 [0.000–1.333초]: 왼쪽 침대의 트랑은 영상 통화 중. 오른쪽 책상의 나디아는 노트북으로 숙제한다.\n동작·연기 [1.333–3.800초]: 스마트폰 화면을 보며 밝게\n동작·연기 [3.800–5.133초]: 엄마에게 영상 통화로 방을 보여주면서\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L01 [1.393–3.664초] — 트랑 (@Audio1)\n“엄마! 트랑이에요.”\n발화 S03-L02 [3.860–5.006초] — 트랑 (@Audio1)\n“my room!”\n발화 S03-L03 [5.193–6.873초] — 트랑 (@Audio1)\n“저는 학생이에요!”\n\n컷 S03-BC002 [7.000–11.867초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\n동작·연기 [7.000–11.867초]: 엄지척하며\n전환 이유: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L04 [7.060–11.710초] — 엄마 (@Audio2)\n“우리 딸,  최고예요! 학교는 어때요? 좋아요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC003 [11.867–16.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.867초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [15.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [11.867초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 트랑이 학교가 좋다고 답한다. 엄마가 룸메이트 이름을 묻자 트랑의 눈길이 책상 쪽 나디아에게 향한다.\n전환 이유: 질문의 대상이 방에 있는 다른 사람으로 바뀌므로 그 사람이 실제로 있는 깊이를 다시 보여준다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L05 [11.927–12.960초] — 트랑 (@Audio1)\n“Good!”\n발화 S03-L06 [13.127–14.882초] — 엄마 (@Audio2)\n“Roommate 이름이 뭐예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L07 [15.060–16.317초] — 트랑 (@Audio1)\n“나디아예요.”\n\n컷 S03-BC004 [16.467–18.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\n카메라 이동: 16.467–17.200초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [16.467초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [16.467초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n동작·연기 [16.467–17.200초]: 트랑이 폰을 옆으로 돌려 책상에 앉은 나디아를 비춘다. 나디아가 몸을 틀며 손을 흔든다.\n동작·연기 [17.200–18.800초]: 카메라를 향해\n전환 이유: 폰이 향한 대상과 실제 인물의 응답을 연결한다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L08 [17.260–18.650초] — 나디아 (@Audio3)\n“안녕하세요!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 18.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC002.mp4", "poster": "media/previs_v009/S03-BC002.png", "label": "S03-BC002 움직이는 프리비즈"}, "decision": "proposed", "decisionLab 지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ07/SEQ07_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ07_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ07/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ07/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ07/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 07 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 19초 · 본편 사용 18.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n끝 컷의 연출: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC001 [0.000–7.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n동작·연기 [0.000–1.333초]: 왼쪽 침대의 트랑은 영상 통화 중. 오른쪽 책상의 나디아는 노트북으로 숙제한다.\n동작·연기 [1.333–3.800초]: 스마트폰 화면을 보며 밝게\n동작·연기 [3.800–5.133초]: 엄마에게 영상 통화로 방을 보여주면서\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L01 [1.393–3.664초] — 트랑 (@Audio1)\n“엄마! 트랑이에요.”\n발화 S03-L02 [3.860–5.006초] — 트랑 (@Audio1)\n“my room!”\n발화 S03-L03 [5.193–6.873초] — 트랑 (@Audio1)\n“저는 학생이에요!”\n\n컷 S03-BC002 [7.000–11.867초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\n동작·연기 [7.000–11.867초]: 엄지척하며\n전환 이유: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L04 [7.060–11.710초] — 엄마 (@Audio2)\n“우리 딸,  최고예요! 학교는 어때요? 좋아요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC003 [11.867–16.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.867초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [15.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [11.867초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 트랑이 학교가 좋다고 답한다. 엄마가 룸메이트 이름을 묻자 트랑의 눈길이 책상 쪽 나디아에게 향한다.\n전환 이유: 질문의 대상이 방에 있는 다른 사람으로 바뀌므로 그 사람이 실제로 있는 깊이를 다시 보여준다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L05 [11.927–12.960초] — 트랑 (@Audio1)\n“Good!”\n발화 S03-L06 [13.127–14.882초] — 엄마 (@Audio2)\n“Roommate 이름이 뭐예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L07 [15.060–16.317초] — 트랑 (@Audio1)\n“나디아예요.”\n\n컷 S03-BC004 [16.467–18.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\n카메라 이동: 16.467–17.200초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [16.467초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [16.467초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n동작·연기 [16.467–17.200초]: 트랑이 폰을 옆으로 돌려 책상에 앉은 나디아를 비춘다. 나디아가 몸을 틀며 손을 흔든다.\n동작·연기 [17.200–18.800초]: 카메라를 향해\n전환 이유: 폰이 향한 대상과 실제 인물의 응답을 연결한다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L08 [17.260–18.650초] — 나디아 (@Audio3)\n“안녕하세요!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 18.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC003.mp4", "poster": "media/previs_v009/S03-BC003.png", "label": "S03-BC003 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 4.6, "framing": "관계 투숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S03-FC007"], "prompt_group": "SEQ07", "revision": "409c8b1a7e6ffc172a36cf22db535acd7719888b423c9b048e1715ac6ec95651"}, {"id": "S03-BC004", "parent": "S03", "kind": "shot", "kindLabel": "샷", "title": "S03-BC004", "summary": "트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.", "body": "\u003cp>트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\u003c/p>\u003cp>구도: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\u003c/p>\u003cp>관계: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\u003c/p>\u003cp>배치: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\u003c/p>\u003cp>전환: 폰이 향한 대상과 실제 인물의 응답을 연결한다.\u003c/p>\u003cp>어깨 너머 관계 · 대화 축을 유지한 어깨 너머 사선 · 행동 시작·종료에 맞춘 팬 또는 이동 · 40mm · 설계값\u003c/p>\u003cp>나디아: 안녕하세요!\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S03-BC004.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S03.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 03:12 — 침대 전경과 책상 중경의 깊이를 참고하고 최신 원문의 위치·행동을 우선한다.\u003c/p>\u003cp>Friends.10x13.The.One.Where.Joey.Speaks.French.avi · 04:45–04:54 — 나란한 투숏과 높이·깊이가 다른 투숏을 구분한다.\u003c/p>\u003cp>기존 샷: S03-FC010\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ07 · S03-BC001, S03-BC002, S03-BC003, S03-BC004\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ07/SEQ07_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ07/SEQ07_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ07_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ07/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ07/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · MOTHER · \u003ca href=\"media/prompts_v004/SEQ07/image03_MOTHER.png\" download>image03_MOTHER.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 엄마 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav\" download>트랑 엄마_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 07 — S#3. 생활관, 트랑 &amp; 나디아의 방 / 저녁\n생성 19초 · 본편 사용 18.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n끝 컷의 연출: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC001 [0.000–7.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n동작·연기 [0.000–1.333초]: 왼쪽 침대의 트랑은 영상 통화 중. 오른쪽 책상의 나디아는 노트북으로 숙제한다.\n동작·연기 [1.333–3.800초]: 스마트폰 화면을 보며 밝게\n동작·연기 [3.800–5.133초]: 엄마에게 영상 통화로 방을 보여주면서\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L01 [1.393–3.664초] — 트랑 (@Audio1)\n“엄마! 트랑이에요.”\n발화 S03-L02 [3.860–5.006초] — 트랑 (@Audio1)\n“my room!”\n발화 S03-L03 [5.193–6.873초] — 트랑 (@Audio1)\n“저는 학생이에요!”\n\n컷 S03-BC002 [7.000–11.867초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\n동작·연기 [7.000–11.867초]: 엄지척하며\n전환 이유: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L04 [7.060–11.710초] — 엄마 (@Audio2)\n“우리 딸,  최고예요! 학교는 어때요? 좋아요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC003 [11.867–16.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.867초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [15.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [11.867초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 트랑이 학교가 좋다고 답한다. 엄마가 룸메이트 이름을 묻자 트랑의 눈길이 책상 쪽 나디아에게 향한다.\n전환 이유: 질문의 대상이 방에 있는 다른 사람으로 바뀌므로 그 사람이 실제로 있는 깊이를 다시 보여준다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L05 [11.927–12.960초] — 트랑 (@Audio1)\n“Good!”\n발화 S03-L06 [13.127–14.882초] — 엄마 (@Audio2)\n“Roommate 이름이 뭐예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L07 [15.060–16.317초] — 트랑 (@Audio1)\n“나디아예요.”\n\n컷 S03-BC004 [16.467–18.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\n카메라 이동: 16.467–17.200초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [16.467초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [16.467초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n동작·연기 [16.467–17.200초]: 트랑이 폰을 옆으로 돌려 책상에 앉은 나디아를 비춘다. 나디아가 몸을 틀며 손을 흔든다.\n동작·연기 [17.200–18.800초]: 카메라를 향해\n전환 이유: 폰이 향한 대상과 실제 인물의 응답을 연결한다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L08 [17.260–18.650초] — 나디아 (@Audio3)\n“안녕하세요!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 18.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S03-BC004.mp4", "poster": "media/previs_v009/S03-BC004.png", "label": "S03-BC004 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 2.33, "framing": "어깨 너머 관계", "angle": "대화 축을 유지한 어깨 너머 사선", "leaf": true, "source_shot_ids": ["S03-FC010"], "prompt_group": "SEQ07", "revision": "7635ea9dc907a1e62b91eb5e6fac29cad890cd9f760198f27098e9f631288d77"}, {"id": "S03-BC005", "parent": "S03", "kind": "shot", "kindLabel": "샷", "title": "S03-BC005", "summary": "엄마가 자신을 소개하고 나디아의 국적을 묻는다.", "body": "\u003cp>엄마가 자신을 소개하고 나디아의 국적을 묻는다.\u003c/p>\u003cp>구도: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\u003c/p>\u003cp>관계: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\u003c/p>\u003cp>배치: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\u003c/p>\u003cp>전환: 처음 인사를 받는 엄마의 따뜻한 수신과 질문을 명확히 보여준다.\u003c/p>\u003cp>영상 통화 화면 · 스마트폰 화면 정면 · 고정 · 43mm · 설계값\u003c/p>\u003cp>엄마: 반가워요! 저는 트랑 엄마예요!\u003c/p>\u003cp>엄마: 나디아는 어느 나라 사람이에요?\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S03-BC005.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S03.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%E
