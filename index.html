.”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n밤의 같은 기숙사 방. 왼쪽은 트랑의 책상, 오른쪽은 나디아의 침대다. 트랑은 책상 의자에 앉아 세로 폰을 들고 있다. 폰을 든 사람은 트랑 한 명이다. 나디아는 미용 팩과 히잡을 유지하며 오른쪽 자기 침대에 누워 있다. 방과 책상 배치는 @Video1을 따른다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n셀카는 트랑이 든 한 대의 폰 시점이다. 나디아가 보이는 동안 트랑의 소개 요청과 Good!은 화면 밖 현장 음성이다. 나디아는 미용 팩과 히잡을 유지한 채 침대에 누워 인사한다. 일어나 앉거나 팩을 떼지 않는다.\n\n컷 S06-BC002 [0.000–29.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 연속 셀카. 실제 폰 시점.\n화면 구성: 셀카 얼굴, 책상과 방을 지나는 팬, 침대 나디아, 셀카 복귀가 하나의 실제 폰 동선으로 이어진다. 폰을 순간이동시키지 않는다.\n카메라 이동: 6.467–6.867초, 6.867–7.467초, 21.333–21.633초, 21.633–21.933초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [7.467초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [21.933초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 셀카로 소개한 뒤 폰을 내려 책상과 방을 지나 나디아를 보여준다. 나디아의 소개를 듣고 폰을 되돌려 V와 끝인사·구독 요청을 한 뒤 녹화를 멈춘다.\n동작·연기 [6.467–7.467초]: 트랑이 폰을 살짝 내려 책상과 방을 지나 나디아의 침대 쪽으로 돌린다.\n동작·연기 [21.333–21.933초]: 트랑이 폰을 자기 쪽으로 돌려 V를 그리며 웃는다.\n동작·연기 [29.200–29.800초]: 트랑이 폰 화면의 정지 버튼을 누른다.\n시작 화면: 트랑 중앙, 나디아 오른쪽.\n중간 화면: 나디아 중앙.\n끝 화면: 트랑 중앙, 나디아 오른쪽.\n발화 S06-L01 [0.060–4.803초] — 트랑 (@Audio1)\n“안녕하세요! 저는 트랑이에요. 베트남 사람이에요.”\n발화 S06-L02 [4.993–6.338초] — 트랑 (@Audio1)\n“학생이에요.”\n발화 S06-L03 [7.527–12.201초] — 트랑 (@Audio1)\n“나디아! 자기소개. Please introduce yourself!”\n트랑의 화면 밖 현장 음성. 화면의 나디아는 이 대사를 립싱크하지 않는다.\n발화 S06-L04 [12.393–15.408초] — 나디아 (@Audio2)\n“안녕하세요? 저는 나디아예요.”\n발화 S06-L05 [15.593–20.030초] — 나디아 (@Audio2)\n“인도네시아 사람이에요. 학생이에요! 반가워요.”\n발화 S06-L06 [20.193–21.227초] — 트랑 (@Audio1)\n“Good!”\n트랑의 화면 밖 현장 음성. 화면의 나디아는 이 대사를 립싱크하지 않는다.\n발화 S06-L07 [21.993–23.175초] — 트랑 (@Audio1)\n“Good night!”\n발화 S06-L08 [23.393–29.057초] — 트랑 (@Audio1)\n“Like, subscribe, and turn on notifications! please~”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 29.800초까지 사용한다.\n", "generation_seconds": 30, "text_url": "media/prompts_v004/SEQ15/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "video_url": "media/prompts_v004/SEQ15/SEQ15_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S06-BC002", "filename": "SEQ15_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@Video1", "kind": "프리비즈 영상", "label": "구도·동선·시간 참조 (무음)", "filename": "SEQ15_동작참조_무음.mp4", "url": "media/prompts_v004/SEQ15/SEQ15_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "status": "ready"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ15/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ15/image02_NADIA.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}], "start_frame_groups": [{"id": "SEQ01", "scene_title": "S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮", "shot_ids": ["S01-BC001", "S01-BC002", "S01-BC003", "S01-BC004"], "text": "SEQ01 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 교실 디자인 참고. 목재 테이블, 푸른 의자, 밝은 벽, 블라인드, 화이트보드와 부드러운 낮빛만 가져온다. 사진의 촬영 위치·인물 배치·흰 타원 얼굴 가림은 가져오지 않는다. 얼굴은 인물 시트를 따른다.\n\n첫 순간의 구도와 인물 상태\n교사 쪽에서 본 학생 넷의 사선 마스터 / 앉은 눈높이보다 약간 높음.\n교사 쪽에서 긴 테이블 너머 학생 네 명을 본다. 왼쪽 앞 루카스, 왼쪽 뒤 아델, 오른쪽 앞 트랑, 오른쪽 뒤 나디아. 네 명 모두 의자에 앉아 화면 밖 교사 쪽을 본다. 김 선생님을 화면 안에 새로 추가하지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n낮의 한국어 강의실. 밝은 벽, 목재 긴 테이블, 푸른 학생 의자, 창문과 흰 롤블라인드, 앞쪽 화이트보드. 제공한 교실 디자인 이미지의 가구 재질과 부드러운 낮빛을 유지하되 촬영 위치는 첫 구도 참조가 우선한다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#9762C6 블록 = 아델. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#6DCBD0 블록 = 루카스. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ01/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ01/SEQ01_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S01-BC001", "expected_filename": "SEQ01_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S01-BC001 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ01_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ01/SEQ01_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image02_TRANG.png", "url": "media/startframes_v001/SEQ01/image02_TRANG.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "나디아 얼굴·의상", "status": "ready", "filename": "image03_NADIA.png", "url": "media/startframes_v001/SEQ01/image03_NADIA.png"}, {"tag": "@image4", "kind": "인물 이미지", "label": "아델 얼굴·의상", "status": "ready", "filename": "image04_ADELE.png", "url": "media/startframes_v001/SEQ01/image04_ADELE.png"}, {"tag": "@image5", "kind": "인물 이미지", "label": "루카스 얼굴·의상", "status": "ready", "filename": "image05_LUCAS.png", "url": "media/startframes_v001/SEQ01/image05_LUCAS.png"}, {"tag": "@image6", "kind": "공간 디자인", "label": "사용자 제공 교실 · 재질·가구·조명만", "status": "ready", "filename": "교실_디자인참조.png", "url": "media/startframes_v001/references/%EA%B5%90%EC%8B%A4_%EB%94%94%EC%9E%90%EC%9D%B8%EC%B0%B8%EC%A1%B0.png"}]}, {"id": "SEQ02", "scene_title": "S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮", "shot_ids": ["S01-BC005", "S01-BC006", "S01-BC007"], "text": "SEQ02 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다.\n@image7 = 교실 디자인 참고. 목재 테이블, 푸른 의자, 밝은 벽, 블라인드, 화이트보드와 부드러운 낮빛만 가져온다. 사진의 촬영 위치·인물 배치·흰 타원 얼굴 가림은 가져오지 않는다. 얼굴은 인물 시트를 따른다.\n\n첫 순간의 구도와 인물 상태\n오른쪽 뒤 사선 교대 와이드 / 눈높이.\n오른쪽 뒤 사선에서 칠판 앞과 학생석을 함께 본다. 트랑은 아직 화면 왼쪽 칠판 앞에 서 있고 김 선생님은 그 뒤 가까이에 있다. 나디아는 오른쪽 전경에 앉아 있고 아델은 오른쪽 뒤 자기 자리 쪽, 루카스는 테이블 건너편에 있다. 트랑의 복귀와 아델의 등장이 끝난 상태로 미리 이동시키지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n낮의 한국어 강의실. 밝은 벽, 목재 긴 테이블, 푸른 학생 의자, 창문과 흰 롤블라인드, 앞쪽 화이트보드. 제공한 교실 디자인 이미지의 가구 재질과 부드러운 낮빛을 유지하되 촬영 위치는 첫 구도 참조가 우선한다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#9762C6 블록 = 아델. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#6DCBD0 블록 = 루카스. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#566B83 블록 = 김 선생님. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ02/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ02/SEQ02_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S01-BC005", "expected_filename": "SEQ02_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S01-BC005 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ02_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ02/SEQ02_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image02_TRANG.png", "url": "media/startframes_v001/SEQ02/image02_TRANG.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "나디아 얼굴·의상", "status": "ready", "filename": "image03_NADIA.png", "url": "media/startframes_v001/SEQ02/image03_NADIA.png"}, {"tag": "@image4", "kind": "인물 이미지", "label": "아델 얼굴·의상", "status": "ready", "filename": "image04_ADELE.png", "url": "media/startframes_v001/SEQ02/image04_ADELE.png"}, {"tag": "@image5", "kind": "인물 이미지", "label": "루카스 얼굴·의상", "status": "ready", "filename": "image05_LUCAS.png", "url": "media/startframes_v001/SEQ02/image05_LUCAS.png"}, {"tag": "@image6", "kind": "인물 이미지", "label": "김 선생님 얼굴·의상", "status": "ready", "filename": "image06_TEACHER_KIM.png", "url": "media/startframes_v001/SEQ02/image06_TEACHER_KIM.png"}, {"tag": "@image7", "kind": "공간 디자인", "label": "사용자 제공 교실 · 재질·가구·조명만", "status": "ready", "filename": "교실_디자인참조.png", "url": "media/startframes_v001/references/%EA%B5%90%EC%8B%A4_%EB%94%94%EC%9E%90%EC%9D%B8%EC%B0%B8%EC%A1%B0.png"}, {"tag": "선택 · 추가 참조", "kind": "연결 이미지", "label": "SEQ01 실제 생성 결과의 마지막 프레임 · 상태 연결용", "status": "pending_generation", "filename": "", "url": null}]}, {"id": "SEQ03", "scene_title": "S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮", "shot_ids": ["S01-BC008", "S01-BC009", "S01-BC010", "S01-BC011"], "text": "SEQ03 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다.\n@image7 = 교실 디자인 참고. 목재 테이블, 푸른 의자, 밝은 벽, 블라인드, 화이트보드와 부드러운 낮빛만 가져온다. 사진의 촬영 위치·인물 배치·흰 타원 얼굴 가림은 가져오지 않는다. 얼굴은 인물 시트를 따른다.\n\n첫 순간의 구도와 인물 상태\n나디아와 트랑의 낮은 사선 투숏 / 앉은 트랑 눈높이에서 약간 올려봄.\n왼쪽 중경의 나디아가 칠판 앞에 서서 자기소개를 시작할 순간. 오른쪽 전경에는 앉은 트랑의 옆모습이 보인다. 김 선생님은 나디아 뒤 왼쪽 가장자리에서 부분적으로 가려지고, 루카스와 아델은 테이블 건너 앉아 듣는다. 앉은 트랑 쪽에서 조금 올려다보는 관계를 유지한다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n낮의 한국어 강의실. 밝은 벽, 목재 긴 테이블, 푸른 학생 의자, 창문과 흰 롤블라인드, 앞쪽 화이트보드. 제공한 교실 디자인 이미지의 가구 재질과 부드러운 낮빛을 유지하되 촬영 위치는 첫 구도 참조가 우선한다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#9762C6 블록 = 아델. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#6DCBD0 블록 = 루카스. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#566B83 블록 = 김 선생님. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ03/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ03/SEQ03_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S01-BC008", "expected_filename": "SEQ03_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S01-BC008 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ03_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ03/SEQ03_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image02_TRANG.png", "url": "media/startframes_v001/SEQ03/image02_TRANG.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "나디아 얼굴·의상", "status": "ready", "filename": "image03_NADIA.png", "url": "media/startframes_v001/SEQ03/image03_NADIA.png"}, {"tag": "@image4", "kind": "인물 이미지", "label": "아델 얼굴·의상", "status": "ready", "filename": "image04_ADELE.png", "url": "media/startframes_v001/SEQ03/image04_ADELE.png"}, {"tag": "@image5", "kind": "인물 이미지", "label": "루카스 얼굴·의상", "status": "ready", "filename": "image05_LUCAS.png", "url": "media/startframes_v001/SEQ03/image05_LUCAS.png"}, {"tag": "@image6", "kind": "인물 이미지", "label": "김 선생님 얼굴·의상", "status": "ready", "filename": "image06_TEACHER_KIM.png", "url": "media/startframes_v001/SEQ03/image06_TEACHER_KIM.png"}, {"tag": "@image7", "kind": "공간 디자인", "label": "사용자 제공 교실 · 재질·가구·조명만", "status": "ready", "filename": "교실_디자인참조.png", "url": "media/startframes_v001/references/%EA%B5%90%EC%8B%A4_%EB%94%94%EC%9E%90%EC%9D%B8%EC%B0%B8%EC%A1%B0.png"}, {"tag": "선택 · 추가 참조", "kind": "연결 이미지", "label": "SEQ02 실제 생성 결과의 마지막 프레임 · 상태 연결용", "status": "pending_generation", "filename": "", "url": null}]}, {"id": "SEQ04", "scene_title": "S#2. 과기대 생활관 로비 / 낮", "shot_ids": ["S02-BC001", "S02-BC002", "S02-BC003", "S02-BC004"], "text": "SEQ04 — S#2. 과기대 생활관 로비 / 낮 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다.\n\n첫 순간의 구도와 인물 상태\n공간 전체 / 관계에 따른 사선·높이·깊이 배치.\n넓은 로비 안 학생 여섯 명과 안내 위치의 정 선생님. 화면 왼쪽 가까이에 트랑·나디아, 그 뒤 아델, 중앙 미오, 오른쪽 루카스·장홍. 정 선생님은 깊은 중앙 안내 위치에 있다. 인물 간 빈 통로와 앞뒤 거리를 유지한다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n낮의 대학 생활관 로비. 안내대와 장부, 출입문, 넓은 보행 통로가 있는 단정한 공용 공간. 밝은 중성색 벽과 바닥, 과장되지 않은 실내 조명. 안내 위치와 출입문의 관계는 첫 구도 참조대로 고정한다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#9762C6 블록 = 아델. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#6DCBD0 블록 = 루카스. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#C86B9E 블록 = 미오. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#B46D2C 블록 = 장홍. 머리·몸·보조 손이 mage03_ZHANGHONG.png", "url": "media/startframes_v001/SEQ06/image03_ZHANGHONG.png"}, {"tag": "선택 · 추가 참조", "kind": "연결 이미지", "label": "SEQ05 실제 생성 결과의 마지막 프레임 · 상태 연결용", "status": "pending_generation", "filename": "", "url": null}]}, {"id": "SEQ07", "scene_title": "S#3. 생활관, 트랑 & 나디아의 방 / 저녁", "shot_ids": ["S03-BC001", "S03-BC002", "S03-BC003", "S03-BC004"], "text": "SEQ07 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n\n첫 순간의 구도와 인물 상태\n관계 투숏 / 관계에 따른 사선·높이·깊이 배치.\n왼쪽 가까운 자기 침대에 앉은 트랑이 세로 스마트폰을 든다. 오른쪽 뒤 나디아는 책상 의자에 앉아 노트북을 본다. 두 사람 사이 공간, 양쪽 침대와 책상, 방 끝 창문을 유지한다. 엄마를 방 안에 세우지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n저녁의 2인 기숙사 방. 입구에서 방 끝 창문을 보면 왼쪽은 트랑, 오른쪽은 나디아 공간이다. 침대 두 개와 책상 두 개, 커튼 있는 창문. 따뜻한 실내등과 어두워지는 창밖. 방의 좌우 소유관계를 뒤집지 않는다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/ 라 트랑이 든 폰의 화면이다. 폰 속 진료실과 엄마의 가운·청진기를 자연스럽게 구현한다. 통화 화면의 긴 문구·자막을 생성하지 않는다.\n\n블록 식별과 자연스러운 실사 변환\n#B2A5DF 블록 = 엄마. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ08/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ08/SEQ08_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S03-BC005", "expected_filename": "SEQ08_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S03-BC005 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ08_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ08/SEQ08_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "엄마 얼굴·의상", "status": "ready", "filename": "image02_MOTHER.png", "url": "media/startframes_v001/SEQ08/image02_MOTHER.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image03_TRANG.png", "url": "media/startframes_v001/SEQ08/image03_TRANG.png"}, {"tag": "선택 · 추가 참조", "kind": "연결 이미지", "label": "SEQ07 실제 생성 결과의 마지막 프레임 · 상태 연결용", "status": "pending_generation", "filename": "", "url": null}, {"tag": "선택 · 추가 참조", "kind": "공간 디자인", "label": "같은 기숙사 방의 승인된 공간 기준 · 가구 디자인 유지", "status": "pending_generation", "filename": "", "url": null}]}, {"id": "SEQ09", "scene_title": "S#3. 생활관, 트랑 & 나디아의 방 / 저녁", "shot_ids": ["S03-BC008", "S03-BC009", "S03-BC010", "S03-BC011", "S03-BC012"], "text": "SEQ09 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n\n첫 순간의 구도와 인물 상태\n가까운 표정 / 관계에 따른 사선·높이·깊이 배치.\n침대에 앉은 트랑의 가까운 사선 상반신. 화면 중앙에서 약간 왼쪽에 얼굴, 오른쪽으로 뻗은 손 끝에 세로 폰. 시선은 폰 화면의 엄마에게 향한다. 뒤에는 같은 방의 책상과 어두운 창문 일부가 보인다. 엄마나 나디아 얼굴을 이 구도에 추가하지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n저녁의 2인 기숙사 방. 입구에서 방 끝 창문을 보면 왼쪽은 트랑, 오른쪽은 나디아 공간이다. 침대 두 개와 책상 두 개, 커튼 있는 창문. 따뜻한 실내등과 어두워지는 창밖. 방의 좌우 소유관계를 뒤집지 않는다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ09/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ09/SEQ09_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S03-BC008", "expected_filename": "SEQ09_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S03-BC008 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ09_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ09/SEQ09_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image02_TRANG.png", "url" 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image6 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다.\n\n첫 순간의 구도와 인물 상태\n공간 전체 / 관계에 따른 사선·높이·깊이 배치.\n도서관 유리 외벽과 출입문 앞 넓은 구도. 왼쪽 가까운 트랑과 시우, 오른쪽 먼 쪽에서 기다리는 아델·나디아·루카스. 준영은 훨씬 먼 오른쪽에 작은 인물로만 보인다. 아직 두 무리가 다 모여 선 상태로 바꾸지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n낮의 서울과학기술대학교 도서관 1층 앞. 유리 외벽과 출입문, 넓은 보행 공간. 인물의 뒤로 유리 벽의 수직선과 입구 위치가 이어지며 출입문을 임의로 반대편으로 옮기지 않는다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#DDD5BD 블록 = 시우. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#9762C6 블록 = 아델. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#6DCBD0 블록 = 루카스. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#A63859 블록 = 준영. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ12/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview  않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다.\n@image3 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image4 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n\n첫 순간의 구도와 인물 상태\n관계 그룹숏 / 관계에 따른 사선·높이·깊이 배치.\n도서관 앞 대화 무리의 사선 구도. 왼쪽 가장자리 시우, 중앙 나디아, 오른쪽 전경 아델, 그 뒤 오른쪽 루카스. 루카스가 한 걸음 다가와 인사하기 직전이다. 트랑이나 준영을 화면 중앙에 끼워 넣지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\n낮의 서울과학기술대학교 도서관 1층 앞. 유리 외벽과 출입문, 넓은 보행 공간. 인물의 뒤로 유리 벽의 수직선과 입구 위치가 이어지며 출입문을 임의로 반대편으로 옮기지 않는다.\n\n블록 식별과 자연스러운 실사 변환\n#DDD5BD 블록 = 시우. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#9762C6 블록 = 아델. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#6DCBD0 블록 = 루카스. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ13/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ13/SEQ13_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S05-BC009", "expected_filename": "SEQ13_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S05-BC009 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ13_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ13/SEQ13_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "시우 얼굴·의상", "status": "ready", "filename": "image02_SIWOO.png", "url": "media/startframes_v001/SEQ13/image02_SIWOO.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "아델 얼굴·의상", "status": "ready", "filename": "image03_ADELE.png", "url": "media/startframes_v001/SEQ13/image03_ADELE.png"}, {"tag": "@image4", "kind": "인물 이미지", "label": "나디아 얼굴·의상", "status": "ready", "filename": "image04_NADIA.png", "url": "media/startframes_v001/SEQ13/image04_NADIA.png"}, {"tag": "@image5", "kind": "인물 이미지", "label": "루카스 얼굴·의상", "status": "ready", "filename": "image05_LUCAS.png", "url": "media/startframes_v001/SEQ13/image05_LUCAS.png"}, {"tag": "선택 · 추가 참조", "kind": "연결 이미지", "label": "SEQ12 실제 생성 결과의 마지막 프레임 · 상태 연결용", "status": "pending_generation", "filename": "", "url": null}]}, {"id": "SEQ14", "scene_title": "S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤", "shot_ids": ["S06-BC001"], "text": "SEQ14 — S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다.\n\n첫 순간의 구도와 인물 상태\n공간 전체 / 관계에 따른 사선·높이·깊이 배치.\n같은 기숙사 방의 밤 와이드. 왼쪽 뒤 책상 의자에 앉은 트랑이 자기 얼굴 쪽으로 세로 폰을 든다. 오른쪽 앞 침대에는 히잡과 미용 팩을 유지한 나디아가 누워 있다. 이 컷은 방 안의 별도 카메라 시점이다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\nS03과 동일한 2인 기숙사 방의 밤. 가구와 창문 위치, 벽과 침구 디자인을 유지한다. 왼쪽 트랑의 책상, 오른쪽 나디아의 침대. 밤의 따뜻한 실내등. 나디아는 히잡을 유지하고 얼굴에 미용 팩을 붙인다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ14/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ14/SEQ14_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S06-BC001", "expected_filename": "SEQ14_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S06-BC001 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ14_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ14/SEQ14_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image02_TRANG.png", "url": "media/startframes_v001/SEQ14/image02_TRANG.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "나디아 얼굴·의상", "status": "ready", "filename": "image03_NADIA.png", "url": "media/startframes_v001/SEQ14/image03_NADIA.png"}, {"tag": "선택 · 추가 참조", "kind": "공간 디자인", "label": "같은 기숙사 방의 승인된 공간 기준 · 가구 디자인 유지", "status": "pending_generation", "filename": "", "url": null}]}, {"id": "SEQ15", "scene_title": "S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤", "shot_ids": ["S06-BC002"], "text": "SEQ15 — S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤 · 스타트 프레임 이미지\n16:9 가로 화면의 사실적인 실사 드라마 스틸 한 장. 영상 첫 순간의 완성 화면이며 콜라주·멀티뷰·콘티 보드가 아니다.\n\n첨부 이미지의 역할\n@image1 = 구도와 배치만 담당하는 첫 프레임. 카메라 높이·방향·원근·화면 크기·앞뒤 거리·가림 관계를 우선 유지한다. 회색 배경과 블록 재질은 완성 디자인이 아니다.\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다.\n\n첫 순간의 구도와 인물 상태\n연속 셀카 / 실제 폰 시점.\n트랑이 든 스마트폰의 셀카 렌즈 시점. 트랑 얼굴과 상반신이 중앙 가까이 있고 오른쪽 깊은 배경 침대에 나디아가 미용 팩과 히잡을 유지한 채 누워 있다. 렌즈를 향한 트랑의 시선. 폰을 촬영 화면 안에 또 하나 그리지 않으며, 손이나 팔이 얼굴을 가리는 블록 렌더의 단순화는 자연스러운 셀카 자세로 보정한다. 방 구조와 두 사람 위치는 바꾸지 않는다.\n이후 행동이 끝난 결과를 미리 그리지 않는다. 걷기·포옹·폰 돌리기 등의 시작 상태를 표현한다.\n\n공간 디자인\nS03과 동일한 2인 기숙사 방의 밤. 가구와 창문 위치, 벽과 침구 디자인을 유지한다. 왼쪽 트랑의 책상, 오른쪽 나디아의 침대. 밤의 따뜻한 실내등. 나디아는 히잡을 유지하고 얼굴에 미용 팩을 붙인다.\n\n블록 식별과 자연스러운 실사 변환\n#3475CB 블록 = 트랑. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n#E3AC27 블록 = 나디아. 머리·몸·보조 손이 같은 사람이며 여분 인물이 아니다.\n초록 앞면·빨강 뒷면 패치는 방향 표식이다. 피부·의상·장신구로 복제하지 않는다.\n앉기·눕기·손과 폰의 접촉은 정상적인 인체로 보정한다. 자연스럽게 만들기 위해 손목·팔꿈치·얼굴 가림은 소폭 조정할 수 있지만 카메라 축·좌우 순서·자리를 바꾸지 않는다.\n캐릭터시트의 여러 뷰를 여러 사람으로 만들지 않는다. 화면 가장자리의 부분 인물은 그 크기와 가림을 유지한다.\n\n화면 완성도\n따뜻하고 자연스러운 일상 드라마. 실제 피부와 머리카락, 의상 주름, 가구 표면. 가까운 인물과 듣는 상대가 읽히는 현실적인 초점 깊이. 과장된 광고 조명이나 만화 표정은 피한다.\n블록·로봇·구형 머리·색상 패치·얼굴 가림·워터마크·이름표·자막·카메라 장비·화살표·눈금 없음. 인물 수와 소품 소유자를 유지한다. 칠판 글씨는 후반 합성용으로 비워 둔다.\n얼굴 가림 금지는 참조 사진의 흰 타원 마스크를 뜻한다. S06 나디아의 원문상 미용 팩은 유지한다.\n", "text_url": "media/startframes_v001/SEQ15/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "preview_url": "media/startframes_v001/SEQ15/SEQ15_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png", "first_shot_id": "S06-BC002", "expected_filename": "SEQ15_스타트프레임.png", "references": [{"tag": "@image1", "kind": "첫 구도", "label": "S06-BC002 · 영상의 실제 첫 프레임", "status": "ready", "filename": "SEQ15_프리비즈_첫프레임.png", "url": "media/startframes_v001/SEQ15/SEQ15_%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_%EC%B2%AB%ED%94%84%EB%A0%88%EC%9E%84.png"}, {"tag": "@image2", "kind": "인물 이미지", "label": "트랑 얼굴·의상", "status": "ready", "filename": "image02_TRANG.png", "url": "media/startframes_v001/SEQ15/image02_TRANG.png"}, {"tag": "@image3", "kind": "인물 이미지", "label": "나디아 얼굴·의상", "status": "ready", "filename": "image03_NADIA.png", "url": "media/startframes_v001/SEQ15/image03_NADIA.png"}, {"tag": "선택 · 추가 참조", "kind": "연결 이미지", "label": "SEQ14 실제 생성 결과의 마지막 프레임 · 상태 연결용", "status": "pending_generation", "filename": "", "url": null}, {"tag": "선택 · 추가 참조", "kind": "공간 디자인", "label": "같은 기숙사 방의 승인된 공간 기준 · 가구 디자인 유지", "status": "pending_generation", "filename": "", "url": null}]}], "no_previs_groups": [{"id": "SEQ01", "scene_title": "S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮", "shot_ids": ["S01-BC001", "S01-BC002", "S01-BC003", "S01-BC004"], "text": "시퀀스 01 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 26초 · 본편 사용 25.067초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 \u003c자기소개하기>는 후반 합성한다.\n시작 컷의 연출: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n끝 컷의 연출: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC001 [0.000–1.800초]\n공간 배치: 교사 쪽에서 본 학생 넷의 사선 마스터.\n렌즈와 높이: 26mm 상당의 화각, 앉은 눈높이보다 약간 높음.\n첫 화면 인물: 트랑 오른쪽、나디아 오른쪽、루카스 왼쪽、아델 왼쪽.\n참조: @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스).\n구도·앵글: 교사 쪽에서 본 학생 넷의 사선 마스터. 앉은 눈높이보다 약간 높음.\n화면 구성: 교사 쪽에서 본 학생 넷의 사선 마스터\n관계: 네 학생이 같은 수업을 듣는 공간을 먼저 확인한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n행동: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n동작·연기 [0.000–1.800초]: 교실의 학생 네 명과 칠판 앞 김 선생님. 칠판에는 \u003c자기소개하기>.\n화면 위치: 트랑 오른쪽, 나디아 오른쪽, 루카스 왼쪽, 아델 왼쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S01-BC002 [1.800–10.267초]\n공간 배치: 학생 어깨가 걸린 교사 미디엄.\n렌즈와 높이: 43mm 상당의 화각, 눈높이 사선.\n첫 화면 인물: 김 선생님 중앙、트랑 왼쪽.\n참조: @image2(트랑), @image6(김 선생님).\n구도·앵글: 학생 어깨가 걸린 교사 미디엄. 눈높이 사선.\n화면 구성: 학생 어깨가 걸린 교사 미디엄\n관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.800초]: 김 선생님의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n시선 연결 [1.800초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n행동: 김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.\n전환 이유: 발화하는 교사의 얼굴로 관심을 옮긴다.\n화면 위치: 김 선생님 중앙, 트랑 왼쪽.\n발화 S01-L01 [1.860–6.832초] — 김 선생님 (@Audio1)\n“안녕하세요? 저는 김 선생님이에요. 한국 사람이에요.”\n발화 S01-L02 [6.993–10.132초] — 김 선생님 (@Audio1)\n“한국어 선생님이에요. 반가워요.”\n\n컷 S01-BC003 [10.267–17.333초]\n공간 배치: 교사와 첫 발표자의 이동을 담은 사선 투숏.\n렌즈와 높이: 32mm 상당의 화각, 눈높이 사선.\n첫 화면 인물: 김 선생님 왼쪽、트랑 오른쪽、루카스 오른쪽、아델 오른쪽.\n참조: @image2(트랑), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 교사와 첫 발표자의 이동을 담은 사선 투숏. 눈높이 사선.\n화면 구성: 교사와 첫 발표자의 이동을 담은 사선 투숏\n관계: 교사의 초대와 트랑의 응답을 한 공간 안에서 연결한다.\n카메라 이동: 카메라 위치를 유지하며 필요한 방향으로 팬·틸트한다. 시작 배치: 김 선생님 왼쪽、트랑 오른쪽、루카스 오른쪽、아델 오른쪽. 중간 배치: 김 선생님 왼쪽、트랑 오른쪽、루카스 오른쪽、아델 오른쪽. 도착 배치: 김 선생님 중앙、트랑 중앙、루카스 오른쪽. 같은 대화 축과 좌우 관계를 유지하며 순간이동하지 않는다.\n시선 연결 [10.267초]: 김 선생님의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n시선 연결 [13.133초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [10.267초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n인물 동선 [14.983–17.333초]: 트랑의 이동 구간. 아래 행동에 적힌 통로·목적지를 따르며 시작·종료 배치를 연결한다. 이미 끝난 이동을 다시 시작하지 않는다.\n행동: 자기소개 안내와 트랑 호명을 같은 관계 구도에서 받는다. 트랑이 일어나 칠판 앞으로 나오는 동안 카메라가 작게 팬한다.\n동작·연기 [13.133–14.533초]: 트랑에게 앞으로 나오라는 손짓을 하며\n동작·연기 [14.533–17.333초]: 트랑이 창가 앞자리에서 일어나 통로를 지나 칠판 앞으로 나온다.\n전환 이유: 호명과 실제 자리 이동이 새로운 관계를 만든다.\n시작 화면: 김 선생님 왼쪽, 트랑 오른쪽, 루카스 오른쪽, 아델 오른쪽.\n끝 화면: 김 선생님 중앙, 트랑 중앙, 루카스 오른쪽.\n발화 S01-L03 [10.327–12.987초] — 김 선생님 (@Audio1)\n“그럼 여러분도 자기소개를 해 보세요.”\n발화 S01-L04 [13.193–14.423초] — 김 선생님 (@Audio1)\n“트랑 씨?”\n\n컷 S01-BC004 [17.333–25.067초]\n공간 배치: 정면에 가까운 교사·트랑 상반신 투숏.\n렌즈와 높이: 47mm 상당의 화각, 발표자 눈높이.\n첫 화면 인물: 김 선생님 오른쪽、트랑 왼쪽.\n참조: @image2(트랑), @image6(김 선생님).\n구도·앵글: 정면에 가까운 교사·트랑 상반신 투숏. 발표자 눈높이.\n화면 구성: 정면에 가까운 교사·트랑 상반신 투숏\n관계: 첫 발표자와 안내하는 교사의 반응이 동시에 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [17.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [17.333초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n행동: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n동작·연기 [17.333–18.933초]: 앞으로 나와서 칠판 앞에 선다.\n전환 이유: 이동을 마친 두 사람의 표정과 방향을 가까이 읽는다.\n화면 위치: 김 선생님 오른쪽, 트랑 왼쪽.\n발화 S01-L05 [17.393–18.784초] — 트랑 (@Audio2)\n“안녕하세요?”\n발화 S01-L06 [18.993–24.921초] — 트랑 (@Audio2)\n“저는 트랑이에요. 베트남 사람이에요. 학생이에요. 반가워요.”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.933초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 25.067초까지 사용한다.\n", "text_url": "media/no_previs_v001/SEQ01/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "generation_seconds": 26, "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S01-BC001", "filename": "SEQ01_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ01/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ01/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "아델 캐릭터시트", "filename": "image03_ADELE.png", "url": "media/prompts_v004/SEQ01/image03_ADELE.png", "status": "ready"}, {"tag": "@image5", "kind": "이미지", "label": "루카스 캐릭터시트", "filename": "image04_LUCAS.png", "url": "media/prompts_v004/SEQ01/image04_LUCAS.png", "status": "ready"}, {"tag": "@image6", "kind": "이미지", "label": "김 선생님 캐릭터시트", "filename": "image05_TEACHER_KIM.png", "url": "media/prompts_v004/SEQ01/image05_TEACHER_KIM.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "김 선생님 음색 참조", "filename": "김선생님_v2.wav", "url": "media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}]}, {"id": "SEQ02", "scene_title": "S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮", "shot_ids": ["S01-BC005", "S01-BC006", "S01-BC007"], "text": "시퀀스 02 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 22초 · 본편 사용 21.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 \u003c자기소개하기>는 후반 합성한다.\n시작 컷의 연출: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n끝 컷의 연출: 나디아가 호명을 듣고 일어나 칠판 앞으로 나온다. 아델은 돌아가며 트랑은 앉아서 나디아를 따라본다. 나디아의 첫 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC005 [0.000–6.400초]\n공간 배치: 교실 오른쪽 뒤 사선에서 두 통로의 교대를 함께 보는 넓은 구도.\n렌즈와 높이: 28mm 상당의 화각, 눈높이.\n첫 화면 인물: 김 선생님 왼쪽、트랑 왼쪽、나디아 오른쪽、루카스 중앙、아델 오른쪽.\n참조: @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 오른쪽 뒤 사선 교대 와이드. 눈높이.\n화면 구성: 교실 오른쪽 뒤 사선에서 두 통로의 교대를 함께 보는 넓은 구도\n관계: 앞 발표자가 청자로 돌아가고 다음 발표자가 중심이 되는 교대.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 아델의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [3.200초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.333초]: 트랑의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 김 선생님의 눈길은 아델 쪽으로 향한다.\n인물 동선 [0.250–6.150초]: 트랑의 이동 구간. 아래 행동에 적힌 통로·목적지를 따르며 시작·종료 배치를 연결한다. 이미 끝난 이동을 다시 시작하지 않는다.\n인물 동선 [3.650 }, {"tag": "@image6", "kind": "이미지", "label": "김 선생님 캐릭터시트", "filename": "image05_TEACHER_KIM.png", "url": "media/prompts_v004/SEQ02/image05_TEACHER_KIM.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "김 선생님 음색 참조", "filename": "김선생님_v2.wav", "url": "media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "아델 음색 참조", "filename": "아델_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ03", "scene_title": "S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮", "shot_ids": ["S01-BC008", "S01-BC009", "S01-BC010", "S01-BC011"], "text": "시퀀스 03 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 23초 · 본편 사용 22.200초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio3 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 \u003c자기소개하기>는 후반 합성한다.\n시작 컷의 연출: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n끝 컷의 연출: 김 선생님의 아주 잘했어요를 교실 관계 구도에서 받는다. 학생들은 마지막 칭찬을 듣고 시선을 교사에게 모은다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC008 [0.000–6.267초]\n공간 배치: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏.\n렌즈와 높이: 28mm 상당의 화각, 앉은 트랑 눈높이에서 약간 올려봄.\n첫 화면 인물: 김 선생님 왼쪽、트랑 오른쪽、나디아 왼쪽、루카스 중앙、아델 오른쪽.\n참조: @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 나디아와 트랑의 낮은 사선 투숏. 앉은 트랑 눈높이에서 약간 올려봄.\n화면 구성: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏\n관계: 처음 만 별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio5 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n끝 컷의 연출: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC001 [0.000–1.200초]\n공간 배치: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체..\n렌즈와 높이: 29mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 아델 왼쪽、미오 중앙、루카스 오른쪽、장홍 오른쪽、트랑 왼쪽、나디아 왼쪽、정 선생님 중앙.\n참조: @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(미오), @image7(장홍), @image8(정 선생님).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 정 선생님의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n행동: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n동작·연기 [0.000–1.200초]: 로비의 정 선생님과 배정을 기다리는 학생들. 장부를 든 선생님에게 시선이 모인다.\n화면 위치: 아델 왼쪽, 미오 중앙, 루카스 오른쪽, 장홍 오른쪽, 트랑 왼쪽, 나디아 왼쪽, 정 선생님 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S02-BC002 [1.200–7 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio2 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n@Audio3 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n끝 컷의 연출: 401호 호명에 루카스가 먼저 손을 흔들고 장홍에게 다가간다. 장홍은 어색하게 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC005 [0.000–6.867초]\n공간 배치: 아델의 낮은 어깨와 측면을 전경에 두고 미오의 3/4 얼굴을 크게 담는다. 짧은 문답마다 카메라를 되돌리지 않는다..\n렌즈와 높이: 50mm 상당의 화각, 대화 축을 유지한 어깨 너머 사선.\n첫 화면 인물: 아델 오른쪽、미오 중앙、나디아 오른쪽.\n참조: @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 아델의 낮은 어깨와 측면을 전경에 두고 미오의 3/4 얼굴을 크게 담는다. 짧은 문답마다 카메라를 되돌리지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 미오의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 미오 쪽으로 향한다.\n행동: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n화면 위치: 아델 오른쪽, 미오 중앙, 나디아 오른쪽.\n발화 S02-L09 [0.060–1.820초] — 아델 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L10 [1.993–3.600초] — 미오 (@Audio2)\n“일본 사람이에요.”\n발화 S02-L11 [3.793–5.196초] — 아델 (@Audio1)\n“직업이 뭐예요?”\n발화 S02-L12 [5.393–6.738초] — 미오 (@Audio2)\n“학생이에요.”\n\n컷 S02-BC006 [6.867–11.267초]\n공간 배치: 중앙에 가까운 낮은 눈높이 투숏. 질문자와 답변자 구도를 벗어나 비슷한 화면 크기의 두 사람이 서로 받아주는 모습을 유지..\n렌즈와 높이: 46mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 아델 오른쪽、미오 왼쪽、트랑 중앙、나디아 왼쪽.\n참조: @image2(트랑), @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 중앙에 가까운 낮은 눈높이 투숏. 질문자와 답변자 구도를 벗어나 비슷한 화면 크기의 두 사람이 서로 받아주는 모습을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.867초]: 아델의 눈길은 미오 쪽으로 향한다.\n시선 연결 [6.867초]: 미오의 눈길은 아델 쪽으로 향한다.\n행동: 아델이 모델이라고 소개하고 두 사람이 반갑다고 인사를 나눈다.\n전환 이유: 미오의 신상 답변에서 아델의 새로운 직업 정보와 상호 인사로 관심이 넓어진다.\n화면 위치: 아델 오른쪽, 미오 왼쪽, 트랑 중앙, 나디아 왼쪽.\n발화 S02-L13 [6.927–9.761초] — 아델 (@Audio1)\n“저는 모델이에요. 반가워요.”\n발화 S02-L14 [9.927–11.156초] — 미오 (@Audio2)\n“반가워요.”\n\n컷 S02-BC007 [11.267–17.067초]\n공간 배치: 교사 방향에서 장홍 얼굴과 루카스의 접근을 함께 담는 사선 투숏. 손 인사 뒤 짧은 팬으로 둘의 새 간격에 정착..\n렌즈와 높이: 35mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 루카스 오른쪽、장홍 왼쪽.\n참조: @image5(루카스), @image7(장홍), @image8(정 선생님).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사 방향에서 장홍 얼굴과 루카스의 접근을 함께 담는 사선 투숏. 손 인사 뒤 짧은 팬으로 둘의 새 간격에 정착.\n카메라 이동: 인물 행동을 따라 카메라를 부드럽게 이동하며 아래 도착 배치로 연결한다. 시작 배치: 루카스 오른쪽、장홍 왼쪽. 중간 배치: 루카스 오른쪽、장홍 왼쪽. 도착 배치: 루카스 오른쪽、장홍 왼쪽. 같은 대화 축과 좌우 관계를 유지하며 순간이동하지 않는다.\n시선 연결 [11.267초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [15.933초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [11.267초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [15.933초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [15.933–17.067초]: 루카스의 이동 구간. 아래 행동에 적힌 통로·목적지를 따르며 시작·종료 배치를 연결한다. 이미 끝난 이동을 다시 시작하지 않는다.\n행동: 401호 호명에 루카스가 먼저 손을 흔들고 장홍에게 다가간다. 장홍은 어색하게 인사를 받는다.\n동작·연기 [15.933–17.067초]: 루카스가 장홍에게 손을 흔들고 다가간다. 안경 쓴 장홍은 어색하게 웃는다.\n전환 이유: 동시에 반응하는 첫 쌍, 아델이 찾아가는 둘째 쌍에 이어 적극적인 사람과 조심스러운 수신자의 대비를 보여준다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽.\n발화 S02-L15 [11.327–15.831초] — 정 선생님 (@Audio3)\n“루카스 씨! 장홍 씨! Room nuber is 401!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.933초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 17.067초까지 사용한다.\n", "text_url": "media/no_previs_v001/SEQ05/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "generation_seconds": 18, "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S02-BC005", "filename": "SEQ05_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ05/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ05/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "아델 캐릭터시트", "filename": "image03_ADELE.png", "url": "media/prompts_v004/SEQ05/image03_ADELE.png", "status": "ready"}, {"tag": "@image5", "kind": "이미지", "label": "루카스 캐릭터시트", "filename": "image04_LUCAS.png", "url": "media/prompts_v004/SEQ05/image04_LUCAS.png", "status": "ready"}, {"tag": "@image6", "kind": "이미지", "label": "미오 캐릭터시트", "filename": "image05_MIO.png", "url": "media/prompts_v004/SEQ05/image05_MIO.png", "status": "ready"}, {"tag": "@image7", "kind": "이미지", "label": "장홍 캐릭터시트", "filename": "image06_ZHANGHONG.png", "url": "media/prompts_v004/SEQ05/image06_ZHANGHONG.png", "status": "ready"}, {"tag": "@image8", "kind": "이미지", "label": "정 선생님 캐릭터시트", "filename": "image07_TEACHER_JEONG.png", "url": "media/prompts_v004/SEQ05/image07_TEACHER_JEONG.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "아델 음색 참조", "filename": "아델_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "미오 음색 참조", "filename": "미오_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%AF%B8%EC%98%A4_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "정 선생님 음색 참조", "filename": "정선생님_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%A0%95%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav", "status": "ready"}]}, {"id": "SEQ06", "scene_title": "S#2. 과기대 생활관 로비 / 낮", "shot_ids": ["S02-BC008", "S02-BC009", "S02-BC010", "S02-BC011"], "text": "시퀀스 06 — S#2. 과기대 생활관 로비 / 낮\n생성 23초 · 본편 사용 23.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image5 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 장홍 전용 음색. 차분하고 약간 수줍은 남성 음색. 중국어 억양이 남은 한국어 초보자. 음절 높낮이가 조금 분리되지만 원문 단어는 전부 알아들을 수 있게 발음.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n끝 컷의 연출: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC008 [0.000–6.533초]\n공간 배치: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽으로 열고 머리만 상대를 향한다..\n렌즈와 높이: 42mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 루카스 오른쪽、장홍 왼쪽.\n참조: @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽으로 열고 머리만 상대를 향한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽.\n발화 S02-L16 [0.060–4.501초] — 루카스 (@Audio1)\n“안녕하세요? 저는 루카스예요. 이름이 뭐예요?”\n발화 S02-L17 [4.727–6.411초] — 장홍 (@Audio2)\n“저는 장홍이에요.”\n\n컷 S02-BC009 [6.533–10.600초]\n공간 배치: 루카스 어깨 너머 장홍의 정면에 가까운 얼굴. 질문과 답을 분절하지 않는다..\n렌즈와 높이: 50mm 상당의 화각, 대화 축을 유지한 어깨 너머 사선.\n첫 화면 인물: 루카스 오른쪽、장홍 중앙.\n참조: @image4(루카스), @image5(장홍).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 루카스 어깨 너머 장홍의 정면에 가까운 얼굴. 질문과 답을 분절하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.533초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n행동: 루카스의 국적 질문을 듣고 장홍이 중국 사람이라고 답한다.\n전환 이유: 이름을 겨우 받아준 장홍이 자신의 정보를 더 말하는 순간에 응답 얼굴을 선택한다.\n화면 위치: 루카스 오른쪽, 장홍 중앙.\n발화 S02-L18 [6.593–8.353초] — 루카스 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L19 [8.527–10.443초] — 장홍 (@Audio2)\n“저는 중국 사람이에요.”\n\n컷 S02-BC010 [10.600–17.400초]\n공간 배치: 루카스 쪽에 무게를 둔 사선 투숏. 장홍의 되묻는 시선과 루카스의 수신을 같은 프레임에서 이어간다..\n렌즈와 높이: 42mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 루카스 오른쪽、장홍 왼쪽、트랑 오른쪽、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아), @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스 쪽에 무게를 둔 사선 투숏. 장홍의 되묻는 시선과 루카스의 수신을 같은 프레임에서 이어간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [10.600초]: 루카스의 눈길
