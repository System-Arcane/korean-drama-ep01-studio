 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 00:00–00:04 — 교사의 시선 쪽에서 학생 네 명과 테이블 깊이를 읽는다.\u003c/p>\u003cp>기존 샷: S01-FC001\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ01 · S01-BC001, S01-BC002, S01-BC003, S01-BC004\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ01/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ01/SEQ01_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ01/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ01/SEQ01_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ01_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ01/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ01/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ01/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ01/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · TEACHER_KIM · \u003ca href=\"media/prompts_v004/SEQ01/image05_TEACHER_KIM.png\" download>image05_TEACHER_KIM.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 01 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 26초 · 본편 사용 25.067초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n끝 컷의 연출: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC001 [0.000–1.800초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스).\n구도·앵글: 교사 쪽에서 본 학생 넷의 사선 마스터. 앉은 눈높이보다 약간 높음.\n화면 구성: 교사 쪽에서 본 학생 넷의 사선 마스터\n관계: 네 학생이 같은 수업을 듣는 공간을 먼저 확인한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n행동: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n동작·연기 [0.000–1.800초]: 교실의 학생 네 명과 칠판 앞 김 선생님. 칠판에는 &lt;자기소개하기&gt;.\n화면 위치: 트랑 오른쪽, 나디아 오른쪽, 루카스 왼쪽, 아델 왼쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S01-BC002 [1.800–10.267초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 학생 어깨가 걸린 교사 미디엄. 눈높이 사선.\n화면 구성: 학생 어깨가 걸린 교사 미디엄\n관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.800초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.800초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n행동: 김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정 ·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.933초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 25.067초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S01-BC001.mp4", "poster": "media/previs_v009/S01-BC001.png", "label": "S01-BC001 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 1.8, "framing": "교사 쪽에서 본 학생 넷의 사선 마스터", "angle": "앉은 눈높이보다 약간 높음", "leaf": true, "source_shot_ids": ["S01-FC001"], "prompt_group": "SEQ01", "revision": "4f918df67fb925af776de8aefef87292987ea8c2a1869996e08f2c92a5894bd2"}, {"id": "S01-BC002", "parent": "S01", "kind": "shot", "kindLabel": "샷", "title": "S01-BC002", "summary": "김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.", "body": "\u003cp>김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.\u003c/p>\u003cp>구도: 학생 어깨가 걸린 교사 미디엄。교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\u003c/p>\u003cp>관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\u003c/p>\u003cp>배치: 학생 어깨가 걸린 교사 미디엄\u003c/p>\u003cp>전환: 발화하는 교사의 얼굴로 관심을 옮긴다.\u003c/p>\u003cp>학생 어깨가 걸린 교사 미디엄 · 눈높이 사선 · 고정 · 43mm · 설계값\u003c/p>\u003cp>김 선생님: 안녕하세요? 저는 김 선생님이에요. 한국 사람이에요.\u003c/p>\u003cp>김 선생님: 한국어 선생님이에요. 반가워요.\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S01-BC002.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S01.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 00:17–00:24 — 교사와 전경 학생의 공간 연결.\u003c/p>\u003cp>기존 샷: S01-FC002\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ01 · S01-BC001, S01-BC002, S01-BC003, S01-BC004\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ01/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SE 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n끝 컷의 연출: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC001 [0.000–1.800초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스).\n구도·앵글: 교사 쪽에서 본 학생 넷의 사선 마스터. 앉은 눈높이보다 약간 높음.\n화면 구성: 교사 쪽에서 본 학생 넷의 사선 마스터\n관계: 네 학생이 같은 수업을 듣는 공간을 먼저 확인한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n행동: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n동작·연기 [0.000–1.800초]: 교실의 학생 네 명과 칠판 앞 김 선생님. 칠판에는 &lt;자기소개하기&gt;.\n화면 위치: 트랑 오른쪽, 나디아 오른쪽, 루카스 왼쪽, 아델 왼쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S01-BC002 [1.800–10.267초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 학생 어깨가 걸린 교사 미디엄. 눈높이 사선.\n화면 구성: 학생 어깨가 걸린 교사 미디엄\n관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.800초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.800초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n행동: 김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.\n전환 이유: 발화하는 교사의 얼굴로 관심을 옮긴다.\n화면 위치: 김 선생님 중앙, 트랑 왼쪽.\n발화 S01-L01 [1.860–6.832초] — 김 선생님 (@Audio1)\n“안녕하세요? 저는 김 선생님이에요. 한국 사람이에요.”\n발화 S01-L02 [6.993–10.132초] — 김 선생님 (@Audio1)\n“한국어 선생님이에요. 반가워요.”\n\n컷 S01-BC003 [10.267–17.333초]\n참조: @Video1, @image2(트랑), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 교사와 첫 발표자의 이동을 담은 사선 투숏. 눈높이 사선.\n화면 구성: 교사와 첫 발표자의 이동을 담은 사선 투숏\n관계: 교사의 초대와 트랑의 응답을 한 공간 안에서 연결한다.\n카메라 이동: 14.983–15.158초, 15.158–15.333초, 15.333–16.025초, 16.025–16.717초, 16.717–17.025초, 17.025–17.333초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [10.267초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [13.133초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [10.267초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n인물 동선 [14.983–17.333초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 자기소개 안내와 트랑 호명을 같은 관계 구도에서 받는다. 트랑이 일어나 칠판 앞으로 나오는 동안 카메라가 작게 팬한다.\n동작·연기 [13.133–14.533초]: 트랑에게 앞으로 나오라는 손짓을 하며\n동작·연기 [14.533–17.333초]: 트랑이 창가 앞자리에서 일어나 통로를 지나 칠판 앞으로 나온다.\n전환 이유: 호명과 실제 자리 이동이 새로운 관계를 만든다.\n시작 화면: 김 선생님 왼쪽, 트랑 오른쪽, 루카스 오른쪽, 아델 오른쪽.\n끝 화면: 김 선생님 중앙, 트랑 중앙, 루카스 오른쪽.\n발화 S01-L03 [10.327–12.987초] — 김 선생님 (@Audio1)\n“그럼 여러분도 자기소개를 해 보세요.”\n발화 S01-L04 [13.193–14.423초] — 김 선생님 (@Audio1)\n“트랑 씨?”\n\n컷 S01-BC004 [17.333–25.067초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 정면에 가까운 교사·트랑 상반신 투숏. 발표자 눈높이.\n화면 구성: 정면에 가까운 교사·트랑 상반신 투숏\n관계: 첫 발표자와 안내하는 교사의 반응이 동시에 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [17.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [17.333초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n행동: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n동작·연기 [17.333–18.933초]: 앞으로 나와서 칠판 앞에 선다.\n전환 이유: 이동을 마친 두 사람의 표정과 방향을 가까이 읽는다.\n화면 위치: 김 선생님 오른쪽, 트랑 왼쪽.\n발화 S01-L05 [17.393–18.784초] — 트랑 (@Audio2)\n“안녕하세요?”\n발화 S01-L06 [18.993–24.921초] — 트랑 (@Audio2)\n“저는 트랑이에요. 베트남 사람이에요. 학생이에요. 반가워요.”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.933초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 25.067초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S01-BC002.mp4", "poster": "media/previs_v009/S01-BC002.png", "label": "S01-BC002 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "pro \n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n끝 컷의 연출: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC001 [0.000–1.800초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스).\n구도·앵글: 교사 쪽에서 본 학생 넷의 사선 마스터. 앉은 눈높이보다 약간 높음.\n화면 구성: 교사 쪽에서 본 학생 넷의 사선 마스터\n관계: 네 학생이 같은 수업을 듣는 공간을 먼저 확인한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n행동: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n동작·연기 [0.000–1.800초]: 교실의 학생 네 명과 칠판 앞 김 선생님. 칠판에는 &lt;자기소개하기&gt;.\n화면 위치: 트랑 오른쪽, 나디아 오른쪽, 루카스 왼쪽, 아델 왼쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S01-BC002 [1.800–10.267초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 학생 어깨가 걸린 교사 미디엄. 눈높이 사선.\n화면 구성: 학생 어깨가 걸린 교사 미디엄\n관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.800초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.800초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n행동: 김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.\n전환 이유: 발화하는 교사의 얼굴로 관심을 옮긴다.\n화면 위치: 김 선생님 중앙, 트랑 왼쪽.\n발화 S01-L01 [1.860–6.832초] — 김 선생님 (@Audio1)\n“안녕하세요? 저는 김 선생님이에요. 한국 사람이에요.”\n발화 S01-L02 [6.993–10.132초] — 김 선생님 (@Audio1)\n“한국어 선생님이에요. 반가워요.”\n\n컷 S01-BC003 [10.267–17.333초]\n참조: @Video1, @image2(트랑), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 교사와 첫 발표자의 이동을 담은 사선 투숏. 눈높이 사선.\n화면 구성: 교사와 첫 발표자의 이동을 담은 사선 투숏\n관계: 교사의 초대와 트랑의 응답을 한 공간 안에서 연결한다.\n카메라 이동: 14.983–15.158초, 15.158–15.333초, 15.333–16.025초, 16.025–16.717초, 16.717–17.025초, 17.025–17.333초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [10.267초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [13.133초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [10.267초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n인물 동선 [14.983–17.333초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 자기소개 안내와 트랑 호명을 같은 관계 구도에서 받는다. 트랑이 일어나 칠판 앞으로 나오는 동안 카메라가 작게 팬한다.\n동작·연기 [13.133–14.533초]: 트랑에게 앞으로 나오라는 손짓을 하며\n동작·연기 [14.533–17.333초]: 트랑이 창가 앞자리에서 일어나 통로를 지나 칠판 앞으로 나온다.\n전환 이유: 호명과 실제 자리 이동이 새로운 관계를 만든다.\n시작 화면: 김 선생님 왼쪽, 트랑 오른쪽, 루카스 오른쪽, 아델 오른쪽.\n끝 화면: 김 선생님 중앙, 트랑 중앙, 루카스 오른쪽.\n발화 S01-L03 [10.327–12.987초] — 김 선생님 (@Audio1)\n“그럼 여러분도 자기소개를 해 보세요.”\n발화 S01-L04 [13.193–14.423초] — 김 선생님 (@Audio1)\n“트랑 씨?”\n\n컷 S01-BC004 [17.333–25.067초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 정면에 가까운 교사·트랑 상반신 투숏. 발표자 눈높이.\n화면 구성: 정면에 가까운 교사·트랑 상반신 투숏\n관계: 첫 발표자와 안내하는 교사의 반응이 동시에 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [17.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [17.333초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n행동: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n동작·연기 [17.333–18.933초]: 앞으로 나와서 칠판 앞에 선다.\n전환 이유: 이동을 마친 두 사람의 표정과 방향을 가까이 읽는다.\n화면 위치: 김 선생님 오른쪽, 트랑 왼쪽.\n발화 S01-L05 [17.393–18.784초] — 트랑 (@Audio2)\n“안녕하세요?”\n발화 S01-L06 [18.993–24.921초] — 트랑 (@Audio2)\n“저는 트랑이에요. 베트남 사람이에요. 학생이에요. 반가워요.”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.933초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 25.067초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S01-BC003.mp4", "poster": "media/previs_v009/S01-BC003.png", "label": "S01-BC003 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 7.07, "framing": "교사와 첫 발표자의 이동을 담은 사선 투숏", "angle": "눈높이 사선", "leaf": true, "source_shot_ids": ["S01-FC005"], "prompt_group": "SEQ01", "revision": "379b5e2a818542ced58b173d0b282d0223222d0befab239d601cd14e89eef4d3"}, {"id": "S01-BC004" f=\"media/prompts_v004/SEQ01/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ01/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ01/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ01/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · TEACHER_KIM · \u003ca href=\"media/prompts_v004/SEQ01/image05_TEACHER_KIM.png\" download>image05_TEACHER_KIM.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 01 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 26초 · 본편 사용 25.067초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n끝 컷의 연출: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC001 [0.000–1.800초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스).\n구도·앵글: 교사 쪽에서 본 학생 넷의 사선 마스터. 앉은 눈높이보다 약간 높음.\n화면 구성: 교사 쪽에서 본 학생 넷의 사선 마스터\n관계: 네 학생이 같은 수업을 듣는 공간을 먼저 확인한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n행동: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n동작·연기 [0.000–1.800초]: 교실의 학생 네 명과 칠판 앞 김 선생님. 칠판에는 &lt;자기소개하기&gt;.\n화면 위치: 트랑 오른쪽, 나디아 오른쪽, 루카스 왼쪽, 아델 왼쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S01-BC002 [1.800–10.267초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 학생 어깨가 걸린 교사 미디엄. 눈높이 사선.\n화면 구성: 학생 어깨가 걸린 교사 미디엄\n관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.800초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.800초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n행동: 김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.\n전환 이유: 발화하는 교사의 얼굴로 관심을 옮긴다.\n화면 위치: 김 선생님 중앙, 트랑 왼쪽.\n발화 S01-L01 [1.860–6.832초] — 김 선생님 (@Audio1)\n“안녕하세요? 저는 김 선생님이에요. 한국 사람이에요.”\n발화 S01-L02 [6.993–10.132초] — 김 선생님 (@Audio1)\n“한국어 선생님이에요. 반가워요.”\n\n컷 S01-BC003 [10.267–17.333초]\n참조: @Video1, @image2(트랑), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 교사와 첫 발표자의 이동을 담은 사선 투숏. 눈높이 사선.\n화면 구성: 교사와 첫 발표자의 이동을 담은 사선 투숏\n관계: 교사의 초대와 트랑의 응답을 한 공간 안에서 연결한다.\n카메라 이동: 14.983–15.158초, 15.158–15.333초, 15.333–16.025초, 16.025–16.717초, 16.717–17.025초, 17.025–17.333초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [10.267초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [13.133초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [10.267초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n인물 동선 [14.983–17.333초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 자기소개 안내와 트랑 호명을 같은 관계 구도에서 받는다. 트랑이 일어나 칠판 앞으로 나오는 동안 카메라가 작게 팬한다.\n동작·연기 [13.133–14.533초]: 트랑에게 앞으로 나오라는 손짓을 하며\n동작·연기 [14.533–17.333초]: 트랑이 창가 앞자리에서 일어나 통로를 지나 칠판 앞으로 나온다.\n전환 이유: 호명과 실제 자리 이동이 새로운 관계를 만든다.\n시작 화면: 김 선생님 왼쪽, 트랑 오른쪽, 루카스 오른쪽, 아델 오른쪽.\n끝 화면: 김 선생님 중앙, 트랑 중앙, 루카스 오른쪽.\n발화 S01-L03 [10.327–12.987초] — 김 선생님 (@Audio1)\n“그럼 여러분도 자기소개를 해 보세요.”\n발화 S01-L04 [13.193–14.423초] — 김 선생님 (@Audio1)\n“트랑 씨?”\n\n컷 S01-BC004 [17.333–25.067초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 정면에 가까운 교사·트랑 상반신 투숏. 발표자 눈높이.\n화면 구성: 정면에 가까운 교사·트랑 상반신 투숏\n관계: 첫 발표자와 안내하는 교사의 반응이 동시에 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [17.333초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [17.333초]: 김 선생님의 눈길은 트랑 쪽으로 향한다.\n행동: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n동작·연기 [17.333–18.933초]: 앞으로 나와서 칠판 앞에 선다.\n전환 이유: 이동을 마친 두 사람의 표정과 방향을 가까이 읽는다.\n화면 위치: 김 선생님 오른쪽, 트랑 왼쪽.\n발화 S01-L05 [17.393–18.784초] — 트랑 (@Audio2)\n“안녕하세요?”\n발화 S01-L06 [18.993–24.921초] — 트랑 (@Audio2)\n“저는 트랑이에요. 베트남 사람이에요. 학생이에요. 반가워요.”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.933초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 25.067초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S01-BC004.mp4", "poster": "media/previs_v009/S01-BC004.png", "label": "S01-BC004 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 7.73, "framing": "정면에 가까운 교사·트랑 상반신 투숏", "angle": "발표자 눈높이", "leaf": true, "source_shot_ids": ["S01-FC008"], "prompt_group": "SEQ01", "revision": "66bc8041f01e47bcbc328920080bb68b33880229a0a4d2d67b090e315cc08a3f"}, {"id": "S01-BC005", "parent": "S01", "kind": "shot", "kindLabel": "샷", "title": "S01-BC005", "summary": "교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.", "body": "\u003cp>교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\u003c/p>\u003cp>구도: 교사의 호명, 트랑의 복귀, 아델의 등장을 공유 공간에서 이어 본다.\u003c/p>\u003cp>관계: 앞 발표자가 청자로 돌아가고 다음 발표자가 중심이 되는 교대.\u003c/p>\u003cp>배치: 교실 오른쪽 뒤 사선에서 두 통로의 교대를 함께 보는 넓은 구도\u003c/p>\u003cp>전환: 학생 역할이 발표자와 청자로 바뀌는 것을 함께 보여준다.\u003c/p>\u003cp>오른쪽 뒤 사선 교대 와이드 · 눈높이 · 교대가 양쪽 통로 안에서 읽히도록 넓은 사선을 고정 · 28mm · 설계값\u003c/p>\u003cp>김 선생님: 좋아요.  다음, 아델 씨?\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S01-BC005.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S01.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>Friends.10x04.The.One.With.The.Cake.avi · 07:51–07:56 — 발표자 교체를 공유 공간 안에서 연결한다.\u003c/p>\u003cp>기존 샷: S01-FC011\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ02 · S01-BC005, S01-BC006, S01-BC007\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ02/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ02/SEQ02_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ02/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ02/SEQ02_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ02_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ02/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ02/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ02/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ02/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · TEACHER_KIM · \u003ca href=\"media/prompts_v004/SEQ02/image05_TEACHER_KIM.png\" download>image05_TEACHER_KIM.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 02 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 22초 · 본편 사용 21.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n끝 컷의 연출: 나디아가 호명을 듣고 일어나 칠판 앞으로 나온다. 아델은 돌아가며 트랑은 앉아서 나디아를 따라본다. 나디아의 첫 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC005 [0.000–6.400초]\n참조: @Video1, @image2(트랑),  칠판 앞에서 인사와 자기소개를 한다. 앞줄 루카스가 듣는 모습을 같은 프레임에 유지한다.", "body": "\u003cp>아델이 칠판 앞에서 인사와 자기소개를 한다. 앞줄 루카스가 듣는 모습을 같은 프레임에 유지한다.\u003c/p>\u003cp>구도: 서 있는 아델과 앉은 루카스를 사선으로 분리해 발표와 청취를 함께 읽는다.\u003c/p>\u003cp>관계: 아델의 새 정보와 이를 듣는 앞줄 학생을 함께 읽는다.\u003c/p>\u003cp>배치: 아델 앞모습과 앞줄 루카스의 듣는 얼굴이 깊이로 이어지는 투숏\u003c/p>\u003cp>전환: 직업이라는 새 정보의 수신자를 화면 안에 함께 둔다.\u003c/p>\u003cp>아델과 루카스의 깊이 투숏 · 앉은 청자와 선 발표자 사이 높이 · 고정 · 45mm · 설계값\u003c/p>\u003cp>아델: 안녕하세요?\u003c/p>\u003cp>아델: 저는 아델이에요. 프랑스 사람이에요. 모델이에요. 반가워요.\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S01-BC006.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S01.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>Friends.10x14.The.One.With.Princess.Consuela.avi · 07:26–07:43 — 소개 정보가 청자에게 도착한 뒤의 반응까지 유지한다.\u003c/p>\u003cp>기존 샷: S01-FC013\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ02 · S01-BC005, S01-BC006, S01-BC007\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ02/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ02/SEQ02_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ02/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ02/SEQ02_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ02_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ02/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ02/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ02/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ02/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · TEACHER_KIM · \u003ca href=\"media/prompts_v004/SEQ02/image05_TEACHER_KIM.png\" download>image05_TEACHER_KIM.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 02 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 22초 · 본편 사용 21.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n끝 컷의 연출: 나디아가 호명을 듣고 일어나 칠판 앞으로 나온다. 아델은 돌아가며 트랑은 앉아서 나디아를 따라본다. 나디아의 첫 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC005 [0.000–6.400초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 오른쪽 뒤 사선 교대 와이드. 눈높이.\n화면 구성: 교실 오른쪽 뒤 사선에서 두 통로의 교대를 함께 보는 넓은 구도\n관계: 앞 발표자가 청자로 돌아가고 다음 발표자가 중심이 되는 교대.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 아델의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [3.200초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.333초]: 트랑의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 김 선생님의 눈길은 아델 쪽으로 향한다.\n인물 동선 [0.250–6.150초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [3.650–6.400초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n동작·연기 [0.000–3.200초]: 아델에게 앞으로 나오라는 손짓을 하며\n동작·연기 [3.200–6.400초]: 트랑은 자기 자리로 돌아가고 아델이 반대쪽 통로로 칠판 앞에 나온다.\n시작 화면: 김 선생님 왼쪽, 트랑 왼쪽, 나디아 오른쪽, 루카스 중앙, 아델 오른쪽.\n끝 화면: 김 선생님 왼쪽, 트랑 중앙, 나디아 오른쪽, 루카스 중앙, 아델 왼쪽.\n발화 S01-L07 [0.060–3.083초] — 김 선생님 (@Audio1)\n“좋아요.  다음, 아델 씨?”\n\n컷 S01-BC006 [6.400–14.000초]\n참조: @Video1, @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 아델과 루카스의 깊이 투숏. 앉은 청자와 선 발표자 사이 높이.\n화면 구성: 아델 앞모습과 앞줄 루카스의 듣는 얼굴이 깊이로 이어지는 투숏\n관계: 아델의 새 정보와 이를 듣는 앞줄 학생을 함께 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.400초]: 아델의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [6.400초]: 루카스의 눈길은 아델 쪽으로 향한다.\n인물 동선 [6.400–6.400초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 아델이 칠판 앞에서 인사와 자기소개를 한다. 앞줄 루카스가 듣는 모습을 같은 프레임에 유지한다.\n동작·연기 [6.400–8.000초]: 앞으로 나와서 칠판 앞에 선다.\n전환 이유: 직업이라는 새 정보의 수신자를 화면 안에 함께 둔다.\n화면 위치: 김 선생님 왼쪽, 루카스 오른쪽, 아델 왼쪽.\n발화 S01-L08 [6.460–7.850초] — 아델 (@Audio2)\n“안녕하세요?”\n발화 S01-L09 [8.060–13.852초] — 아델 (@Audio2)\n“저는 아델이에요. 프랑스 사람이에요. 모델이에요. 반가워요.”\n\n컷 S01-BC007 [14.000–21.533초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 오른쪽 뒤 사선 교대. 학생석 눈높이.\n화면 구성: 교실 오른쪽 뒤에서 아델의 복귀와 나디아의 등장을 앞뒤 깊이로 잇는 구도\n관계: 듣던 나디아가 발표자로 바뀌 c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ02/SEQ02_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ02_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ02/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ02/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ02/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ02/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · TEACHER_KIM · \u003ca href=\"media/prompts_v004/SEQ02/image05_TEACHER_KIM.png\" download>image05_TEACHER_KIM.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 02 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 22초 · 본편 사용 21.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n끝 컷의 연출: 나디아가 호명을 듣고 일어나 칠판 앞으로 나온다. 아델은 돌아가며 트랑은 앉아서 나디아를 따라본다. 나디아의 첫 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC005 [0.000–6.400초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 오른쪽 뒤 사선 교대 와이드. 눈높이.\n화면 구성: 교실 오른쪽 뒤 사선에서 두 통로의 교대를 함께 보는 넓은 구도\n관계: 앞 발표자가 청자로 돌아가고 다음 발표자가 중심이 되는 교대.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 아델의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [3.200초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.333초]: 트랑의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 김 선생님의 눈길은 아델 쪽으로 향한다.\n인물 동선 [0.250–6.150초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [3.650–6.400초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n동작·연기 [0.000–3.200초]: 아델에게 앞으로 나오라는 손짓을 하며\n동작·연기 [3.200–6.400초]: 트랑은 자기 자리로 돌아가고 아델이 반대쪽 통로로 칠판 앞에 나온다.\n시작 화면: 김 선생님 왼쪽, 트랑 왼쪽, 나디아 오른쪽, 루카스 중앙, 아델 오른쪽.\n끝 화면: 김 선생님 왼쪽, 트랑 중앙, 나디아 오른쪽, 루카스 중앙, 아델 왼쪽.\n발화 S01-L07 [0.060–3.083초] — 김 선생님 (@Audio1)\n“좋아요.  다음, 아델 씨?”\n\n컷 S01-BC006 [6.400–14.000초]\n참조: @Video1, @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 아델과 루카스의 깊이 투숏. 앉은 청자와 선 발표자 사이 높이.\n화면 구성: 아델 앞모습과 앞줄 루카스의 듣는 얼굴이 깊이로 이어지는 투숏\n관계: 아델의 새 정보와 이를 듣는 앞줄 학생을 함께 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.400초]: 아델의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [6.400초]: 루카스의 눈길은 아델 쪽으로 향한다.\n인물 동선 [6.400–6.400초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 아델이 칠판 앞에서 인사와 자기소개를 한다. 앞줄 루카스가 듣는 모습을 같은 프레임에 유지한다.\n동작·연기 [6.400–8.000초]: 앞으로 나와서 칠판 앞에 선다.\n전환 이유: 직업이라는 새 정보의 수신자를 화면 안에 함께 둔다.\n화면 위치: 김 선생님 왼쪽, 루카스 오른쪽, 아델 왼쪽.\n발화 S01-L08 [ .533초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S01-BC007.mp4", "poster": "media/previs_v009/S01-BC007.png", "label": "S01-BC007 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 7.53, "framing": "오른쪽 뒤 사선 교대", "angle": "학생석 눈높이", "leaf": true, "source_shot_ids": ["S01-FC016", "S01-FC018"], "prompt_group": "SEQ02", "revision": "a05ec9e407242cf7359303d81175ef1afdd866feab86baffc0affd3c68b108ae"}, {"id": "S01-BC008", "parent": "S01", "kind": "shot", "kindLabel": "샷", "title": "S01-BC008", "summary": "나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.", "body": "\u003cp>나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\u003c/p>\u003cp>구도: 발표자와 청자의 얼굴 방향을 모두 살려 서로 인사를 받는 관계를 읽는다.\u003c/p>\u003cp>관계: 처음 만난 학생 사이의 작은 응답을 앞뒤 깊이와 높이 차이로 읽는다.\u003c/p>\u003cp>배치: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏\u003c/p>\u003cp>전환: 나디아의 인사가 특정 청자에게 닿는 순간을 가까이 확인한다.\u003c/p>\u003cp>나디아와 트랑의 낮은 사선 투숏 · 앉은 트랑 눈높이에서 약간 올려봄 · 고정 · 28mm · 설계값\u003c/p>\u003cp>나디아: 저는 나디아예요. 인도네시아 사람이에요. 학생이에요. 반가워요.\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S01-BC008.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S01.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>Friends.10x13.The.One.Where.Joey.Speaks.French.avi · 04:51–04:54 — 나란한 두 사람과 다른 전후·높이 투숏을 사용한다.\u003c/p>\u003cp>기존 샷: S01-FC018\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ03 · S01-BC008, S01-BC009, S01-BC010, S01-BC011\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ03/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ03/SEQ03_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio3 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n끝 컷의 연출: 김 선생님의 아주 잘했어요를 교실 관계 구도에서 받는다. 학생들은 마지막 칭찬을 듣고 시선을 교사에게 모은다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC008 [0.000–6.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 나디아와 트랑의 낮은 사선 투숏. 앉은 트랑 눈높이에서 약간 올려봄.\n화면 구성: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏\n관계: 처음 만난 학생 사이의 작은 응답을 앞뒤 깊이와 높이 차이로 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n화면 위치: 김 선생님 왼쪽, 트랑 오른쪽, 나디아 왼쪽, 루카스 중앙, 아델 오른쪽.\n발화 S01-L12 [0.060–6.121초] — 나디아 (@Audio1)\n“저는 나디아예요. 인도네시아 사람이에요. 학생이에요. 반가워요.”\n\n컷 S01-BC009 [6.267–11.667초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 왼쪽 뒤 사선 교대. 약간 높은 교실 사선.\n화면 구성: 왼쪽 뒤에서 나디아의 복귀와 루카스의 출발을 아델 전경 너머로 보는 구도\n관계: 루카스의 출발과 앞 발표자의 복귀가 하나의 교실 흐름으로 이어진다.\n카메라 이동: 6.517–6.917초, 9.317–9.492초, 9.492–9.667초, 9.667–10.217초, 10.217–10.767초, 10.767–10.909초, 10.909–11.051초, 11.051–11.084초, 11.084–11.117초, 11.117–11.267초, 11.267–11.417초, 11.417–11.517초, 11.517–11.617초, 11.617–11.642초, 11.642–11.667초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [6.267초]: 루카스의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [8.867초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [  · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 03 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 23초 · 본편 사용 22.200초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio3 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n끝 컷의 연출: 김 선생님의 아주 잘했어요를 교실 관계 구도에서 받는다. 학생들은 마지막 칭찬을 듣고 시선을 교사에게 모은다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC008 [0.000–6.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 나디아와 트랑의 낮은 사선 투숏. 앉은 트랑 눈높이에서 약간 올려봄.\n화면 구성: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏\n관계: 처음 만난 학생 사이의 작은 응답을 앞뒤 깊이와 높이 차이로 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n화면 li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ03/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ03/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ03/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ03/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · TEACHER_KIM · \u003ca href=\"media/prompts_v004/SEQ03/image05_TEACHER_KIM.png\" download>image05_TEACHER_KIM.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 김 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EA%B9%80%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>김선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 03 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 23초 · 본편 사용 22.200초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio3 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n끝 컷의 연출: 김 선생님의 아주 잘했어요를 교실 관계 구도에서 받는다. 학생들은 마지막 칭찬을 듣고 시선을 교사에게 모은다.\n이전 image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio3 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 &lt;자기소개하기&gt;는 후반 합성한다.\n시작 컷의 연출: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n끝 컷의 연출: 김 선생님의 아주 잘했어요를 교실 관계 구도에서 받는다. 학생들은 마지막 칭찬을 듣고 시선을 교사에게 모은다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC008 [0.000–6.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 나디아와 트랑의 낮은 사선 투숏. 앉은 트랑 눈높이에서 약간 올려봄.\n화면 구성: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏\n관계: 처음 만난 학생 사이의 작은 응답을 앞뒤 깊이와 높이 차이로 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n화면 위치: 김 선생님 왼쪽, 트랑 오른쪽, 나디아 왼쪽, 루카스 중앙, 아델 오른쪽.\n발화 S01-L12 [0.060–6.121초] — 나디아 (@Audio1)\n“저는 나디아예요. 인도네시아 사람이에요. 학생이에요. 반가워요.”\n\n컷 S01-BC009 [6.267–11.667초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 왼쪽 뒤 사선 교대. 약간 높은 교실 사선.\n화면 구성: 왼쪽 뒤에서 나디아의 복귀와 루카스의 출발을 아델 전경 너머로 보는 구도\n관계: 루카스의 출발과 앞 발표자의 복귀가 하나의 교실 흐름으로 이어진다.\n카메라 이동: 6.517–6.917초, 9.317–9.492초, 9.492–9.667초, 9.667–10.217초, 10.217–10.767초, 10.767–10.909초, 10.909–11.051초, 11.051–11.084초, 11.084–11.117초, 11.117–11.267초, 11.267–11.417초, 11.417–11.5 리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio5 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n끝 컷의 연출: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC001 [0.000–1.200초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(미오), @image7(장홍), @image8(정 선생님).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n행동: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n동작·연기 [0.000–1.200초]: 로비의 정 선생님과 배정을 기다리는 학생들. 장부를 든 선생님에게 시선이 모인다.\n화면 위치: 아델 왼쪽, 미오 중앙, 루카스 오른쪽, 장홍 오른쪽, 트랑 왼쪽, 나디아 왼쪽, 정 선생님 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S02 미 가까운 첫 쌍과 달리 이번 쌍은 처음 서로를 찾아 다가가야 한다.\n시작 화면: 아델 중앙, 미오 왼쪽, 트랑 왼쪽, 나디아 왼쪽.\n중간 화면: 아델 오른쪽, 미오 왼쪽, 트랑 왼쪽, 나디아 왼쪽.\n발화 S02-L06 [15.927–19.515초] — 정 선생님 (@Audio1)\n“아델 씨, 미오 씨, You are in room 302!”\n발화 S02-L07 [20.660–24.804초] — 아델 (@Audio4)\n“미오 씨? 안녕하세요? 저는 아델이에요.”\n발화 S02-L08 [24.993–26.384초] — 미오 (@Audio5)\n“안녕하세요?”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.467초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 26.533초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S02-BC001.mp4", "poster": "media/previs_v009/S02-BC001.png", "label": "S02-BC001 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 1.2, "framing": "공간 전체", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S02-FC001"], "prompt_group": "SEQ04", "revision": "7ed8f80cdc2747e43850cb9f0a7d6de3d9736afc6439c8fc27961badfa1f6444"}, {"id": "S02-BC002", "parent": "S02", "kind": "shot", "kindLabel": "샷", "title": "S02-BC002", "summary": "정 선생님이 인사하고 장부를 확인하며 방 배정을 안내한다.", "body": "\u003cp>정 선생님이 인사하고 장부를 확인하며 방 배정을 안내한다.\u003c/p>\u003cp>구도: 눈높이 사선 상반신. 배정판이 얼굴을 가리지 않으며 장부와 인사 손짓이 함께 읽힌다.\u003c/p>\u003cp>관계: 눈높이 사선 상반신. 배정판이 얼굴을 가리지 않으며 장부와 인사 손짓이 함께 읽힌다.\u003c/p>\u003cp>배치: 눈높이 사선 상반신. 배정판이 얼굴을 가리지 않으며 장부와 인사 손짓이 함께 읽힌다.\u003c/p>\u003cp>전환: 집단의 기대에서 안내자의 얼굴과 장부로 주의를 모은다.\u003c/p>\u003cp>상반신 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 56mm · 설계값\u003c/p>\u003cp>정 선생님: 안녕하세요? 저는 정 선생님이에요.\u003c/p>\u003cp>정 선생님: I‘ll tell your room assignments now.\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S02-BC002.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S02.mp4\">씬 전체\u003c/a  ZHANGHONG · \u003ca href=\"media/prompts_v004/SEQ04/image06_ZHANGHONG.png\" download>image06_ZHANGHONG.png\u003c/a>\u003c/li>\u003cli>@image8 · TEACHER_JEONG · \u003ca href=\"media/prompts_v004/SEQ04/image07_TEACHER_JEONG.png\" download>image07_TEACHER_JEONG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 정 선생님 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%A0%95%EC%84%A0%EC%83%9D%EB%8B%98_v2.wav\" download>정선생님_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 미오 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%AF%B8%EC%98%A4_v2.wav\" download>미오_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 04 — S#2. 과기대 생활관 로비 / 낮\n생성 27초 · 본편 사용 26.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio5 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n끝 컷의 연출: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC001 [0.000–1.200초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(미오), @image7(장홍), @image8(정 선생님).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n행동: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n동작·연기 [0.000–1.200초]: 로비의 정 선생님과 배정을 기다리는 학생들. 장부를 든 선생님에게 시선이 모인다.\n화면 위치: 아델 왼쪽, 미오 중앙, 루카스 오른쪽, 장홍 오른쪽, 트랑 왼쪽, 나디아 왼쪽, 정 선생님 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S02-BC002 [1.200–7.533초]\n참조: @Video1, @image8(정 선생님).\n구도·앵글: 상반신. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이 사선 상반신. 배정판이 얼굴을 가리지 않으며 장부와 인사 손짓이 함께 읽힌다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.200초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n행동: 정 선생님이 인사하고 장부를 확인하며 방 배정을 안내한다.\n전환 이유: 집단의 기대에서 안내자의 얼굴과 장부로 주의를 모은다.\n화면 위치: 정 선생님 중앙.\n발화 S02-L01 [1.260–4.680초] — 정 선생님 (@Audio1)\n“안녕하세요? 저는 정 선생님이에요.”\n발화 S02-L02 [4.860–7.425초] — 정 선생님 (@Audio1)\n“I‘ll tell your room assignments now.”\n\n컷 S0 장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.467초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 26.533초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S02-BC002.mp4", "poster": "media/previs_v009/S02-BC002.png", "label": "S02-BC002 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 6.33, "framing": "상반신", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S02-FC001"], "prompt_group": "SEQ04", "revision": "3e7fe20ea245be3f78f79b5e765be0d1eaa3804a7871210a6bdb016a4802b96a"}, {"id": "S02-BC003", "parent": "S02", "kind": "shot", "kindLabel": "샷", "title": "S02-BC003", "summary": "301호 호명을 함께 듣던 트랑과 나디아가 서로 돌아 손을 맞잡고 기뻐한다. 두 발화와 반응을 같은 화면에서 이어간다.", "body": "\u003cp>301호 호명을 함께 듣던 트랑과 나디아가 서로 돌아 손을 맞잡고 기뻐한다. 두 발화와 반응을 같은 화면에서 이어간다.\u003c/p>\u003cp>구도: 두 사람과 다른 학생 사이의 빈 통로에서 잡은 허리 위 사선 투숏. 교사 쪽 180도 축을 유지하되 전경 아델·미오에 가리지 않는다. 호명을 듣는 얼굴과 서로 돌아 맞잡는 손을 한 화면에 둔다.\u003c/p>\u003cp>관계: 두 사람과 다른 학생 사이의 빈 통로에서 잡은 허리 위 사선 투숏. 교사 쪽 180도 축을 유지하되 전경 아델·미오에 가리지 않는다. 호명을 듣는 얼굴과 서로 돌아 맞잡는 손을 한 화면에 둔다.\u003c/p>\u003cp>배치: 두 사람과 다른 학생 사이의 빈 통로에서 잡은 허리 위 사선 투숏. 교사 쪽 180도 축을 유지하되 전경 아델·미오에 가리지 않는다. 호명을 듣는 얼굴과 서로 돌아 맞잡는 손을 한 화면에 둔다.\u003c/p>\u003cp>전환: 배정이라는 정보가 두 사람의 관계를 바꾸는 순간으로 전환한다.\u003c/p>\u003cp>관계 투숏 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 34mm · 설계값\u003c/p>\u003cp>정 선생님: 트랑 씨, 나디아 씨, You are in room 301!\u003c/p>\u003cp>트랑: 나디아! We&#x27;re roommates!\u003c/p>\u003cp>나디아: I&#x27;m so happy!\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S02-BC003.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S02.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>
