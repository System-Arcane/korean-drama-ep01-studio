지는 시우에게 남고 친구들은 옆에 있다.\n전환 이유: 새 사람에게 인사하던 집단이 친구 한 명을 놀리는 익숙한 관계로 바뀐다.\n시작 화면: 트랑 왼쪽, 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 중앙, 준영 오른쪽.\n중간 화면: 트랑 왼쪽, 시우 중앙, 아델 오른쪽, 나디아 중앙, 루카스 중앙, 준영 오른쪽.\n끝 화면: 트랑 왼쪽, 아델 오른쪽, 루카스 오른쪽.\n발화 S05-L24 [22.593–24.245초] — 아델 (@Audio5)\n“트랑~~ Fall in love~”\n발화 S05-L25 [24.460–25.307초] — 루카스&amp;나디아 (@Audio1 + @Audio3)\n“오~~~!”\n원문에 지정된 이 두 사람만 동시에 말한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.533초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 26.467초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S05-BC015.mp4", "poster": "media/previs_v009/S05-BC015.png", "label": "S05-BC015 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 3.93, "framing": "관계 그룹숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S05-FC027"], "prompt_group": "SEQ13", "revision": "923933cb71565f96501dde25c2632fd8421828575695bde0d6ccea8a41d2aecb"}, {"id": "A03", "parent": null, "kind": "act", "kindLabel": "액트", "title": "서울의 첫 기록", "summary": "", "body": "", "media": null, "decision": "proposed", "decisionLabel": "제안", "production": "", "approval": null, "duration": null, "framing": "", "angle": "", "leaf": false, "revision": "209e68f9aa3c85904efc49ce9b0353035372c4a0aff0709fe367a6dff5e46f8f"}, {"id": "S06", "parent": "A03", "kind": "scene", "kindLabel": "씬", "title": "S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤", "summary": "", "body": "", "media": null, "decision": "proposed", "decisionLabel": "제안", "production": "", "approval": null, "duration": 32.0, "framing": "", "angle": "", "leaf": false, "revision": "7c0ccb40bcd569d4b3b5b60c0ca6bbf720b94d693471d2ebbb58d61140224ebf"}, {"id": "S06-BC001", "parent": "S06", "kind": "shot", "kindLabel": "샷", "title": "S06-BC001", "summary": "책상에 앉은 트랑이 셀카 녹화를 시작한다. 맞은편 침대에는 팩을 하고 누운 나디아가 있다.", "body": "\u003cp>책상에 앉은 트랑이 셀카 녹화를 시작한다. 맞은편 침대에는 팩을 하고 누운 나디아가 있다.\u003c/p>\u003cp>구도: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인.\u003c/p>\u003cp>관계: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인.\u003c/p>\u003cp>배치: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인.\u003c/p>\u003cp>전환: 셀카 화면에 들어가기 전 촬영자와 룸메이트의 실제 위치를 짧게 연결한다.\u003c/p>\u003cp>공간 전체 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 26mm · 설계값\u003c/p>\u003cp>대사 없음\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S06-BC001.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S06.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 05:42 — 가까운 셀카 얼굴의 크기만 참고하며 폰 이동·누운 나디아는 최신 대본을 따른다.\u003c/p>\u003cp>기존 샷: S06-FC001\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ14 · S06-BC001\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ14/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ14/SEQ14_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ14/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ14/SEQ14_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ14_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ14/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ14/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 14 — S#6. 에필로그: 유튜브 채널 &lt;Trang&#x27;s Soul, Seoul&gt; / 밤\n생성 4초 · 본편 사용 1.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다. 프리비즈 식별색 #E3AC27.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n밤의 같은 기숙사 방. 왼쪽은 트랑의 책상, 오른쪽은 나디아의 침대다. 트랑은 책상 의자에 앉아 세로 폰을 들고 있다. 폰을 든 사람은 트랑 한 명이다. 나디아는 미용 팩과 히잡을 유지하며 오른쪽 자기 침대에 누워 있다. 방과 책상 배치는 @Video1을 따른다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S06-BC001 [0.000–1.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n행동: 책상에 앉은 트랑이 셀카 녹화를 시작한다. 맞은편 침대에는 팩을 하고 누운 나디아가 있다.\n동작·연기 [0.000–1.000초]: 트랑은 자기 책상에 앉아 폰 셀카 녹화를 시작한다. 나디아는 반대쪽 침대에 팩을 하고 누워 있다.\n화면 위치: 트랑 중앙, 나디아 오른쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 3.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 1.000초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S06-BC001.mp4", "poster": "media/previs_v009/S06-BC001.png", "label": "S06-BC001 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 1.0, "framing": "공간 전체", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S06-FC001"], "prompt_group": "SEQ14", "revision": "6d0f7e725cf73b08d6958c6fcfecc86a48272c7cc6d5542c598769c359af3b52"}, {"id": "S06-BC002", "parent": "S06", "kind": "shot", "kindLabel": "샷", "title": "S06-BC002", "summary": "트랑이 셀카로 소개한 뒤 폰을 내려 책상과 방을 지나 나디아를 보여준다. 나디아의 소개를 듣고 폰을 되돌려 V와 끝인사·구독 요청을 한 뒤 녹화를 멈춘다.", "body": "\u003cp>트랑이 셀카로 소개한 뒤 폰을 내려 책상과 방을 지나 나디아를 보여준다. 나디아의 소개를 듣고 폰을 되돌려 V와 끝인사·구독 요청을 한 뒤 녹화를 멈춘다.\u003c/p>\u003cp>구도: 휴대폰 시점을 유지하며 트랑→책상 중심→침대 나디아→트랑으로 이어진다. 출발 중간 팬은 몸통·보조팔을 관통하지 않고 책상 표면이 읽히는 빈 공간을 경유한다. 실제 재샘플에서 확인된 복귀 키는 유지한다.\u003c/p>\u003cp>관계: 셀카 얼굴, 책상과 방을 지나는 팬, 침대 나디아, 셀카 복귀가 하나의 실제 폰 동선으로 이어진다. 폰을 순간이동시키지 않는다.\u003c/p>\u003cp>배치: 셀카 얼굴, 책상과 방을 지나는 팬, 침대 나디아, 셀카 복귀가 하나의 실제 폰 동선으로 이어진다. 폰을 순간이동시키지 않는다.\u003c/p>\u003cp>전환: 이 장면의 관심 이동은 실제 폰의 움직임이 수행하므로 인사 문장마다 편집 컷을 만들지 않는다.\u003c/p>\u003cp>연속 셀카 · 실제 폰 시점 · 행동 시작·종료에 맞춘 팬 또는 이동 · 22mm · 설계값\u003c/p>\u003cp>트랑: 안녕하세요! 저는 트랑이에요. 베트남 사람이에요.\u003c/p>\u003cp>트랑: 학생이에요.\u003c/p>\u003cp>트랑: 나디아! 자기소개. Please introduce yourself!\u003c/p>\u003cp>나디아: 안녕하세요? 저는 나디아예요.\u003c/p>\u003cp>나디아: 인도네시아 사람이에요. 학생이에요! 반가워요.\u003c/p>\u003cp>트랑: Good!\u003c/p>\u003cp>트랑: Good night!\u003c/p>\u003cp>트랑: Like, subscribe, and turn on notifications! please~\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S06-BC002.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S06.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h3>\u003cp>구도, 공간 참조.mp4 · 05:42 — 가까운 셀카 얼굴의 크기만 참고하며 폰 이동·누운 나디아는 최신 대본을 따른다.\u003c/p>\u003cp>기존 샷: S06-FC002\u003c/p>\u003ch3>프롬프트\u003c/h3>\u003cp>SEQ15 · S06-BC002\u003c/p>\u003cp>\u003ca href=\"media/prompts_v004/SEQ15/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>한글 프롬프트 TXT\u003c/a> · \u003ca href=\"media/prompts_v004/SEQ15/SEQ15_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>묶음 동작 프리비즈 MP4\u003c/a>\u003c/p>\u003cp>프리비즈: 구도·동선·카메라·시간 / 인물 이미지: 외형·의상 / 음성: 지정 화자의 음색\u003c/p>\u003cp>캐릭터·음성·프리비즈 준비됨 · 스타트 이미지는 생성 대기.\u003c/p>\u003cul>\u003cli>@image1 · 스타트 프레임 생성 대기 · \u003ca href=\"media/startframes_v001/SEQ15/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt\" download>이미지 생성 프롬프트\u003c/a>\u003c/li>\u003cli>@Video1 · previs_video · \u003ca href=\"media/prompts_v004/SEQ15/SEQ15_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4\" download>SEQ15_동작참조_무음.mp4\u003c/a>\u003c/li>\u003cli>@image2 · TRANG · \u003ca href=\"media/prompts_v004/SEQ15/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · NADIA · \u003ca href=\"media/prompts_v004/SEQ15/image02_NADIA.png\" download>image02_NADIA.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 15 — S#6. 에필로그: 유튜브 채널 &lt;Trang&#x27;s Soul, Seoul&gt; / 밤\n생성 30초 · 본편 사용 29.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다. 프리비즈 식별색 #E3AC27.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n밤의 같은 기숙사 방. 왼쪽은 트랑의 책상, 오른쪽은 나디아의 침대다. 트랑은 책상 의자에 앉아 세로 폰을 들고 있다. 폰을 든 사람은 트랑 한 명이다. 나디아는 미용 팩과 히잡을 유지하며 오른쪽 자기 침대에 누워 있다. 방과 책상 배치는 @Video1을 따른다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n셀카는 트랑이 든 한 대의 폰 시점이다. 나디아가 보이는 동안 트랑의 소개 요청과 Good!은 화면 밖 현장 음성이다. 나디아는 미용 팩과 히잡을 유지한 채 침대에 누워 인사한다. 일어나 앉거나 팩을 떼지 않는다.\n\n컷 S06-BC002 [0.000–29.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 연속 셀카. 실제 폰 시점.\n화면 구성: 셀카 얼굴, 책상과 방을 지나는 팬, 침대 나디아, 셀카 복귀가 하나의 실제 폰 동선으로 이어진다. 폰을 순간이동시키지 않는다.\n카메라 이동: 6.467–6.867초, 6.867–7.467초, 21.333–21.633초, 21.633–21.933초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [7.467초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [21.933초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 셀카로 소개한 뒤 폰을 내려 책상과 방을 지나 나디아를 보여준다. 나디아의 소개를 듣고 폰을 되돌려 V와 끝인사·구독 요청을 한 뒤 녹화를 멈춘다.\n동작·연기 [6.467–7.467초]: 트랑이 폰을 살짝 내려 책상과 방을 지나 나디아의 침대 쪽으로 돌린다.\n동작·연기 [21.333–21.933초]: 트랑이 폰을 자기 쪽으로 돌려 V를 그리며 웃는다.\n동작·연기 [29.200–29.800초]: 트랑이 폰 화면의 정지 버튼을 누른다.\n시작 화면: 트랑 중앙, 나디아 오른쪽.\n중간 화면: 나디아 중앙.\n끝 화면: 트랑 중앙, 나디아 오른쪽.\n발화 S06-L01 [0.060–4.803초] — 트랑 (@Audio1)\n“안녕하세요! 저는 트랑이에요. 베트남 사람이에요.”\n발화 S06-L02 [4.993–6.338초] — 트랑 (@Audio1)\n“학생이에요.”\n발화 S06-L03 [7.527–12.201초] — 트랑 (@Audio1)\n“나디아! 자기소개. Please introduce yourself!”\n트랑의 화면 밖 현장 음성. 화면의 나디아는 이 대사를 립싱크하지 않는다.\n발화 S06-L04 [12.393–15.408초] — 나디아 (@Audio2)\n“안녕하세요? 저는 나디아예요.”\n발화 S06-L05 [15.593–20.030초] — 나디아 (@Audio2)\n“인도네시아 사람이에요. 학생이에요! 반가워요.”\n발화 S06-L06 [20.193–21.227초] — 트랑 (@Audio1)\n“Good!”\n트랑의 화면 밖 현장 음성. 화면의 나디아는 이 대사를 립싱크하지 않는다.\n발화 S06-L07 [21.993–23.175초] — 트랑 (@Audio1)\n“Good night!”\n발화 S06-L08 [23.393–29.057초] — 트랑 (@Audio1)\n“Like, subscribe, and turn on notifications! please~”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 29.800초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S06-BC002.mp4", "poster": "media/previs_v009/S06-BC002.png", "label": "S06-BC002 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 29.8, "framing": "연속 셀카", "angle": "실제 폰 시점", "leaf": true, "source_shot_ids": ["S06-FC002"], "prompt_group": "SEQ15", "revision": "c6e717a17ad547eef0c4ad73dc27045ef3994d91cf9f308a6e433e23b92b4c9e"}, {"id": "S06-BC003", "parent": "S06", "ki e1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 \u003c자기소개하기>는 후반 합성한다.\n시작 컷의 연출: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n끝 컷의 연출: 칠판 앞 트랑의 인사와 자기소개 전문. 옆 김 선생님은 몸을 열어 듣고 트랑은 학생들에게 눈길을 둔다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC001 [0.000–1.800초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스).\n구도·앵글: 교사 쪽에서 본 학생 넷의 사선 마스터. 앉은 눈높이보다 약간 높음.\n화면 구성: 교사 쪽에서 본 학생 넷의 사선 마스터\n관계: 네 학생이 같은 수업을 듣는 공간을 먼저 확인한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n행동: 수업 중인 학생 네 명을 교사 쪽에서 함께 보여준다. 긴 테이블과 좌석 관계가 읽힌다.\n동작·연기 [0.000–1.800초]: 교실의 학생 네 명과 칠판 앞 김 선생님. 칠판에는 \u003c자기소개하기>.\n화면 위치: 트랑 오른쪽, 나디아 오른쪽, 루카스 왼쪽, 아델 왼쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S01-BC002 [1.800–10.267초]\n참조: @Video1, @image2(트랑), @image6(김 선생님).\n구도·앵글: 학생 어깨가 걸린 교사 미디엄. 눈높이 사선.\n화면 구성: 학생 어깨가 걸린 교사 미디엄\n관계: 교사는 학생들을 보고 소개하고 학생은 그 인사를 받는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [1.800초]: 김 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.800초]: 트랑의 눈길은 김 선생님 쪽으로 향한다.\n행동: 김 선생님이 자기소개한다. 가까운 학생의 어깨와 교사의 정면이 같은 공간을 잇는다.\n전환 이유: 발화하는 교사의 얼굴로 관심을 옮긴다.\n화면 위치: 김 선생님 중앙, 트랑 왼쪽.\n발화 S01-L01 [1.860–6.832초] — 김 선생님 (@Audio1)\n“안녕하세요? 저는 김 선생님이에요. 한국 사람이에요.”\n발화 S01-L02 [6.993–10.132초] — 김 선생님 (@Audio1)\n“한국어 선생님이에요. 반가워요.”\n\n컷 S01-BC003 [10.267–17.333초]\n참조: e1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio2 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 \u003c자기소개하기>는 후반 합성한다.\n시작 컷의 연출: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n끝 컷의 연출: 나디아가 호명을 듣고 일어나 칠판 앞으로 나온다. 아델은 돌아가며 트랑은 앉아서 나디아를 따라본다. 나디아의 첫 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC005 [0.000–6.400초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 오른쪽 뒤 사선 교대 와이드. 눈높이.\n화면 구성: 교실 오른쪽 뒤 사선에서 두 통로의 교대를 함께 보는 넓은 구도\n관계: 앞 발표자가 청자로 돌아가고 다음 발표자가 중심이 되는 교대.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 아델의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [3.200초]: 아델의 눈길은 김 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.333초]: 트랑의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 김 선생님의 눈길은 아델 쪽으로 향한다.\n인물 동선 [0.250–6.150초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [3.650–6.400초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 교사가 칭찬하고 아델을 부른다. 트랑이 오른쪽 통로로 돌아가는 동안 아델은 왼쪽 통로에서 칠판 앞으로 온다.\n동작·연기 [0.000–3.200초]: 아델에게 앞으로 나오라는 손짓을 하며\n동작·연기 [3.200–6.400초]: 트랑은 자기 자리로 돌아가고 아델이 반대쪽 통로로 칠판 앞에 나온다.\n시작 화면: 김 선생님 왼쪽, 트랑 왼쪽, 나디아 오른쪽, 루카스 중앙, 아델 오른쪽.\n끝 화면: 김 선생님 왼쪽, 트랑 중앙, 나디아 오른쪽, 루카스 중앙, 아델 왼쪽.\n발화 S01-L07 [0.060–3.083초] — 김 선생님 (@Audio1)\n“좋아요.  다음, 아델 씨?”\n\n컷 S01-BC006 [6.400–14.000초]\n참조: @Video1, @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 아델과 루카스의 깊이 투숏. 앉은 청자와 선 발표자 사이 높이.\n화면 구성: 아델 앞모습과 앞줄 루카스의 듣는 얼굴이 v", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "아델 음색 참조", "filename": "아델_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ03", "shot_ids": ["S01-BC008", "S01-BC009", "S01-BC010", "S01-BC011"], "scene_title": "S01", "text": "시퀀스 03 — S#1. 과기대 국제교류처 한국어 과정 강의실 / 낮\n생성 23초 · 본편 사용 22.200초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 김 선생님(TEACHER_KIM). 한국인 여성 한국어 교사, 163cm. 시트의 얼굴, 검은 단발, 얇은 금속테 안경, 크림 블라우스와 회색 카디건, 베이지 바지, 검은 로퍼, 남색 사원증 목걸이 고정. 칠판 앞에서 학생을 차례로 부른다. 프리비즈 식별색 #566B83.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 김 선생님 전용 음색. 따뜻하고 명료한 한국어 원어민 여성. 학생을 안내하는 자연스러운 교사 말투. 교재 녹음처럼 음절마다 끊지 않는다.\n@Audio3 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 서울과학기술대학교 한국어 강의실. 목재 테이블과 학생 의자, 창가 벽과 블라인드, 앞쪽 화이트보드. 발표 구역과 청자 좌석, 비어 있는 통로는 @Video1을 따른다. 자기소개는 원문대로 칠판 앞에 서서 한다. 칠판의 \u003c자기소개하기>는 후반 합성한다.\n시작 컷의 연출: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인사를 받는 시선을 같은 화면에 둔다.\n끝 컷의 연출: 김 선생님의 아주 잘했어요를 교실 관계 구도에서 받는다. 학생들은 마지막 칭찬을 듣고 시선을 교사에게 모은다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S01-BC008 [0.000–6.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(김 선생님).\n구도·앵글: 나디아와 트랑의 낮은 사선 투숏. 앉은 트랑 눈높이에서 약간 올려봄.\n화면 구성: 왼쪽 나디아와 오른쪽 트랑의 3/4 얼굴을 잇는 높이 차 투숏\n관계: 처음 만난 학생 사이의 작은 응답을 앞뒤 깊이와 높이 차이로 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아의 자기소개 전문. 전경에 앉은 트랑과 중경의 나디아가 서로 인 n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio5 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n끝 컷의 연출: 302호 호명 뒤 아델이 미오에게 다가가 인사한다. 미오가 받아주는 동안 접근으로 좁아진 둘의 거리를 유지한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC001 [0.000–1.200초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(미오), @image7(장홍), @image8(정 선생님).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 교사·장부는 좌측 후경, 학생 세 쌍은 깊이를 달리한 로비 사선 전체.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 정 선생님의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 트랑의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 미오의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 정 선생님 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 정 선생님 쪽으로 향한다.\n행동: 정 선생님과 배정을 기다리는 여섯 학생의 위치를 한 번에 설정한다.\n동작·연기 [0.000–1.200초]: 로비의 정 선생님과 배정을 기다리는 학생들. 장부를 든 선생님에게 시선이 모인다.\n화면 위치: 아델 왼쪽, 미오 중앙, 루카스 오른쪽, 장홍 오른쪽, 트랑 왼쪽, 나디아 왼쪽, 정 선생님 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 미오(MIO). 일본 여성, 162cm. 시트의 짧은 짙은 갈색 단발과 앞머리, 작은 귀걸이, 연보라 카디건과 흰 이너, 진청 와이드 바지, 흰 신발 고정. 안경 없음. 아델에게 인사하는 수줍은 신입생. 프리비즈 식별색 #C86B9E.\n@image7 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n@image8 = 정 선생님(TEACHER_JEONG). 한국인 남성 생활관 담당 교사, 175cm. 시트의 얼굴과 단정한 검은 머리, 연한 파란 셔츠, 남색 넥타이와 사원증, 베이지 바지, 갈색 구두 고정. 로비에서 장부를 보며 방을 배정한다. 프리비즈 식별색 #4A9C71.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio2 = 미오 전용 음색. 맑고 조심스러운 여성 음색. 일본어 억양이 남은 한국어 초보자. 음절 간격이 비교적 고르고 자음 연결을 신중하게 한다. 소극적인 인사지만 들릴 만큼 명료하게.\n@Audio3 = 정 선생님 전용 음색. 차분하고 명료한 한국어 원어민 남성. 호명과 방 번호를 알아듣기 쉽게 말하되 안내 사이의 공백은 짧게. 영어 안내도 같은 사람의 목소리.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n끝 컷의 연출: 401호 호명에 루카스가 먼저 손을 흔들고 장홍에게 다가간다. 장홍은 어색하게 인사를 받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC005 [0.000–6.867초]\n참조: @Video1, @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 아델의 낮은 어깨와 측면을 전경에 두고 미오의 3/4 얼굴을 크게 담는다. 짧은 문답마다 카메라를 되돌리지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 미오의 눈길은 아델 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 미오 쪽으로 향한다.\n행동: 아델이 국적과 직업을 묻고 미오가 일본 사람이며 학생이라고 답한다.\n화면 위치: 아델 오른쪽, 미오 중앙, 나디아 오른쪽.\n발화 S02-L09 [0.060–1.820초] — 아델 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L10 [1.993–3.600초] — 미오 (@Audio2)\n“일본 사람이에요.”\n발화 S02-L11 [3.793–5.196초] — 아델 (@Audio1)\n“직업이 뭐예요?”\n발화 S02-L12 [5.393–6.738초] — 미오 (@Audio2)\n“학생이에요.”\n\n컷 S02-BC006 [6.867–11.267초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image6(미오).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 중앙에 가까운 낮은 눈높이 투숏. 질문자와 답변자 구도를 벗어나 비슷한 화면 크기의 두 사람이 서로 받아주는 모습을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.867초]: 아델의 눈길은 미오 쪽으로 향한다.\n시선 연결 [6.867초]: 미오의 눈길은 아델 쪽으로 향한다.\n행동: 아델이 모델이라고 소개하고 두 사람이 반갑다고 인사를 나눈다.\n전환 이유: 미오의 신상 답변에서 아델의 새로운 직업 정보와 상호 인사로 관심이 넓어진다.\n화면 위치: 아델 오른쪽, 미오 왼쪽, 트랑 중앙, 나디아 왼쪽.\n발화 S02-L13 [6.927–9.761초] — 아델 (@Audio1)\n“저는 모델이에요. 반가워요.”\n발화 S02-L14 [9.927–11.156초] — 과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image5 = 장홍(ZHANGHONG). 중국 남성, 176cm. 시트의 짙은 짧은 머리, 얇은 원형 안경, 올리브색 후드집업과 흰 이너, 짙은 청바지, 회색 운동화 고정. 원문에서도 안경 쓴 모범생으로 지정되어 있다. 루카스의 포옹에 당황하되 과장된 공포 연기는 하지 않는다. 프리비즈 식별색 #B46D2C.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 장홍 전용 음색. 차분하고 약간 수줍은 남성 음색. 중국어 억양이 남은 한국어 초보자. 음절 높낮이가 조금 분리되지만 원문 단어는 전부 알아들을 수 있게 발음.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 생활관 로비. 정 선생님은 장부를 든 안내 위치에 있다. 방 배정은 301호 트랑·나디아, 302호 아델·미오, 401호 루카스·장홍이다. 현재 학생들의 간격과 빈 이동 통로는 @Video1을 따른다. 새 열쇠 배부나 추가 안내를 만들지 않는다.\n시작 컷의 연출: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n끝 컷의 연출: 루카스가 학생이라고 답하며 악수를 청한다. 장홍이 손을 내밀자 루카스가 더 다가가 포옹하고 룸메이트라고 외친다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S02-BC008 [0.000–6.533초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 열린 몸과 옆얼굴이 보이는 상반신 투숏. 몸은 정면 쪽으로 열고 머리만 상대를 향한다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [0.000초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 이름을 말하고 장홍에게 묻는다. 장홍이 자기 이름을 말할 때도 둘의 반응을 함께 둔다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽.\n발화 S02-L16 [0.060–4.501초] — 루카스 (@Audio1)\n“안녕하세요? 저는 루카스예요. 이름이 뭐예요?”\n발화 S02-L17 [4.727–6.411초] — 장홍 (@Audio2)\n“저는 장홍이에요.”\n\n컷 S02-BC009 [6.533–10.600초]\n참조: @Video1, @image4(루카스), @image5(장홍).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 루카스 어깨 너머 장홍의 정면에 가까운 얼굴. 질문과 답을 분절하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.533초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n행동: 루카스의 국적 질문을 듣고 장홍이 중국 사람이라고 답한다.\n전환 이유: 이름을 겨우 받아준 장홍이 자신의 정보를 더 말하는 순간에 응답 얼굴을 선택한다.\n화면 위치: 루카스 오른쪽, 장홍 중앙.\n발화 S02-L18 [6.593–8.353초] — 루카스 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S02-L19 [8.527–10.443초] — 장홍 (@Audio2)\n“저는 중국 사람이에요.”\n\n컷 S02-BC010 [10.600–17.400초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(루카스), @image5(장홍).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스 쪽에 무게를 둔 사선 투숏. 장홍의 되묻는 시선과 루카스의 수신을 같은 프레임에서 이어간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [10.600초]: 루카스의 눈길은 장홍 쪽으로 향한다.\n시선 연결 [10.600초]: 장홍의 눈길은 루카스 쪽으로 향한다.\n행동: 루카스가 브라질 사람임을 말하고 직업을 묻는다. 장홍은 학생이라고 답한 뒤 처음으로 되묻는다.\n전환 이유: 일방적으로 질문받던 장홍이 질문자로 바뀌므로 두 사람이 함께 읽히는 관계 구도로 돌아온다.\n화면 위치: 루카스 오른쪽, 장홍 왼쪽, 트랑 오른쪽, 나디아 오른쪽.\n발화 S02-L20 [10.660–14.030초] — 루카스 (@Audio1)\n“저는 브라질 사람이에요. 직업이 뭐예요?”\n발화 S02-L2  시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n끝 컷의 연출: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC001 [0.000–7.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n동작·연기 [0.000–1.333초]: 왼쪽 침대의 트랑은 영상 통화 중. 오른쪽 책상의 나디아는 노트북으로 숙제한다.\n동작·연기 [1.333–3.800초]: 스마트폰 화면을 보며 밝게\n동작·연기 [3.800–5.133초]: 엄마에게 영상 통화로 방을 보여주면서\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L01 [1.393–3.664초] — 트랑 (@Audio1)\n“엄마! 트랑이에요.”\n발화 S03-L02 [3.860–5.006초] — 트랑 (@Audio1)\n“my room!”\n발화 S03-L03 [5.193–6.873초] — 트랑 (@Audio1)\n“저는 학생이에요!”\n\n컷 S03-BC002 [7.000–11.867초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\n동작·연기 [7.000–11.867초]: 엄지척하며\n전환 이유: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L04 [7.060–11.710초] — 엄마 (@Audio2)\n“우리 딸,  최고예요! 학교는 어때요? 좋아요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC003 [11.867–16.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.867초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [15.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [11.867초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 트랑이 학교가 좋다고 답한다. 엄마가 룸메이트 이름을 묻자 트랑의 눈길이 책상 쪽 나디아에게 향한다.\n전환 이유: 질문의 대상이 방에 있는 다른 사람으로 바뀌므로 그 사람이 실제로 있는 깊이를 다시 보여준다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L05 [11.927–12.960초] — 트랑 (@Audio1)\n“Good!”\n발화 S03-L06 [13.127–14.882초] — 엄마 (@Audio2)\n“Roommate 이름이 뭐예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L07 [15.060–16.317초] — 트랑 (@Audio1)\n“나디아예요.”\n\n컷 S03-BC004 [16.467–18.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작 ": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "엄마 음색 참조", "filename": "트랑 엄마_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ08", "shot_ids": ["S03-BC005", "S03-BC006", "S03-BC007"], "scene_title": "S03", "text": "시퀀스 08 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁\n생성 22초 · 본편 사용 22.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n끝 컷의 연출: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC005 [0.000–5.800초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L09 [0.060–3.125초] — 엄마 (@Audio1)\n“반가워요! 저는 트랑 엄마예요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L10 [3.327–5.638초] — 엄마 (@Audio1)\n“나디아는 어느 나라 사람이에요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC006 [5.800–14.467초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.800초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [5.800초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.\n전환 이유: 나디아가 인사만 하던 룸메이트에서 직접 질문하는 통화 참여자로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L11 [5.860–8.767초] — 나디아 (@Audio2)\n“저는... 인도네시아 사람이에요.”\n발화 S03-L12 [8.993–11.078초] — 엄마 (@Audio1)\n“아~ 인도네시아 사람이군요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L13 [11.260–14.343초] — 나디아 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S03-BC007 [14.467–22.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 병원 배경·가운·청진기가 남는 폰 화면. 문단별로 같은 인서트를 쪼개지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n전환 이유: 직업 답변에서 개인적인 취향으로 말투와 자세가 달라지는 발화 흐름을 유지한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L14 [14.527–16.050초] — 엄마 (@Audio1)\n“저는 의사예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L15 [16.260–18.483초] — 엄마 (@Audio1)\n“저는 한국 드라마 좋아해요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L16 [18.660–21.849초] — 엄마 (@Audio1)\n“현빈 팬이에요. 현빈은 배우예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 22.000초까지 사용한다.\n", "generation_seconds": 22, "text_url": "media/prompts_v004/SEQ08/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "video_url": "media/prompts_v004/SEQ08/SEQ08_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S03-BC005", "filename": "SEQ08_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@Video1", "kind": "프리비즈 영상", "label": "구도·동선·시간 참조 (무음)", "filename": "SEQ08_동작참조_무음.mp4", "url": "media/prompts_v004/SEQ08/SEQ08_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "status": "ready"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ08/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ08/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "엄마 캐릭터시트", "filename": "image03_MOTHER.png", "url": "media/prompts_v004/SEQ08/image03_MOTHER.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "엄마 음색 참조", "filename": "트랑 엄마_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ09", "shot_ids": ["S03-BC008", "S03-BC009", "S03-BC010", "S03-BC011", "S03-BC012"], "scene_title": "S03", "text": "시퀀스 09 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다. 프리비즈 식별색 #B2A5DF.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n참조: @Video1, @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n참조: @Video1, @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 그쪽을 보고 엄마에게 피곤하다고 말한다.\n동작·연기 [7.000–9.400초]: 인상 찌푸리면서\n동작·연기 [9.400–10.133초]: 나디아가 책상 의자에서 하품을 참으며 입을 가린다. 트랑이 이를 본다.\n전환 이유: 개인 취향의 반응에서 룸메이트의 피곤함을 알아차리는 관계 변화로 넓힌다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L20 [7.060–9.285초] — 트랑 (@Audio2)\n“아니요! 배우예요!”\n발화 S03-L21 [10.193–12.660초] — 트랑 (@Audio2)\n“엄마... We're tired.”\n\n컷 S03-BC011 [12.800–15.133초]\n참조: @Vi generation"}, {"tag": "@Video1", "kind": "프리비즈 영상", "label": "구도·동선·시간 참조 (무음)", "filename": "SEQ09_동작참조_무음.mp4", "url": "media/prompts_v004/SEQ09/SEQ09_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "status": "ready"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ09/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ09/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "엄마 캐릭터시트", "filename": "image03_MOTHER.png", "url": "media/prompts_v004/SEQ09/image03_MOTHER.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "엄마 음색 참조", "filename": "트랑 엄마_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ10", "shot_ids": ["S04-BC001", "S04-BC002", "S04-BC003", "S04-BC004", "S04-BC005", "S04-BC006"], "scene_title": "S04", "text": "시퀀스 10 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 29초 · 본편 사용 28.267초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3  대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n끝 컷의 연출: 시우가 함께 가자고 하고 트랑이 기뻐하며 답한다. 대사가 끝나면 나란히 도서관 쪽으로 걸어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC007 [0.000–11.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏.\n관계: 트랑의 3/4 얼굴을 앞세우고 시우의 듣는 측면을 함께 둔다. 이전 시우 중심 사선과 실제 위치·가림을 바꾼다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 국적과 학생인지 묻고 트랑이 답한다. voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}]}, {"id": "SEQ12", "shot_ids": ["S05-BC001", "S05-BC002", "S05-BC003", "S05-BC004", "S05-BC005", "S05-BC006", "S05-BC007", "S05-BC008"], "scene_title": "S05", "text": "시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC001 [0.000–3.867초]\n참조: @Video1 eady"}, {"tag": "@Audio5", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}]}, {"id": "SEQ13", "shot_ids": ["S05-BC009", "S05-BC010", "S05-BC011", "S05-BC012", "S05-BC013", "S05-BC014", "S05-BC015"], "scene_title": "S05", "text": "시퀀스 13 — S#5. 과기대 도서관 1층 / D\n생성 27초 · 본편 사용 26.467초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n참조: @Video1, @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 2.wav", "url": "media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav", "status": "ready"}]}, {"id": "SEQ14", "shot_ids": ["S06-BC001"], "scene_title": "S06", "text": "시퀀스 14 — S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤\n생성 4초 · 본편 사용 1.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다. 프리비즈 식별색 #E3AC27.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n밤의 같은 기숙사 방. 왼쪽은 트랑의 책상, 오른쪽은 나디아의 침대다. 트랑은 책상 의자에 앉아 세로 폰을 들고 있다. 폰을 든 사람은 트랑 한 명이다. 나디아는 미용 팩과 히잡을 유지하며 오른쪽 자기 침대에 누워 있다. 방과 책상 배치는 @Video1을 따른다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S06-BC001 [0.000–1.000초]\n참조: @Video1, @image2(트랑), @image3(나디아).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n행동: 책상에 앉은 트랑이 셀카 녹화를 시작한다. 맞은편 침대에는 팩을 하고 누운 나디아가 있다.\n동작·연기 [0.000–1.000초]: 트랑은 자기 책상에 앉아 폰 셀카 녹화를 시작한다. 나디아는 반대쪽 침대에 팩을 하고 누워 있다.\n화면 위치: 트랑 중앙, 나디아 오른쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 3.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 1.000초까지 사용한다.\n", "generation_seconds": 4, "text_url": "media/prompts_v004/SEQ14/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "video_url": "media/prompts_v004/SEQ14/SEQ14_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S06-BC001", "filename": "SEQ14_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@Video1", "kind": "프리비즈 영상", "label": "구도·동선·시간 참조 (무음)", "filename": "SEQ14_동작참조_무음.mp4", "url": "media/prompts_v004/SEQ14/SEQ14_%EB%8F%99%EC%9E%91%EC%B0%B8%EC%A1%B0_%EB%AC%B4%EC%9D%8C.mp4", "status": "ready"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filenam
