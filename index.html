8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 10 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 29초 · 본편 사용 28.267초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 0.000–3.000초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [1.300초]: 트랑의 눈길은 프리비즈에 표시된 공간 지점 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n인물 동선 [1.700–3.000초]: 시우의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n동작·연기 [0.000–1.200초]: 길을 헤매는 트랑. 프레임 깊이에 붕어방 연못 벤치의 시우가 보인다.\n동작·연기 [1.200–3.000초]: 벤치의 시우가 트랑을 보고 일어나 책을 든 채 성큼성큼 다가간다.\n시작 화면: 트랑 왼쪽, 시우 오른쪽.\n끝 화면: 트랑 왼쪽, 시우 중앙.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n컷 S04-BC002 [3.000–6.733초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 눈높이보다 조금 낮은 사선 투숏. 키 차이와 책이 보이고 시우를 올려다보는 트랑의 방향이 명료하다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [3.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [3.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 걸음을 멈추고 도움이 필요한지 묻는다. 트랑은 고개를 들어 시우를 본다.\n동작·연기 [3.000–6.733초]: 친절하게\n전환 이유: 접근이 끝나고 처음 대면하는 순간을 두 사람의 같은 화면으로 잡는다.\n화면 위치: 트랑 왼쪽, 시우 오른쪽.\n발화 S04-L01 [3.060–6.586초] — 시우 (@Audio1)\n“제가 좀 도와드릴까요? May I help you?”\n\n컷 S04-BC003 [6.733–9.400초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 키 큰 시우 어깨를 전경에 남기는 트랑 가까운 역숏. 과장된 하이앵글 대신 실제 키 차이만 반영.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [6.7 ·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.733초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 28.267초까지 사용한다.\n\u003c/code>\u003c/pre>", "media": {"kind": "video", "url": "media/previs_v009/S04-BC006.mp4", "poster": "media/previs_v009/S04-BC006.png", "label": "S04-BC006 움직이는 프리비즈"}, "decision": "proposed", "decisionLabel": "검토 대기", "production": "동작 프리비즈 완료", "approval": null, "duration": 4.67, "framing": "관계 투숏", "angle": "관계에 따른 사선·높이·깊이 배치", "leaf": true, "source_shot_ids": ["S04-FC011"], "prompt_group": "SEQ10", "revision": "d64ceb3a0b06fb8e7c5e81466b243acebe9b8fa9eed461f45092a6c14619aa57"}, {"id": "S04-BC007", "parent": "S04", "kind": "shot", "kindLabel": "샷", "title": "S04-BC007", "summary": "시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.", "body": "\u003cp>시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\u003c/p>\u003cp>구도: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏.\u003c/p>\u003cp>관계: 트랑의 3/4 얼굴을 앞세우고 시우의 듣는 측면을 함께 둔다. 이전 시우 중심 사선과 실제 위치·가림을 바꾼다.\u003c/p>\u003cp>배치: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏.\u003c/p>\u003cp>전환: 이번에는 트랑이 자신의 정보를 전하는 쪽이 되어 화면의 무게를 옮긴다.\u003c/p>\u003cp>관계 투숏 · 관계에 따른 사선·높이·깊이 배치 · 고정 · 42mm · 설계값\u003c/p>\u003cp>시우: 어느 나라 사람이에요?\u003c/p>\u003cp>트랑: 베트남 사람이에요.\u003c/p>\u003cp>시우: 아~ 베트남 사람이군요! 반가워요.\u003c/p>\u003cp>시우: 학생이에요?\u003c/p>\u003cp>트랑: 네, 학생이에요.\u003c/p>\u003ch3>프리비즈\u003c/h3>\u003cp>\u003ca href=\"media/previs_v009/S04-BC007.mp4\" download>샷 MP4\u003c/a> · \u003ca href=\"media/previs_v009/S04.mp4\">씬 전체\u003c/a> · \u003ca href=\"media/previs_v009/1%ED%99%94_%EC%A0%84%EC%B2%B4_%EC%9B%80%EC%A7%81%EC%9D%B4%EB%8A%94%ED%94%84%EB%A6%AC%EB%B9%84%EC%A6%88_v009.mp4\">1화 전체\u003c/a>\u003c/p>\u003cp>동작 프리비즈 · 음성은 임시 타이밍 가이드.\u003c/p>\u003ch3>참조\u003c/h 과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n끝 컷의 연출: 시우가 함께 가자고 하고 트랑이 기뻐하며 답한다. 대사가 끝나면 나란히 도서관 쪽으로 걸어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않 u003c/li>\u003cli>@image3 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ11/image02_SIWOO.png\" download>image02_SIWOO.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 11 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 28초 · 본편 사용 27.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n끝 컷의 연출: 시우가 함께 가자고 하고 트랑이 기뻐하며 답한다. 대사가 끝나면 나란히 도서관 쪽으로 걸어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC007 [0.000–11.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏.\n관계: 트랑의 3/4 얼굴을 앞세우고 시우의 듣는 측면을 함께 둔다. 이전 시우 중심 사선과 실제 위치·가림을 바꾼다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n화면 위치: 트랑 왼쪽, 시우 오른쪽.\n발화 S04-L11 [0.060–1.820초] — 시우 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S04-L12 [1.993–3.721초] — 트랑 (@Audio2)\n“베트남 사람이에요.”\n발화 S04-L13 [3.927–7.110초] — 시우 (@Audio1)\n“아~ 베트남 사람이군요! 반가워요.”\n발화 S04-L14 [7.327–8.672초] — 시우 (@Audio1)\n“학생이에요?”\n발화 S04-L15 [8.860–10.862초] — 트랑 (@Audio2)\n“네, 학생이에요.”\n\n컷 S04-BC008 [11.000–13.067초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 시우 어깨 너머 트랑 얼굴. 물음표는 발화하지 않으며 표정과 짧은 정지로 전달.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [11  컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n끝 컷의 연출: 시우가 함께 가자고 하고 트랑이 기뻐하며 답한다. 대사가 끝나면 나란히 도서관 쪽으로 걸어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에  · TRANG · \u003ca href=\"media/prompts_v004/SEQ11/image01_TRANG.png\" download>image01_TRANG.png\u003c/a>\u003c/li>\u003cli>@image3 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ11/image02_SIWOO.png\" download>image02_SIWOO.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 11 — S#4. 서울과학기술대학교 붕어방 연못 근처 / 낮\n생성 28초 · 본편 사용 27.533초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 @Video1을 따른다.\n시작 컷의 연출: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n끝 컷의 연출: 시우가 함께 가자고 하고 트랑이 기뻐하며 답한다. 대사가 끝나면 나란히 도서관 쪽으로 걸어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC007 [0.000–11.000초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏.\n관계: 트랑의 3/4 얼굴을 앞세우고 시우의 듣는 측면을 함께 둔다. 이전 시우 중심 사선과 실제 위치·가림을 바꾼다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n화면 위치: 트랑 왼쪽, 시우 오른쪽.\n발화 S04-L11 [0.060–1.820초] — 시우 (@Audio1)\n“어느 나라 사람이에요?”\n발화 S04-L12 [1.993–3.721초] — 트랑 (@Audio2)\n“베트남 사람이에요.”\n발화 S04-L13 [3.927–7.110초] — 시우 (@Audio1)\n“아~ 베트남 사람이군요! 반가워요.”\n발화 S04-L14 [7.327–8.672초] — 시우 (@Audio1)\n“학생이에요?”\n발화 S04-L15 [8.860–10.862초] — 트랑 (@Audio2)\n“네, 학생이에요.”\n\n컷 S04-BC008 [11.000–13.067초]\n참조: @Video1, @image2(트랑), @image3(시우).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 시우 어깨 너머 트랑 얼굴. >image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ12/image05_SIWOO.png\" download>image05_SIWOO.png\u003c/a>\u003c/li>\u003cli>@image7 · JUNYOUNG · \u003ca href=\"media/prompts_v004/SEQ12/image06_JUNYOUNG.png\" download>image06_JUNYOUNG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화 %EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응 .wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC001 [0.000–3.867초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(시우), @image7(준영).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 접근과 친구 셋의 합류가 양쪽에서 만나는 사선 전체. 루카스는 첫 프레임부터 자리를 갖는다.\n카메라 이동: 0.000–2.60 의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC001 [0.000–3.867초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(시우), @image7(준영).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 접근과 친구 셋의 합류가 양쪽에서 만나는 사선 전체. 루카스는 첫 프레임부터 자리를 갖는다.\n카메라 이동: 0.000–2.600초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n인물 동선 [0.000–2.600초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [0.000–2.600초]: 시우의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동 n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC001 [0.000–3.867초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(시우), @image7(준영).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 접근과 친구 셋의 합류가 양쪽에서 만나는 사선 전체. 루카스는 첫 프레임부터 자리를 갖는다.\n카메라 이동: 0.000–2.600초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n인물 동선 [0.000–2.600초]: 트랑의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [0.000–2.600초]: 시우의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [0.000–2.600초]: 아델의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [0.000–2.600초]: 나디아의 이동 경로·속도·방향은 @Video1을 따른다.\n인물 동선 [0.000–2.600초]: 루카스의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n동작·연기 [0.000–2.600초]: 트랑과 시우가 함께 도서관 앞에 도착한다. 먼저 와 있던 나디아·아델·루카스가 그들을 보고 모여든다.\n동작·연기 [2.600–3.867초]: 트랑을 향해 시우를 쳐다보며 궁금해한다\n시작 화면: 트랑 왼쪽, 시우 왼쪽, 아델 중앙, 나디아 중앙, 루카스 오른쪽, 준영 오른쪽.\n중간 화면: 트랑 왼쪽, 시우 중앙, 아델 오른쪽, 나디아 중앙, 루카스 오른쪽, 준영 오른쪽.\n발화 S05-L01 [2.660–3.716초] — 나디아 (@Au mage05_SIWOO.png\" download>image05_SIWOO.png\u003c/a>\u003c/li>\u003cli>@image7 · JUNYOUNG · \u003ca href=\"media/prompts_v004/SEQ12/image06_JUNYOUNG.png\" download>image06_JUNYOUNG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 i>@Audio2 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 트랑 · \u003ca href=\"media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 /voices/v2/%ED%8A%B8%EB%9E%91_v2.wav\" download>트랑_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC001 [0.000–3.867초]\n참조: @Video1, @image2(트랑), @image3(나디아), @image4(아델), @image5(루카스), @image6(시우), @image7(준영).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 두 사람의 접근과 친구 셋의 합류가 양쪽에서 만나는 사선 전체. 루카스는 첫 프레임부터 자리를 갖는다.\n카메라 이동: 0.000–2.600초. 움직임의 방향과 도착 구도는 @Video1을 따른다.\n시선 연결 [0.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [ 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n참조: @Video1, @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 관계 그룹숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [0.000–1.600초]: 루카스의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n동작·연기 [0.000–1.600초]: 불쑥 끼어들면서\n시작 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 오른쪽.\n중간 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 왼쪽.\n발화 S05-L14 [0.060–1.450초] — 루카스 (@Audio1)\ g\u003c/a>\u003c/li>\u003cli>@image4 · ADELE · \u003ca href=\"media/prompts_v004/SEQ13/image03_ADELE.png\" download>image03_ADELE.png\u003c/a>\u003c/li>\u003cli>@image5 · LUCAS · \u003ca href=\"media/prompts_v004/SEQ13/image04_LUCAS.png\" download>image04_LUCAS.png\u003c/a>\u003c/li>\u003cli>@image6 · SIWOO · \u003ca href=\"media/prompts_v004/SEQ13/image05_SIWOO.png\" download>image05_SIWOO.png\u003c/a>\u003c/li>\u003cli>@image7 · JUNYOUNG · \u003ca href=\"media/prompts_v004/SEQ13/image06_JUNYOUNG.png\" download>image06_JUNYOUNG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 준영 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%A4%80%EC%98%81_v2.wav\" download>준영_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 13 — S#5. 과기대 도서관 1층 / D\n생성 27초 · 본편 사용 26.467초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n참조: @Video1, @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 관계 그룹숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [0.000–1.600초]: 루카스의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n동작·연기 [0.000–1.600초]: 불쑥 끼어들면서\n시작 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 오른쪽.\n중간 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 왼쪽.\n발화 S05-L14 [0.060–1.450초] — 루카스 (@Audio1)\n“안녕하세요?”\n발화 S05-L15 [1.660–5.015초] — 루카스 (@Audio1)\n“저는 루카스예요! 브라질 사람이에요.”\n\n컷 S05-BC010 [5.133–8.067초]\n참조: @Video1, @image2(트랑), @image4(아델), @image6(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 시우와 트랑의 얼굴이 동시에 오른쪽의 나디아를 향하는 투숏. 문장보다 눈길의 대상이 다음 전환을 만든다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.133초]: 시우의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [5.133초]: 트랑의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 시우가 루카스의 인사를 받고 나디아를 바라보며 이름을 묻는다. 트랑 media/prompts_v004/SEQ13/image05_SIWOO.png\" download>image05_SIWOO.png\u003c/a>\u003c/li>\u003cli>@image7 · JUNYOUNG · \u003ca href=\"media/prompts_v004/SEQ13/image06_JUNYOUNG.png\" download>image06_JUNYOUNG.png\u003c/a>\u003c/li>\u003c/ul>\u003cp>음성 참조 WAV · 다운로드 후 해당 화자의 음색으로 첨부\u003c/p>\u003cul>\u003cli>@Audio1 · 루카스 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav\" download>루카스_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio2 · 시우 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 준영 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%A4%80%EC%98%81_v2.wav\" download>준영_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 13 — S#5. 과기대 도서관 1층 / D\n생성 27초 · 본편 사용 26.467초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 mpts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav\" download>시우_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio3 · 나디아 · \u003ca href=\"media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav\" download>나디아_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio4 · 준영 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%A4%80%EC%98%81_v2.wav\" download>준영_v2.wav\u003c/a>\u003c/li>\u003cli>@Audio5 · 아델 · \u003ca href=\"media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav\" download>아델_v2.wav\u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 13 — S#5. 과기대 도서관 1층 / D\n생성 27초 · 본편 사용 26.467초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상 u003c/a>\u003c/li>\u003c/ul>\u003cpre>\u003ccode>시퀀스 13 — S#5. 과기대 도서관 1층 / D\n생성 27초 · 본편 사용 26.467초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 @Video1의 컷 순서·카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n참조: @Video1, @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 관계 그룹숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [0.000–1.600초]: 는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n@Video1 = 이 시퀀스의 완성된 움직이는 프리비즈. 컷 순서·길이, 인물의 좌우·앞뒤 거리·높이·가림, 몸과 머리의 방향, 소품 소유자, 카메라 움직임과 인물 동선을 따른다.\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n참조: @Video1, @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 관계 그룹숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [0.000–1.600초]: 루카스의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n동작·연기 [0.000–1.600초]: 불쑥 끼어들면서\n시작 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 오른쪽.\n중간 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 왼쪽.\n발화 S05-L14 [0.060–1.450초] — 루카스 (@Audio1)\n“안녕하세요?”\n발화 S05-L15 [1.660–5.015초] — 루카스 (@Audio1)\n“저는 루카스예요! 브라질 사람이에요.”\n\n컷 S05-BC010 [5.133–8.067초]\n참조: @Video1 의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 참조와 식별색\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음. 프리비즈 식별색 #3475CB.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. 프리비즈 식별색 #E3AC27.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음. 프리비즈 식별색 #9762C6.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게. 프리비즈 식별색 #6DCBD0.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다. 프리비즈 식별색 #DDD5BD.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다. 프리비즈 식별색 #A63859.\n같은 고유색의 전신 블록·구형 머리·보조 손 블록은 모두 한 인물이다. 몸과 머리의 초록 앞면·빨강 뒷면 패치는 방향 표식이다. 머리와 몸 방향이 다르면 몸 자세를 유지하며 눈과 고개만 해당 상대에게 돌린다. 식별색·패치를 피부·의상·머리 장식으로 복제하지 않는다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 @Video1을 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 @Video1을 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n참조: @Video1, @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 관계 그룹숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [0.000–1.600초]: 루카스의 이동 경로·속도·방향은 @Video1을 따른다.\n행동: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n동작·연기 [0.000–1.600초]: 불쑥 끼어들면서\n시작 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 오른쪽.\n중간 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 왼쪽.\n발화 S05-L14 [0.060–1.450초] — 루카스 (@Audio1)\n“안녕하세요?”\n발화 S05-L15 [1.660–5.015초] — 루카스 (@Audio1)\n“저는 루카스예요! 브라질 사람이에요.”\n\n컷 S05-BC010 [5.133–8.067초]\n참조: @Video1, @image2(트랑), @image4(아델), @image6(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 시우와 트랑의 얼굴이 동시에 오른쪽의 나디아를 향하는 투숏. 문장보다 눈길의 대상이 다음 전환을 만든다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.133초]: 시우의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [5.133초]: 트랑의 눈
