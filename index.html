 "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ06/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ06/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "루카스 캐릭터시트", "filename": "image03_LUCAS.png", "url": "media/prompts_v004/SEQ06/image03_LUCAS.png", "status": "ready"}, {"tag": "@image5", "kind": "이미지", "label": "장홍 캐릭터시트", "filename": "image04_ZHANGHONG.png", "url": "media/prompts_v004/SEQ06/image04_ZHANGHONG.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "루카스 음색 참조", "filename": "루카스_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "장홍 음색 참조", "filename": "장홍_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%9E%A5%ED%99%8D_v2.wav", "status": "ready"}]}, {"id": "SEQ07", "scene_title": "S#3. 생활관, 트랑 & 나디아의 방 / 저녁", "shot_ids": ["S03-BC001", "S03-BC002", "S03-BC003", "S03-BC004"], "text": "시퀀스 07 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁\n생성 19초 · 본편 사용 18.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n끝 컷의 연출: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC001 [0.000–7.000초]\n공간 배치: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏..\n렌즈와 높이: 31mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 좌측 가까운 면, 나디아는 우측 책상 깊이에 둔다. 두 가구와 폰이 읽히는 사선 깊이 투숏.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 침대의 트랑이 엄마에게 인사하고 폰으로 방을 보여준다. 책상의 나디아는 노트북 숙제를 계속한다.\n동작·연기 [0.000–1.333초]: 왼쪽 침대의 트랑은 영상 통화 중. 오른쪽 책상의 나디아는 노트북으로 숙제한다.\n동작·연기 [1.333–3.800초]: 스마트폰 화면을 보며 밝게\n동작·연기 [3.800–5.133초]: 엄마에게 영상 통화로 방을 보여주면서\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L01 [1.393–3.664초] — 트랑 (@Audio1)\n“엄마! 트랑이에요.”\n발화 S03-L02 [3.860–5.006초] — 트랑 (@Audio1)\n“my room!”\n발화 S03-L03 [5.193–6.873초] — 트랑 (@Audio1)\n“저는 학생이에요!”\n\n컷 S03-BC002 [7.000–11.867초]\n공간 배치: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다..\n렌즈와 높이: 43mm 상당의 화각, 스마트폰 화면 정면.\n첫 화면 인물: 스마트폰 화면 속 엄마와 폰을 잡은 손.\n참조: @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 손가락과 폰 테두리가 남는 화면 인서트. 엄마를 기숙사에 실물로 배치하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 병원 진료실에서 가운과 청진기를 착용한 엄마가 엄지척하고 학교를 묻는다.\n동작·연기 [7.000–11.867초]: 엄지척하며\n전환 이유: 화면 밖 목소리의 주인과 실제 통화 장소를 처음 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L04 [7.060–11.710초] — 엄마 (@Audio2)\n“우리 딸,  최고예요! 학교는 어때요? 좋아요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC003 [11.867–16.467초]\n공간 배치: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다..\n렌즈와 높이: 33mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑의 얼굴을 가까이 두고 나디아와 노트북을 후경에 남긴다. 질문에 맞춰 머리만 먼저 돌아간다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [11.867초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [15.000초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [11.867초]: 나디아의 눈길은 책상 위 노트북 쪽으로 향한다.\n행동: 트랑이 학교가 좋다고 답한다. 엄마가 룸메이트 이름을 묻자 트랑의 눈길이 책상 쪽 나디아에게 향한다.\n전환 이유: 질문의 대상이 방에 있는 다른 사람으로 바뀌므로 그 사람이 실제로 있는 깊이를 다시 보여준다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L05 [11.927–12.960초] — 트랑 (@Audio1)\n“Good!”\n발화 S03-L06 [13.127–14.882초] — 엄마 (@Audio2)\n“Roommate 이름이 뭐예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L07 [15.060–16.317초] — 트랑 (@Audio1)\n“나디아예요.”\n\n컷 S03-BC004 [16.467–18.800초]\n공간 배치: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다..\n렌즈와 높이: 40mm 상당의 화각, 대화 축을 유지한 어깨 너머 사선.\n첫 화면 인물: 트랑 왼쪽、나디아 중앙.\n참조: @image2(트랑), @image3(나디아).\n구도·앵글: 어깨 너머 관계. 대화 축을 유지한 어깨 너머 사선.\n화면 구성: 트랑의 어깨·폰을 가장자리에 남기고 책상 나디아의 얼굴로 작은 팬. 나디아는 의자를 떠나지 않는다.\n카메라 이동: 카메라 위치를 유지하며 필요한 방향으로 팬·틸트한다. 시작 배치: 트랑 왼쪽、나디아 중앙. 중간 배치: 트랑 왼쪽、나디아 중앙. 도착 배치: 트랑 왼쪽、나디아 중앙. 같은 대화 축과 좌우 관계를 유지하며 순간이동하지 않는다.\n시선 연결 [16.467초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [16.467초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 트랑이 폰을 돌리자 나디아가 몸을 틀고 카메라를 향해 손을 흔들며 인사한다.\n동작·연기 [16.467–17.200초]: 트랑이 폰을 옆으로 돌려 책상에 앉은 나디아를 비춘다. 나디아가 몸을 틀며 손을 흔든다.\n동작·연기 [17.200–18.800초]: 카메라를 향해\n전환 이유: 폰이 향한 대상과 실제 인물의 응답을 연결한다.\n화면 위치: 트랑 왼쪽, 나디아 중앙.\n발화 S03-L08 [17.260–18.650초] — 나디아 (@Audio3)\n“안녕하세요!”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 18.800초까지 사용한다.\n", "text_url": "media/no_previs_v001/SEQ07/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "generation_seconds": 19, "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S03-BC001", "filename": "SEQ07_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ07/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ07/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "엄마 캐릭터시트", "filename": "image03_MOTHER.png", "url": "media/prompts_v004/SEQ07/image03_MOTHER.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "엄마 음색 참조", "filename": "트랑 엄마_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ08", "scene_title": "S#3. 생활관, 트랑 & 나디아의 방 / 저녁", "shot_ids": ["S03-BC005", "S03-BC006", "S03-BC007"], "text": "시퀀스 08 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁\n생성 22초 · 본편 사용 22.000초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n끝 컷의 연출: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC005 [0.000–5.800초]\n공간 배치: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다..\n렌즈와 높이: 43mm 상당의 화각, 스마트폰 화면 정면.\n첫 화면 인물: 스마트폰 화면 속 엄마와 폰을 잡은 손.\n참조: @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 같은 물리적 폰 화면을 유지한다. 같은 대상·상황인데 화면 종류만 늘리는 확대는 넣지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 자신을 소개하고 나디아의 국적을 묻는다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L09 [0.060–3.125초] — 엄마 (@Audio1)\n“반가워요! 저는 트랑 엄마예요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L10 [3.327–5.638초] — 엄마 (@Audio1)\n“나디아는 어느 나라 사람이에요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC006 [5.800–14.467초]\n공간 배치: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지..\n렌즈와 높이: 30mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아), @image4(엄마).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 침대 트랑과 책상 나디아의 두 얼굴이 비스듬히 보이는 깊이 투숏. 폰 소리의 짧은 확인에도 두 사람의 반응을 유지.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.800초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [5.800초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n행동: 나디아가 국적과 학생 신분을 말하고 엄마에게 직업을 묻는다. 폰을 든 트랑이 옆에서 듣는다.\n전환 이유: 나디아가 인사만 하던 룸메이트에서 직접 질문하는 통화 참여자로 바뀐다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L11 [5.860–8.767초] — 나디아 (@Audio2)\n“저는... 인도네시아 사람이에요.”\n발화 S03-L12 [8.993–11.078초] — 엄마 (@Audio1)\n“아~ 인도네시아 사람이군요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L13 [11.260–14.343초] — 나디아 (@Audio2)\n“저는 학생이에요. 직업이 뭐예요?”\n\n컷 S03-BC007 [14.467–22.000초]\n공간 배치: 병원 배경·가운·청진기가 남는 폰 화면. 문단별로 같은 인서트를 쪼개지 않는다..\n렌즈와 높이: 43mm 상당의 화각, 스마트폰 화면 정면.\n첫 화면 인물: 스마트폰 화면 속 엄마와 폰을 잡은 손.\n참조: @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 병원 배경·가운·청진기가 남는 폰 화면. 문단별로 같은 인서트를 쪼개지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 의사라고 답한 뒤 한국 드라마와 현빈 이야기를 이어간다.\n전환 이유: 직업 답변에서 개인적인 취향으로 말투와 자세가 달라지는 발화 흐름을 유지한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L14 [14.527–16.050초] — 엄마 (@Audio1)\n“저는 의사예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L15 [16.260–18.483초] — 엄마 (@Audio1)\n“저는 한국 드라마 좋아해요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L16 [18.660–21.849초] — 엄마 (@Audio1)\n“현빈 팬이에요. 현빈은 배우예요.”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 22.000초까지 사용한다.\n", "text_url": "media/no_previs_v001/SEQ08/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "generation_seconds": 22, "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S03-BC005", "filename": "SEQ08_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ08/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ08/image02_NADIA.png", "status": "ready"}, {"tag": "@image4", "kind": "이미지", "label": "엄마 캐릭터시트", "filename": "image03_MOTHER.png", "url": "media/prompts_v004/SEQ08/image03_MOTHER.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "엄마 음색 참조", "filename": "트랑 엄마_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91%20%EC%97%84%EB%A7%88_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}, {"id": "SEQ09", "scene_title": "S#3. 생활관, 트랑 & 나디아의 방 / 저녁", "shot_ids": ["S03-BC008", "S03-BC009", "S03-BC010", "S03-BC011", "S03-BC012"], "text": "시퀀스 09 — S#3. 생활관, 트랑 & 나디아의 방 / 저녁\n생성 21초 · 본편 사용 20.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 엄마(MOTHER). 트랑의 베트남인 엄마, 155cm. 시트 오른쪽 얼굴과 검은 단발, 귀걸이 등 정체성을 고정한다. 이 장면은 원문에 따라 병원 진료실이며 흰 의사 가운을 입고 청진기를 목에 건다. 캐릭터시트의 평상복은 가운 안쪽 의상으로만 참고한다. 엄마는 항상 휴대폰 디스플레이 안에서만 등장한다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 엄마 전용 음색. 트랑과 구별되는 중년 여성 음색. K드라마로 배운 한국어를 의욕적으로 말하는 베트남어 억양, 감정적인 높낮이. 원어민 발음으로 개선하지 않는다. Roommate는 룸메이트로 분명하게 발음. 목소리만 휴대폰 스피커 대역으로 들리며 별도 내레이션이 아니다.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n저녁의 2인 기숙사 방. 입구에서 안쪽 창문을 보면 왼쪽이 트랑, 오른쪽이 나디아의 공간. 침대 두 개, 책상 두 개, 방 끝 창문과 커튼. 트랑의 세로 폰과 왼쪽 자기 침대, 나디아의 오른쪽 노트북 책상 소유관계를 유지한다. 엄마는 폰 속 병원 진료실에만 있고 의사 가운·청진기를 착용한다. 따뜻한 실내등과 창밖 어두워지는 하늘.\n시작 컷의 연출: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n끝 컷의 연출: 두 사람이 함께 작별하고 트랑이 폰을 내려놓는다. 이제 폰이 아닌 서로를 보며 Good night를 주고받는다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S03-BC008 [0.000–3.933초]\n공간 배치: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다..\n렌즈와 높이: 60mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 중앙.\n참조: @image2(트랑), @image4(엄마).\n구도·앵글: 가까운 표정. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 폰 가장자리가 남는 트랑 3/4 가까운 상반신. 앞선 방 투숏보다 표정을 크게 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n행동: 엄마의 현빈 사랑 고백을 듣던 트랑이 자신의 송강 취향을 밝힌다.\n화면 위치: 트랑 중앙.\n발화 S03-L17 [0.060–1.651초] — 엄마 (@Audio1)\n“현빈 사랑해요!”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n발화 S03-L18 [1.860–3.788초] — 트랑 (@Audio2)\n“저는 송강 사랑해요.”\n\n컷 S03-BC009 [3.933–7.000초]\n공간 배치: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다..\n렌즈와 높이: 43mm 상당의 화각, 스마트폰 화면 정면.\n첫 화면 인물: 스마트폰 화면 속 엄마와 폰을 잡은 손.\n참조: @image4(엄마).\n구도·앵글: 영상 통화 화면. 스마트폰 화면 정면.\n화면 구성: 동일 폰 화면의 엄마. 의미 없는 추가 줌이나 폰 외부 장소 전환을 하지 않는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n행동: 엄마가 송강이 가수인지 묻는다.\n전환 이유: 잘못 알고 묻는 말이 다음 트랑 반응의 원인이므로 질문자를 확인한다.\n엄마는 병원 진료실에서 의사 가운·청진기를 착용한 세로 폰 디스플레이 안에만 보인다. 폰 테두리와 트랑의 손을 남긴다. 엄마의 거실이나 독립된 전면 화면으로 바꾸지 않는다.\n발화 S03-L19 [3.993–6.870초] — 엄마 (@Audio1)\n“송강? 송강은 가수예요?”\n휴대폰 스피커의 엄마 음성. 폰 속 엄마가 보일 때 그 입만 립싱크한다.\n\n컷 S03-BC010 [7.000–12.800초]\n공간 배치: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다..\n렌즈와 높이: 33mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 얼굴과 나디아의 상반신을 같은 깊이 구도에 둔다. 정정·하품·시선 이동·통화 마무리 제안을 한 화면에서 읽는다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [7.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.650초]: 트랑의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [10.133초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [7.000초]: 나디아의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [9.400초]: 나디아의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n시선 연결 [10.133초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 배우라고 정정한다. 뒤쪽 나디아가 입을 가리며 하품하자 트랑이 그쪽을 보고 엄마에게 피곤하다고 말한다.\n동작·연기 [7.000–9.400초]: 인상 찌푸리면서\n동작·연기 [9.400–10.133초]: 나디아가 책상 의자에서 하품을 참으며 입을 가린다. 트랑이 이를 본다.\n전환 이유: 개인 취향의 반응에서 룸메이트의 피곤함을 알아차리는 관계 변화로 넓힌다.\n화면 위치: 트랑 왼쪽, 나디아 오른쪽.\n발화 S03-L20 [7.060–9.285초] — 트랑 (@Audio2)\n“아니요! 배우예요!”\n발화 S03-L21 [10.193–12.660초] — 트랑 (@Audio2)\n“엄마... We're tired.”\n\n컷 S03-BC011 [12.800–15.133초]\n공간 배치: 통화 연결이 유지된 폰 화면에서 끝인사까지 보인다..\n렌즈와 높이: 43mm 상당의 화각 m. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n시작 컷의 연출: 길을 헤매는 트랑을 벤치의 시우가 보고 일어나 책을 들고 다가온다.\n끝 컷의 연출: 트랑이 잘생겼다고 말하자 시우가 조금 부끄러워하며 웃고 감사한다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC001 [0.000–3.000초]\n공간 배치: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다..\n렌즈와 높이: 30mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、시우 오른쪽.\n참조: @image2(트랑), @image3(시우).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑은 가까운 왼쪽, 벤치 시우는 먼 오른쪽. 시우의 접근을 따라 두 사람이 같은 거리로 모이게 한다.\n카메라 이동: 인물 행동을 따라 카메라를 부드럽게 이동하며 아래 도착 배치로 연결한다. 시작 배치: 트랑 왼쪽、시우 오른쪽. 중간 배치: 트랑 왼쪽、시우 오른쪽. 도착 배치: 트랑 왼쪽、시우 중앙. 같은 대화 축과 좌우 관계를 유지하며 순간이동하지 않는다.\n시선 연결 [0.0 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio2 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 붕어방 연못 근처 캠퍼스 길. 연못 난간, 나무, 길 옆 벤치와 자연스러운 낮빛. 책은 시우가 가진 소품이다. 트랑과 시우의 현재 자리와 도서관 쪽 이동 방향은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n시작 컷의 연출: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우가 반갑다고 받는다.\n끝 컷의 연출: 시우가 함께 가자고 하고 트랑이 기뻐하며 답한다. 대사가 끝나면 나란히 도서관 쪽으로 걸어간다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S04-BC007 [0.000–11.000초]\n공간 배치: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏..\n렌즈와 높이: 42mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、시우 오른쪽.\n참조: @image2(트랑), @image3(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑의 3/4 얼굴을 앞세우되 오른쪽 시우의 머리가 프레임 안에 남는 비대칭 투숏.\n관계: 트랑의 3/4 얼굴을 앞세우고 시우의 듣는 측면을 함께 둔다. 이전 시우 중심 사선과 실제 위치·가림을 바꾼다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 시우의 눈길은 트랑 쪽으로 향한다.\n행동: 시우가 국적과 학생인지 묻고 트랑이 답한다. 시우 me": "image02_SIWOO.png", "url": "media/prompts_v004/SEQ11/image02_SIWOO.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "시우 음색 참조", "filename": "시우_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}]}, {"id": "SEQ12", "scene_title": "S#5. 과기대 도서관 1층 / D", "shot_ids": ["S05-BC001", "S05-BC002", "S05-BC003", "S05-BC004", "S05-BC005", "S05-BC006", "S05-BC007", "S05-BC008"], "text": "시퀀스 12 — S#5. 과기대 도서관 1층 / D\n생성 29초 · 본편 사용 28.600초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n@Audio4 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio5 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 함께 도착한 트랑과 시우에게 먼저 와 있던 나디아·아델·루카스가 모여든다. 나디아가 트랑을 부른다.\n끝 컷의 연출: 아델이 이름과 프랑스 사람임을 밝힌다. 옆의 나디아가 시우의 수신을 바라본다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC001 [0.000–3.867초]\n공간 배치: 두 사람의 접근과 친구 셋의 합류가 양쪽에서 만나는 사선 전체. 루카스는 첫 프레임부터 자리를 갖는다..\n렌즈와 높이: 28mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: ia/prompts_v004/SEQ12/image04_LUCAS.png", "status": "ready"}, {"tag": "@image6", "kind": "이미지", "label": "시우 캐릭터시트", "filename": "image05_SIWOO.png", "url": "media/prompts_v004/SEQ12/image05_SIWOO.png", "status": "ready"}, {"tag": "@image7", "kind": "이미지", "label": "준영 캐릭터시트", "filename": "image06_JUNYOUNG.png", "url": "media/prompts_v004/SEQ12/image06_JUNYOUNG.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "시우 음색 참조", "filename": "시우_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%8B%9C%EC%9A%B0_v2.wav", "status": "ready"}, {"tag": "@Audio3", "kind": "음성", "label": "아델 음색 참조", "filename": "아델_v2.wav", "url": "media/prompts_v004/voices/v2/%EC%95%84%EB%8D%B8_v2.wav", "status": "ready"}, {"tag": "@Audio4", "kind": "음성", "label": "루카스 음색 참조", "filename": "루카스_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%A3%A8%EC%B9%B4%EC%8A%A4_v2.wav", "status": "ready"}, {"tag": "@Audio5", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}]}, {"id": "SEQ13", "scene_title": "S#5. 과기대 도서관 1층 / D", "shot_ids": ["S05-BC009", "S05-BC010", "S05-BC011", "S05-BC012", "S05-BC013", "S05-BC014", "S05-BC015"], "text": "시퀀스 13 — S#5. 과기대 도서관 1층 / D\n생성 27초 · 본편 사용 26.467초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 연청 데님 재킷과 베이지 크로스백을 착용한다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다.\n@image4 = 아델(ADELE). 21세 프랑스 여성, 168cm. 시트의 얼굴과 어깨 길이 금발 웨이브, 베이지 트렌치코트, 남색·흰색 가로줄 상의, 연청 청바지, 검은 로퍼 고정. 안경 없음.\n@image5 = 루카스(LUCAS). 22세 브라질 남성, 180cm. 시트의 얼굴과 짧은 검은 곱슬머리, 노란 브라질 축구 유니폼과 초록 테두리, 검은 조거 팬츠, 흰 운동화 고정. 안경 없음. 활발한 반응은 상황에 맞게 짧고 따뜻하게.\n@image6 = 시우(SIWOO). 한국인 남성 대학생, 185cm. 시트의 얼굴과 검은 머리, 검정 몸판·흰 소매 과잠, 회색 후드, 청바지, 운동화 고정. 배우 송강이라는 대사는 트랑의 착각이다. 다른 실제 배우 얼굴로 바꾸지 않는다. S04에서 든 책은 S05에서도 시우 소유로 이어진다.\n@image7 = 준영(JUNYOUNG). 한국인 남성 대학생, 172cm. 시트의 얼굴과 갈색 가르마 머리, 남색 폴로 셔츠, 크림색 바지, 흰 운동화 고정. 도서관 앞 무리에서 멀리 떨어진 위치에서 시우를 부른다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 루카스 전용 음색. 활기찬 남성 음색. 브라질 포르투갈어 억양이 남은 한국어 초보자. 열린 모음과 탄력 있는 리듬, 짧은 감탄. 상대의 말을 가로막더라도 원문에 없는 말은 추가하지 않는다.\n@Audio2 = 시우 전용 음색. 친절하고 편안한 한국어 원어민 남성. 자연스럽고 빠른 일상 대화, 외국 학생에게 질문할 때만 또렷하게. 영어 “May I help you?”와 “Let’s go.”도 본인의 같은 음색.\n@Audio3 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n@Audio4 = 준영 전용 음색. 한국어 원어민 남성. 멀리 있는 친구를 편하게 부르는 또렷한 외침. 거리감을 주되 음색 참조는 유지.\n@Audio5 = 아델 전용 음색. 밝고 호기심 많은 여성 음색. 프랑스어 억양이 남은 한국어 초보자. 문장 끝 높낮이에 개성이 있고 표현을 한 번 확인하듯 말한다. 과장된 우스개 발음이나 긴 낭독 호흡은 금지.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n낮의 과기대 도서관 1층 앞 입구. 유리 외벽과 출입문. 트랑·시우와 나디아·루카스·아델의 현재 위치는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다. 루카스는 처음부터 같은 공간에 있고 준영은 무리와 떨어진 먼 위치에 있다. 이 묶음 시작 전에 끝난 도착이나 모이기 동작을 새로 만들지 않는다.\n시작 컷의 연출: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n끝 컷의 연출: 아델이 트랑을 놀리고 루카스와 나디아가 함께 장난스럽게 반응한다. 트랑은 뺨을 감싼 채 멀어지는 시우를 계속 본다. 시우의 뒤 통로 퇴장은 프레임 뒤쪽이나 밖에서 26.300초까지 이어진다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S05-BC009 [0.000–5.133초]\n공간 배치: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다..\n렌즈와 높이: 43mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 시우 왼쪽、아델 오른쪽、나디아 중앙、루카스 오른쪽.\n참조: @image3(나디아), @image4(아델), @image5(루카스), @image6(시우).\n구도·앵글: 관계 그룹숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 루카스가 친구들 옆 통로로 나와 자기소개한다. 왼쪽 시우 전경과 루카스 얼굴을 분리하고 오른쪽 나디아·아델의 수신을 함께 남긴다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 루카스의 눈길은 시우 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [0.000초]: 아델의 눈길은 루카스 쪽으로 향한다.\n인물 동선 [0.000–1.600초]: 루카스의 이동 구간. 아래 행동에 적힌 통로·목적지를 따르며 시작·종료 배치를 연결한다. 이미 끝난 이동을 다시 시작하지 않는다.\n행동: 뒤에 있던 루카스가 옆 통로로 한 걸음 가까워져 인사하고 이름과 국적을 말한다. 두 친구는 그를 향해 눈길을 옮긴다.\n동작·연기 [0.000–1.600초]: 불쑥 끼어들면서\n시작 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 오른쪽.\n중간 화면: 시우 왼쪽, 아델 오른쪽, 나디아 중앙, 루카스 왼쪽.\n발화 S05-L14 [0.060–1.450초] — 루카스 (@Audio1)\n“안녕하세요?”\n발화 S05-L15 [1.660–5.015초] — 루카스 (@Audio1)\n“저는 루카스예요! 브라질 사람이에요.”\n\n컷 S05-BC010 [5.133–8.067초]\n공간 배치: 시우와 트랑의 얼굴이 동시에 오른쪽의 나디아를 향하는 투숏. 문장보다 눈길의 대상이 다음 전환을 만든다..\n렌즈와 높이: 50mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 왼쪽、시우 중앙、아델 오른쪽.\n참조: @image2(트랑), @image4(아델), @image6(시우).\n구도·앵글: 관계 투숏. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 시우와 트랑의 얼굴이 동시에 오른쪽의 나디아를 향하는 투숏. 문장보다 눈길의 대상이 다음 전환을 만든다.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [5.133초]: 시우의 눈길은 나디아 쪽으로 향한다.\n시선 연결 [5.133초]: 트랑의 눈길은 루카스 쪽으로 향한다.\n시선 연결 [6.533초]: 트랑의 눈길 타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n밤의 같은 기숙사 방. 왼쪽은 트랑의 책상, 오른쪽은 나디아의 침대다. 트랑은 책상 의자에 앉아 세로 폰을 들고 있다. 폰을 든 사람은 트랑 한 명이다. 나디아는 미용 팩과 히잡을 유지하며 오른쪽 자기 침대에 누워 있다. 방과 책상 배치는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n\n컷 S06-BC001 [0.000–1.000초]\n공간 배치: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인..\n렌즈와 높이: 26mm 상당의 화각, 관계에 따른 사선·높이·깊이 배치.\n첫 화면 인물: 트랑 중앙、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아).\n구도·앵글: 공간 전체. 관계에 따른 사선·높이·깊이 배치.\n화면 구성: 트랑 책상과 나디아 침대를 함께 보는 방 사선. 나디아의 누운 자세와 팩을 독립된 위치로 확인.\n카메라: 고정. 인물의 시선·몸짓 변화만 이어간다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n행동: 책상에 앉은 트랑이 셀카 녹화를 시작한다. 맞은편 침대에는 팩을 하고 누운 나디아가 있다.\n동작·연기 [0.000–1.000초]: 트랑은 자기 책상에 앉아 폰 셀카 녹화를 시작한다. 나디아는 반대쪽 침대에 팩을 하고 누워 있다.\n화면 위치: 트랑 중앙, 나디아 오른쪽.\n새 대사 없이 지정된 동작과 청자 반응만 수행한다.\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 3.000초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 1.000초까지 사용한다.\n", "text_url": "media/no_previs_v001/SEQ14/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "generation_seconds": 4, "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S06-BC001", "filename": "SEQ14_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ14/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ14/image02_NADIA.png", "status": "ready"}]}, {"id": "SEQ15", "scene_title": "S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤", "shot_ids": ["S06-BC002"], "text": "시퀀스 15 — S#6. 에필로그: 유튜브 채널 \u003cTrang's Soul, Seoul> / 밤\n생성 30초 · 본편 사용 29.800초 · 16:9 · 720p · 오디오 켬\n\n스타트 프레임과 시작 상태\n@image1 = 이 SEQ의 첫 구도로 제작한 완성 스타트 프레임. 시작 순간의 인물 위치·얼굴·의상·가구 배치·조명·카메라 구도를 고정한다.\n영상은 @image1의 상태에서 바로 시작한다. 이미지를 보여주는 별도 슬라이드나 새로운 도입 컷을 추가하지 않는다.\n첫 컷 이후에는 아래 시간별 컷 구성의 카메라 이동·인물 동선을 따른다. 스타트 프레임의 구도를 모든 컷에 반복하거나 인물을 그 자세로 멈춰 두지 않는다.\n스타트 프레임과 첫 컷의 구도가 충돌하면 이미지부터 수정한다. 원문 대사·행동·시간을 이미지에 맞춰 바꾸지 않는다.\n\n참조 역할과 우선순위\n전체 원문 대사와 지문이 모든 참조보다 우선한다. 인물 이미지는 얼굴·체형·머리·의상, 음성은 지정 화자의 음색만 담당한다. 캐릭터시트의 정면 자세·배경·구도로 카메라와 인물 배치를 바꾸지 않는다.\n\n인물 외형 참조\n@image2 = 트랑(TRANG). 20세 베트남 여성, 158cm. 시트 오른쪽 얼굴의 눈매·쌍꺼풀·코·입·얼굴 비율과 가운데 가르마 긴 검은 웨이브 머리를 그대로 고정. 흰 티셔츠, 크림색 플리츠 미디스커트, 흰 운동화. 기숙사 실내 차림이며 데님 재킷과 크로스백은 벗어 둔다. 안경 없음.\n@image3 = 나디아(NADIA). 20세 인도네시아 여성, 160cm. 시트의 얼굴, 가느다란 금색 원형 안경, 차분한 장밋빛 히잡 고정. 흰 긴소매 블라우스, 세이지 그린 니트 조끼, 연청 와이드 청바지, 크림색 신발. 히잡 항상 유지. 실내에서는 숄더백을 벗는다. S06에서는 원문대로 얼굴에 미용 팩을 붙이고 오른쪽 자기 침대에 누워 있다.\n캐릭터시트의 얼굴 클로즈업과 같은 얼굴을 유지한다. 시트의 이름·국기·눈금·회색 배경·여러 뷰를 영상에 넣지 않는다. 얼굴·안경·히잡·의상·소품이 다른 인물에게 옮겨가지 않는다.\n\n목소리·억양·대사\n첨부한 화자의 음색을 모든 컷에서 유지한다. 음성 참조의 문장·침묵 길이는 복제하지 않고 아래 대사와 발화 시간을 따른다.\n@Audio1 = 트랑 전용 음색. 부드럽고 약간 높은 여성 음색. 한국어 초보자의 베트남어 억양, 짧은 음절 단위의 높낮이 변화와 조금 조심스러운 자음 연결. 원어민처럼 매끄럽게 바꾸지 않는다. 대사는 빠른 일상 호흡으로 이어가며 단어·받침을 일부러 삭제하지 않는다.\n@Audio2 = 나디아 전용 음색. 차분한 여성 음색. 한국어 초보자의 인도네시아어 억양과 또렷한 모음. 작은 확인 호흡은 허용하되 모든 단어마다 길게 멈추지 않는다. 원문에 있는 “저는...”의 망설임만 짧게 살린다.\n외국인 학생과 베트남인 엄마의 한국어에는 초보자의 모국어 리듬과 조심스러운 연결이 남는다. 장면이 진행되어도 갑자기 원어민 발음으로 바뀌지 않는다. 한국인 교사·시우·준영에게 외국어 억양을 적용하지 않는다.\n명시된 문구와 순서를 정확히 말한다. 원문에 없는 말줄임표·추임새·번역·감탄을 추가하지 않는다. 받침·음절·단어를 삭제하지 않는다. 짧은 확인 호흡은 발화 시간 안에서 처리하고 문장마다 긴 침묵을 만들지 않는다.\n현재 화자만 립싱크한다. 청자는 입을 다문 채 고개·시선·작은 표정으로 반응한다. 동시 발화로 지정한 두 사람만 함께 말한다. 화면 밖 현장 대사와 폰 음성을 화면에 크게 보이는 다른 얼굴에 배정하지 않는다.\n\n장소·연속성\n밤의 같은 기숙사 방. 왼쪽은 트랑의 책상, 오른쪽은 나디아의 침대다. 트랑은 책상 의자에 앉아 세로 폰을 들고 있다. 폰을 든 사람은 트랑 한 명이다. 나디아는 미용 팩과 히잡을 유지하며 오른쪽 자기 침대에 누워 있다. 방과 책상 배치는 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n이전 묶음의 완료 동작을 다시 시작하지 않는다. 역숏은 카메라의 방향 변화이며 인물 자리와 소품 소유권이 바뀌는 것이 아니다. 셀카·영상통화 인사 이외에는 렌즈를 직접 보지 않는다.\n\n관계 중심 연출\n발표자와 듣는 사람이 함께 보이는 컷에서는 두 사람의 얼굴·눈길·반응이 실제로 읽혀야 한다. 앞사람을 거대한 흐린 어깨로 만들어 청자 표정을 전부 가리지 않는다. 중요 인물의 크기와 가림은 아래 시간별 구도·시선·시작과 끝의 화면 배치를 따른다.\n한 화면에서 말하는 사람과 듣는 사람의 상호작용이 보이면 그대로 유지한다. 발화마다 싱글로 자르거나, 거의 같은 구도를 작은 확대·축소로 바꾸지 않는다. 아래에 지정된 전환에서만 컷한다.\n\n시간별 컷 구성\n셀카는 트랑이 든 한 대의 폰 시점이다. 나디아가 보이는 동안 트랑의 소개 요청과 Good!은 화면 밖 현장 음성이다. 나디아는 미용 팩과 히잡을 유지한 채 침대에 누워 인사한다. 일어나 앉거나 팩을 떼지 않는다.\n\n컷 S06-BC002 [0.000–29.800초]\n공간 배치: 셀카 얼굴, 책상과 방을 지나는 팬, 침대 나디아, 셀카 복귀가 하나의 실제 폰 동선으로 이어진다. 폰을 순간이동시키지 않는다..\n렌즈와 높이: 22mm 상당의 화각, 실제 폰 시점.\n첫 화면 인물: 트랑 중앙、나디아 오른쪽.\n참조: @image2(트랑), @image3(나디아).\n구도·앵글: 연속 셀카. 실제 폰 시점.\n화면 구성: 셀카 얼굴, 책상과 방을 지나는 팬, 침대 나디아, 셀카 복귀가 하나의 실제 폰 동선으로 이어진다. 폰을 순간이동시키지 않는다.\n카메라 이동: 트랑이 든 폰의 셀카 시점을 유지한다. 트랑 얼굴에서 폰을 내려 책상과 방을 지나 오른쪽 침대의 나디아로 돌린 뒤, 마지막에는 다시 트랑 얼굴로 되돌린다. 별도 카메라가 폰 바깥에서 따라오는 장면으로 바꾸지 않는다.\n시선 연결 [0.000초]: 트랑의 눈길은 트랑의 폰 화면 쪽으로 향한다.\n시선 연결 [0.000초]: 나디아의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n시선 연결 [7.467초]: 나디아의 눈길은 폰 화면 또는 현재 동작의 대상 지점 쪽으로 향한다.\n시선 연결 [21.933초]: 나디아의 눈길은 트랑 쪽으로 향한다.\n행동: 트랑이 셀카로 소개한 뒤 폰을 내려 책상과 방을 지나 나디아를 보여준다. 나디아의 소개를 듣고 폰을 되돌려 V와 끝인사·구독 요청을 한 뒤 녹화를 멈춘다.\n동작·연기 [6.467–7.467초]: 트랑이 폰을 살짝 내려 책상과 방을 지나 나디아의 침대 쪽으로 돌린다.\n동작·연기 [21.333–21.933초]: 트랑이 폰을 자기 쪽으로 돌려 V를 그리며 웃는다.\n동작·연기 [29.200–29.800초]: 트랑이 폰 화면의 정지 버튼을 누른다.\n시작 화면: 트랑 중앙, 나디아 오른쪽.\n중간 화면: 나디아 중앙.\n끝 화면: 트랑 중앙, 나디아 오른쪽.\n발화 S06-L01 [0.060–4.803초] — 트랑 (@Audio1)\n“안녕하세요! 저는 트랑이에요. 베트남 사람이에요.”\n발화 S06-L02 [4.993–6.338초] — 트랑 (@Audio1)\n“학생이에요.”\n발화 S06-L03 [7.527–12.201초] — 트랑 (@Audio1)\n“나디아! 자기소개. Please introduce yourself!”\n트랑의 화면 밖 현장 음성. 화면의 나디아는 이 대사를 립싱크하지 않는다.\n발화 S06-L04 [12.393–15.408초] — 나디아 (@Audio2)\n“안녕하세요? 저는 나디아예요.”\n발화 S06-L05 [15.593–20.030초] — 나디아 (@Audio2)\n“인도네시아 사람이에요. 학생이에요! 반가워요.”\n발화 S06-L06 [20.193–21.227초] — 트랑 (@Audio1)\n“Good!”\n트랑의 화면 밖 현장 음성. 화면의 나디아는 이 대사를 립싱크하지 않는다.\n발화 S06-L07 [21.993–23.175초] — 트랑 (@Audio1)\n“Good night!”\n발화 S06-L08 [23.393–29.057초] — 트랑 (@Audio1)\n“Like, subscribe, and turn on notifications! please~”\n\n스타일·음향·후반 작업\n사실적인 실사 한국 웹드라마. 따뜻한 일상 조명, 자연스러운 피부와 편안한 앙상블. 상황에 맞는 작은 반응을 유지한다. 과장된 시트콤 표정과 웃음 트랙은 넣지 않는다.\n정상 속도의 인물 동작과 지정된 카메라 움직임만 사용한다. 슬로모션·임의 푸시인·과장된 하이앵글·로우앵글·줌 컷을 추가하지 않는다.\n장소의 작은 환경음과 필요한 발소리·옷 마찰·의자·키보드·폰 소리. BGM·해설·새 내레이션·자막·이름표·워터마크 없음. 칠판 글씨와 브이로그 채널 제목·암전은 후반 합성한다.\n원문과 이 콘티에 없는 도입·이동·준비·농담·반응·마무리를 추가하지 않는다.\n생성 길이의 남는 0.200초는 마지막 상태를 유지하는 편집 여유다. 말과 완료 동작을 반복하지 않는다. 본편에는 29.800초까지 사용한다.\n", "text_url": "media/no_previs_v001/SEQ15/%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8.txt", "generation_seconds": 30, "references": [{"tag": "@image1", "kind": "스타트 프레임", "label": "완성 이미지 생성 후 첨부 · S06-BC002", "filename": "SEQ15_스타트프레임.png", "url": null, "status": "pending_generation"}, {"tag": "@image2", "kind": "이미지", "label": "트랑 캐릭터시트", "filename": "image01_TRANG.png", "url": "media/prompts_v004/SEQ15/image01_TRANG.png", "status": "ready"}, {"tag": "@image3", "kind": "이미지", "label": "나디아 캐릭터시트", "filename": "image02_NADIA.png", "url": "media/prompts_v004/SEQ15/image02_NADIA.png", "status": "ready"}, {"tag": "@Audio1", "kind": "음성", "label": "트랑 음색 참조", "filename": "트랑_v2.wav", "url": "media/prompts_v004/voices/v2/%ED%8A%B8%EB%9E%91_v2.wav", "status": "ready"}, {"tag": "@Audio2", "kind": "음성", "label": "나디아 음색 참조", "filename": "나디아_v2.wav", "url": "media/prompts_v004/voices/v2/%EB%82%98%EB%94%94%EC%95%84_v2.wav", "status": "ready"}]}], "approved_representative_shot_ids": [], "approval_scope": "B안 연출 방향 선택 및 전편 제작 위임. 새 샷별 결과는 검토 대기", "voice_reference_status": "11명 v2 · 각 4.976초 · SEQ별 번호", "external_generation_verified": false}</script>

<script>
"use strict";
const $=id=>document.getElementById(id), model=JSON.parse($('studio-data').textContent);
const key='interview-studio-review-v1:'+model.project.id, items=model.items, byId=new Map(items.map(x=>[x.id,x])), leaves=items.filter(x=>x.leaf);
let scope='',current=null,activeTab='previs';
const TABS=['previs','storyboard','prompts','startframes','no-previs'];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,reload=false){$('banner-text').textContent=text;$('banner').hidden=false;$('reload').hidden=!reload}
function descendants(id){return leaves.filter(x=>{let p=x;while(p){if(p.id===id)return true;p=byId.get(p.parent)}return false})}
function navButton(item,label){const count=item?descendants(item.id).length:leaves.length;return '<button class="nav-button" data-scope="'+esc(item?.id||'')+'"><span>'+esc(label)+'</span><small>'+count+'</small></button>'}
function navigation(){
 let out=navButton(null,model.video?'전체 샷':'전체 항목');
 function children(parent,depth){return items.filter(x=>x.parent===parent&&!x.leaf).map(x=>'<div class="'+(depth?'scene-list':'act')+'">'+navButton(x,x.title)+children(x.id,depth+1)+'</div>').join('')}
 out+=children(null,0);$('navigation').innerHTML=out;
}
function preview(item,thumb=false){
 const m=item.media;
 if(!m||thumb&&m.kind==='audio')return '<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="m3 17 5-5 4 4 4-7 5 8"/></svg><span>'+(m?'오디오':'미리보기 준비 중')+'</span></div>';
 if(m.kind==='image')return '<img loading="lazy" src="'+esc(m.url)+'" alt="'+esc(m.label)+'">';
 if(m.kind==='video'){if(thumb)return '<img loading="lazy" src="'+esc(m.poster)+'" alt="'+esc(m.label)+' · 클릭하여 재생">';return '<video controls playsinline preload="metadata" poster="'+esc(m.poster)+'" aria-label="'+esc(item.id)+' 프리비즈" src="'+esc(m.url)+'"></video>';}
 return '<audio controls preload="metadata" src="'+esc(m.url)+'"></audio>';
}
function displayTitle(item){return model.video&&item.kind==='shot'?item.id:item.title}
function cameraText(item){return model.video?[item.framing,item.angle].filter(Boolean).join(' · '):''}
const searchText=new Map(items.map(item=>{const div=document.createElement('div');div.innerHTML=item.body;return [item.id,(item.title+' '+item.id+' '+cameraText(item)+' '+div.textContent).toLocaleLowerCase()]}));
function readingBody(item){
 const box=document.createElement('div');box.innerHTML=item.body;
 box.querySelectorAll('figure,pre,video,audio').forEach(x=>x.remove());
 for(const heading of [...box.querySelectorAll('h2,h3,h4,h5,h6')]){
  if(!box.contains(heading))continue;
  const text=heading.textContent.trim(),level=Number(heading.tagName.slice(1));
  if(/^(생성\s*)?프롬프트$|^(첨부\s*)?참조$|^첨부(\s*파일)?$|^references?$|^reference priority$|^prompts?$/i.test(text)){
   let node=heading.nextElementSibling;
   while(node&&!(/^H[2-6]$/.test(node.tagName)&&Number(node.tagName.slice(1))<=level)){const next=node.nextElementSibling;node.remove();node=next}
   heading.remove();
  }else if(/^(상세\s*)?콘티$/.test(text))heading.remove();
 }
 for(const wrap of box.querySelectorAll('.table-wrap')){
  const labels=[...wrap.querySelectorAll('th')].map(x=>x.textContent.trim().toLowerCase());
  if(labels.includes('참조')&&labels.includes('역할')||labels.includes('reference')&&labels.includes('role'))wrap.remove();
 }
 return box.innerHTML;
}
function renderStoryboard(visible){
 const selected=new Set(visible.map(x=>x.id));
 function node(item){
  if(item.leaf){
   if(!selected.has(item.id))return '';
   return '<article class="conti-shot" data-story-id="'+esc(item.id)+'"><div class="conti-shot-index"><button data-open="'+esc(item.id)+'">'+(model.video?'':'<small>'+esc(item.id)+'</small>')+'<strong>'+esc(displayTitle(item))+'</strong></button><span class="count">'+(item.duration!=null?item.duration+'초':'')+'</span></div><div class="conti-content">'+(cameraText(item)?'<p class="muted camera-line">'+esc(cameraText(item))+'</p>':'')+readingBody(item)+'</div></article>';
  }
  const inner=items.filter(x=>x.parent===item.id).map(node).join('');
  if(!inner)return '';
  if(item.kind==='act')return '<section class="conti-act"><h3>'+esc(item.title)+'</h3>'+inner+'</section>';
  return '<section class="conti-scene"><div class="conti-scene-head"><h4>'+esc(item.title)+'</h4><div class="conti-context">'+readingBody(item)+'</div></div>'+inner+'</section>';
 }
 $('storyboard').innerHTML=items.filter(x=>!x.parent).map(node).join('');
}
function renderActPlayer(){
 const acts=model.act_movies||[],select=$('act-playback-select'),video=$('act-playback');
 if(!select.options.length)select.innerHTML='<option value="">1화 전체</option>'+acts.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.id+' · '+a.title)+'</option>').join('');
 let node=byId.get(scope);while(node&&node.parent)node=byId.get(node.parent);
 const act=acts.find(a=>a.id===node?.id),id=act?.id||'',url=act?.url||model.full_movie;
 select.value=id;
 if(video.dataset.act!==id){video.pause();video.src=url;video.poster=act?.poster||acts[0]?.poster||'';video.dataset.act=id;video.load()}
 const seconds=Math.round(act?.seconds??model.episode_duration);
 $('act-playback-info').textContent=Math.floor(seconds/60)+'분 '+String(seconds%60).padStart(2,'0')+'초 · '+(act?act.scene_ids.join(' · '):'전편');
}
$('act-playback-select').addEventListener('change',e=>{scope=e.target.value;renderCards()});
function setTab(tab){
 activeTab=TABS.includes(tab)?tab:'previs';
 document.querySelectorAll('.prompt-card audio').forEach(x=>x.pause());
 if(activeTab!=='previs')$('act-playback').pause();
 for(const id of TABS){
  const selected=activeTab===id,button=$('tab-'+id);
  button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;$(id+'-panel').hidden=!selected;
 }
 $('search').placeholder=['prompts','startframes','no-previs'].includes(activeTab)?'프롬프트 검색':'샷 검색';$('search').setAttribute('aria-label',$('search').placeholder);
 renderCards();
}
function renderCards(){
 renderActPlayer();
 const query=$('search').value.toLocaleLowerCase().trim(),group=scope?descendants(scope):leaves;
 const exact=group.some(item=>item.id.toLowerCase()===query);const visible=group.filter(item=>!query||(exact?item.id.toLowerCase()===query:searchText.get(item.id).includes(query)));
 renderStoryboard(visible);
 const promptCount=renderPromptGroups(group,query);
 const extraCount=renderExtraGroups(group,query);
 $('cards').innerHTML=visible.map(item=>'<article class="card" data-id="'+esc(item.id)+'"><button class="open-card" data-open="'+esc(item.id)+'" aria-label="'+esc(displayTitle(item))+' 상세"><div class="thumb">'+preview(item,true)+(model.video?'':'<span class="shot-number">'+esc(item.id)+'</span>')+(item.duration!=null?'<span class="duration">'+item.duration+'s</span>':'')+'</div><div class="card-text"><h3>'+esc(displayTitle(item))+'</h3><p class="description'+(cameraText(item)?' camera-line':'')+'">'+esc(cameraText(item)||item.summary)+'</p></div></button></article>').join('');
 $('no-results').hidden=visible.length>0;$('no-results').textContent=leaves.length?'검색 결과가 없습니다.':'아직 샷이 없습니다.';
 $('scope-title').textContent=scope?byId.get(scope).title:(model.video?(activeTab==='storyboard'?'전체 콘티':'전체 샷'):'전체 항목');
 $('count').textContent=query?visible.length+' / '+group.length:visible.length+'';
 if(activeTab==='prompts'){$('scope-title').textContent=scope?byId.get(scope).title+' · 프롬프트':'전체 프롬프트';$('count').textContent=promptCount+'묶음';$('no-results').hidden=promptCount>0;}
 if(['startframes','no-previs'].includes(activeTab)){const label=activeTab==='startframes'?'스타트 프레임':'프리비즈 없이 생성';$('scope-title').textContent=scope?byId.get(scope).title+' · '+label:'전체 '+label;$('count').textContent=extraCount[activeTab]+'묶음';$('no-results').hidden=extraCount[activeTab]>0;}
 document.querySelectorAll('[data-scope]').forEach(b=>{const active=b.dataset.scope===scope;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
}
function promptReferences(g){
 const rows=(g.references||[]).map(r=>'<tr><td><code>'+esc(r.tag)+'</code></td><td>'+esc(r.kind)+' · '+esc(r.label)+'</td><td>'+(r.url?'<a href="'+esc(r.url)+'" download>'+esc(r.filename)+'</a>'+(r.kind==='음성'?'<br><audio controls preload="none" style="max-width:100%;margin-top:6px" aria-label="'+esc(r.label)+' 미리듣기" src="'+esc(r.url)+'"></audio>':''):'<span class="reference-pending">'+esc(r.filename?r.filename+' · ':'')+'생성 대기 · 파일 미첨부</span>')+'</td></tr>').join('');
 return '<section class="prompt-references" aria-label="'+esc(g.id)+' 첨부할 참조 파일"><h4>첨부할 참조 파일</h4><div class="table-wrap"><table><thead><tr><th scope="col">태그</th><th scope="col">종류 · 용도</th><th scope="col">파일</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+(g.references.some(r=>r.kind==='음성')?'<p>음성은 v2 · 각 4.976초. 이 SEQ의 음성 목록 순서대로 첨부한다. @Audio 번호는 SEQ마다 1부터 시작한다. 서비스가 다른 태그를 부여하면 본문도 맞춘다.</p>':'')+'</section>';
}
function renderPromptGroups(group,query){
 const allowed=new Set(group.map(x=>x.id));
 const groups=(model.prompt_groups||[]).filter(g=>g.shot_ids.some(id=>allowed.has(id))&&(!query||(g.id+' '+g.scene_title+' '+g.shot_ids.join(' ')+' '+g.text).toLocaleLowerCase().includes(query)));
 $('prompt-list').innerHTML=groups.map(g=>'<article class="prompt-card" data-prompt="'+esc(g.id)+'"><div class="prompt-head"><h3>'+esc(g.id)+' · '+esc(g.scene_title)+'</h3><button data-copy-prompt="'+esc(g.id)+'" aria-label="'+esc(g.id)+' 프롬프트 복사">프롬프트 복사</button></div><p>'+esc(g.shot_ids.join(' · '))+' · 생성 '+g.generation_seconds+'초</p><p><a href="'+esc(g.text_url)+'" download>TXT 저장</a> · <a href="'+esc(g.video_url)+'" download>참조 프리비즈</a></p>'+promptReferences(g)+'<details><summary>프롬프트 본문</summary><textarea class="prompt-text" readonly aria-label="'+esc(g.id)+' 프롬프트 본문">'+esc(g.text)+'</textarea></details></article>').join('');
 return groups.length;
}
function renderExtraGroups(group,query){
 const allowed=new Set(group.map(x=>x.id)),counts={};
 for(const [tab,source] of [['startframes',model.start_frame_groups],['no-previs',model.no_previs_groups]]){
  const groups=(source||[]).filter(g=>g.shot_ids.some(id=>allowed.has(id))&&(!query||(g.id+' '+g.scene_title+' '+g.shot_ids.join(' ')+' '+g.text).toLocaleLowerCase().includes(query)));
  counts[tab]=groups.length;
  $(tab+'-list').innerHTML=groups.map(g=>'<article class="prompt-card"><div class="prompt-head"><h3>'+esc(g.id)+' · '+esc(g.scene_title)+'</h3><button data-copy-extra="'+esc(g.id)+'" data-copy-tab="'+tab+'">프롬프트 복사</button></div>'+(tab==='startframes'?'<p>'+esc(g.first_shot_id)+' · 완성 이미지 생성 대기 · 저장 이름: '+esc(g.expected_filename)+'</p><figure style="margin:12px 0"><img loading="lazy" style="display:block;width:100%;max-width:720px;aspect-ratio:16/9;object-fit:contain" src="'+esc(g.preview_url)+'" alt="'+esc(g.id)+' 실제 프리비즈 첫 구도"><figcaption class="muted">구도 참조 · 완성 실사 이미지 아님</figcaption></figure>':'<p>'+esc(g.shot_ids.join(' · '))+' · 생성 '+g.generation_seconds+'초</p>')+'<p><a href="'+esc(g.text_url)+'" download>TXT 저장</a></p>'+promptReferences(g)+'<details><summary>프롬프트 본문</summary><textarea class="prompt-text" readonly aria-label="'+esc(g.id)+' '+(tab==='startframes'?'이미지 생성':'영상 생성')+' 프롬프트">'+esc(g.text)+'</textarea></details></article>').join('');
 }
 return counts;
}
async function copyText(text,button){
 let copied=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);copied=true}}catch(e){}
 if(!copied){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';const parent=$('detail-dialog').open?$('detail-dialog'):document.body;parent.append(area);try{area.focus();area.select();copied=document.execCommand('copy')}catch(e){}finally{area.remove();button.focus()}}
 button.textContent=copied?'복사됨':'직접 선택해 복사';
 if(copied)setTimeout(()=>button.textContent='프롬프트 복사',1500);
 else{const card=button.closest('.prompt-card');if(card){card.querySelector('details').open=true;const area=card.querySelector('textarea');area.focus();area.select()}message('자동 복사가 허용되지 않습니다. 선택된 본문을 직접 복사해 주세요.')}
 return copied;
}
$('prompt-list').addEventListener('click',async e=>{const button=e.target.closest('[data-copy-prompt]');if(!button)return;const g=model.prompt_groups.find(x=>x.id===button.dataset.copyPrompt);if(g){const ok=await copyText(g.text,button);$('prompt-copy-status').textContent=ok?g.id+' 프롬프트를 복사했습니다.':'본문을 선택했습니다. Ctrl+C로 복사하세요.'}});
for(const tab of ['startframes','no-previs'])$(tab+'-list').addEventListener('click',async e=>{const button=e.target.closest('[data-copy-extra]');if(!button)return;const source=tab==='startframes'?model.start_frame_groups:model.no_previs_groups;const g=source.find(x=>x.id===button.dataset.copyExtra);if(g){const ok=await copyText(g.text,button);$(tab+'-copy-status').textContent=ok?g.id+' 프롬프트를 복사했습니다.':'본문을 선택했습니다. Ctrl+C로 복사하세요.'}});
function openDetail(id){
 $('act-playback').pause();
 const item=byId.get(id);if(!item)return;current=id;
 const chain=[];let p=item;while(p){chain.unshift(p.title);p=byId.get(p.parent)}
 $('detail-path').textContent=chain.slice(0,-1).join(' / ')||item.kindLabel;$('detail-title').textContent=displayTitle(item);
 $('detail-preview').hidden=!item.media;$('detail-preview').innerHTML=item.media?preview(item):'';
 $('detail-meta').innerHTML=(model.video&&item.kind==='shot'?'':'<span>'+esc(item.id)+'</span>')+(item.duration!=null?'<span>'+item.duration+'초</span>':'');
 $('detail-content').innerHTML=(cameraText(item)?'<p class="muted camera-line">'+esc(cameraText(item))+'</p>':'')+item.body;
 if(item.media){const first=$('detail-content').querySelector('figure');if(first)first.remove()}
 const blocks=[...$('detail-content').querySelectorAll('pre')];$('prompt-content').replaceChildren();
 for(const pre of blocks){const wrap=document.createElement('div');wrap.className='code-wrap';const heading=pre.previousElementSibling;if(heading&&/^H[2-6]$/.test(heading.tagName)){if(/^(생성\s*)?프롬프트$/i.test(heading.textContent.trim()))heading.remove();else wrap.append(heading)}const b=document.createElement('button');b.className='copy-code';b.textContent='프롬프트 복사';b.addEventListener('click',()=>copyText(pre.textContent,b));wrap.append(b,pre);$('prompt-content').append(wrap)}
 $('prompt-section').hidden=!blocks.length;$('prompt-section').open=false;
 $('approval').hidden=!item.approval;
 if(item.approval)$('approval').textContent='기록된 승인 · '+item.approval.version+' / '+item.approval.scope+' / '+item.approval.date+' / '+item.approval.evidence;
 if(!$('detail-dialog').open)$('detail-dialog').showModal();
}
$('navigation').addEventListener('click',e=>{const button=e.target.closest('[data-scope]');if(button){scope=button.dataset.scope;renderCards()}});
for(const panel of [$('cards'),$('storyboard')])panel.addEventListener('click',e=>{const button=e.target.closest('[data-open]');if(button)openDetail(button.dataset.open)});
for(const id of TABS)$('tab-'+id).addEventListener('click',()=>setTab(id));
document.querySelector('.view-tabs').addEventListener('keydown',e=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 e.preventDefault();const tabs=TABS;const index=tabs.indexOf(activeTab);const tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[tabs.length-1]:tabs[(index+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];setTab(tab);$('tab-'+tab).focus();
});
if(!model.video){$('tab-previs').textContent='미리보기';$('tab-storyboard').textContent='구성';}

$('search').addEventListener('input',renderCards);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).close()));
$('detail-dialog').addEventListener('close',()=>{$('detail-preview').querySelectorAll('video,audio').forEach(x=>{x.pause();x.removeAttribute('src');x.load()});const b=$(activeTab==='storyboard'?'storyboard':'cards').querySelector('[data-open="'+current+'"]');if(b)b.focus()});
function refresh(){try{sessionStorage.setItem(key+':view',JSON.stringify({scroll:scrollY,scope,tab:activeTab,search:$('search').value}))}catch(e){}location.reload()}
$('reload').addEventListener('click',refresh);
navigation();
try{const saved=JSON.parse(sessionStorage.getItem(key+':view')||'null');if(saved){scope=byId.has(saved.scope)?saved.scope:'';activeTab=TABS.includes(saved.tab)?saved.tab:'previs';$('search').value=saved.search||'';requestAnimationFrame(()=>scrollTo(0,saved.scroll||0));sessionStorage.removeItem(key+':view')}}catch(e){}
setTab(activeTab);
function followHash(){let linked;try{linked=decodeURIComponent(location.hash.slice(1)).replace(/^node-/,'')}catch(e){return}if(byId.has(linked)){if(byId.get(linked).leaf)openDetail(linked);else{scope=linked;renderCards()}}}
followHash();window.addEventListener('hashchange',followHash);window.addEventListener('pageshow',renderCards);
</script>
</body></html>
